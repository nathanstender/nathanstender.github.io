  const cy = camY;

    camY = 0;
    player.x = titleShow.x;
    player.y = titleShow.footY - 56;
    player.facing = titleShow.facing;
    player.vx = titleShow.walking ? titleShow.facing * 2.6 : 0;
    player.vy = 0;

    player.vy = snap.vy;

    player.swingTimer = snap.swingTimer;
    player.weapons = snap.weapons;
    player.hasSantaSleigh = snap.hasSantaSleigh;
    player.armorHead = snap.armorHead;
    player.armorLegs = snap.armorLegs;
    player.armorFeet = snap.armorFeet;
    player.devSlot1 = snap.devSlot1;
    player.isFiringLaser = snap.isFiringLaser;

    camY = cy;
  }
}

function updateTitleScreen() {
  updateTitleShow();
  const go = (keys[' '] || keys['Enter']) && !titleMenu.wait;
  let acted = false;
  if (titleMenu.page === 'main') {
    if (keys['ArrowUp']) {
      titleMenu.selected = (titleMenu.selected + 3) % 4;
      keys['ArrowUp'] = false;
    } else if (keys['ArrowDown']) {
      titleMenu.selected = (titleMenu.selected + 1) % 4;
      keys['ArrowDown'] = false;
    } else if (go) {
      acted = true;
      titleMenu.wait = true;
      if (titleMenu.selected === 0) startGameFromMenu();
      else if (titleMenu.selected === 1) {
        titleMenu.page = 'difficulty';
        titleMenu.selected = ['easy', 'normal', 'hard', 'endless'].indexOf(difficulty);
        if (titleMenu.selected < 0) titleMenu.selected = 0;
      } else if (titleMenu.selected === 2) devMode = !devMode;
      else titleMenu.page = 'credits';
    }
  } else if (titleMenu.page === 'difficulty') {
    if (keys['ArrowUp']) {
      titleMenu.selected = (titleMenu.selected + 3) % 4;
      keys['ArrowUp'] = false;
    } else if (keys['ArrowDown']) {
      titleMenu.selected = (titleMenu.selected + 1) % 4;
      keys['ArrowDown'] = false;
    } else if (go) {
      acted = true;
      difficulty = ['easy', 'normal', 'hard', 'endless'][titleMenu.selected];
      titleMenu.page = 'main';
      titleMenu.selected = 1;
      titleMenu.wait = true;
    }
  } else if (go || keys['Escape']) {
    acted = true;
    titleMenu.page = 'main';
    titleMenu.selected = 3;
    titleMenu.wait = true;
    keys['Escape'] = false;
  }
  if (!acted && !keys[' '] && !keys['Enter']) titleMenu.wait = false;
  drawTitleScreen();
}

  ctx.fillStyle = '#000';

}

  if (player.hitThisSwing) player.hitThisSwing.clear();
  player.isFiringLaser = false;
  player.hitFlash = 0;
  micWeapon.state = 'ready';
  micWeapon.vx = 0;
  micWeapon.vy = 0;
  keys[' '] = false;
  keys['f'] = false;
  keys['F'] = false;
  player.y = groundY - player.h;
  showerDrops = [];
  document.getElementById('gameOver').style.display = 'none';
  document.getElementById('ui').style.display = 'none';
  document.getElementById('bossHP').style.display = 'none';
  document.getElementById('levelMsg').style.display = 'none';
  document.getElementById('killMsg').style.display = 'none';
}

function updateShowerEnding() {
  player.vx = 0;
  if (keys['ArrowLeft']) { player.vx = -player.speed; player.facing = -1; }
  if (keys['ArrowRight']) { player.vx = player.speed; player.facing = 1; }
  if (keys['ArrowUp'] && player.onGround) player.vy = -player.jump;
  player.vy += 0.68;
  if (player.vy > 16) player.vy = 16;
  player.x += player.vx;
  player.y += player.vy;
  if (player.y + player.h > groundY) {
    player.y = groundY - player.h;
    player.vy = 0;
    player.onGround = true;
  } else player.onGround = false;
  camX = player.x + 16 - W / 2;
  camY = 0;
  for (let i = 0; i < 8; i++) {
    const spread = (Math.random() - 0.5) * 80;
    showerDrops.push({
      x: player.x + 16 + spread,
      y: 28 + Math.random() * 16,
      vx: spread * 0.03,
      vy: 6 + Math.random() * 5,
      life: 150
    });
  }
  for (let i = showerDrops.length - 1; i >= 0; i--) {
    const d = showerDrops[i];
    d.x += d.vx;
    d.y += d.vy;
    d.vy += 0.08;
    d.life--;
    if (d.life <= 0 || d.y > player.y + player.h + 24) showerDrops.splice(i, 1);
  }
}

function drawShowerEnding() {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#241c14';
  ctx.fillRect(0, groundY - camY, W, H - (groundY - camY));
  const hx = player.x + 16 - camX;
  ctx.fillStyle = '#9aa0a6';
  ctx.fillRect(hx - 36, 18, 72, 14);
  ctx.fillStyle = '#d7dde2';
  for (let i = -2; i <= 2; i++) ctx.fillRect(hx + i * 12 - 2, 32, 4, 6);
  drawPlayerAndInventory();
  for (let i = 0; i < showerDrops.length; i++) {
    const d = showerDrops[i];
    ctx.fillStyle = i % 3 === 0 ? '#ffffff' : '#8ec8ff';
    ctx.fillRect(d.x - camX, d.y - camY, 3, 11);
  }
}

function gameFrame() {
  if (gameState === STATE_TITLE) {
    updateTitleScreen();
    return;
  }
  if (endingShower) {
    frameCount++;
    updateShowerEnding();
    drawShowerEnding();
    return;
  }
  frameCount++;

  // ???1 flying tunnel. This returns before the overworld so gravity, platforms, and E-to-exit stay out.
  if (inSecretDimension && secretDimensionLevel === 1) {
    if (!lifeForce) initLifeForce();
    if (!gameIsOver && !isReviving) updateLifeForce();
    camX = player.x + player.w / 2 - W * 0.5;
    camY = player.y + player.h / 2 - H * 0.5;
    drawLifeForce();
    if (lifeForce && lifeForce.exitNow && !window._drawMuted) exitLifeForce();
    return;
  }

  const theme = themes[currentLevel] || themes[1];

  // ====================== NEW PARALLAX BACKGROUND SYSTEM ======================
  if (inSecretDimension && secretDimensionLevel === 1) {
    // ???1 - blank white void, player still in sleigh, no ground/platforms/horizon
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, W, H);

    // Draw ???1 title
    ctx.fillStyle = '#111';
    ctx.font = 'bold 72px Arial';
    ctx.textAlign = 'center';
    ctx.fillText("???1", W / 2, 120);
    ctx.textAlign = 'left';

    // Draw the player in the sleigh
    drawPlayerAndInventory();

    // Do NOT return — let the rest of the loop run for camera + HUD
  } else {

  drawParallaxBackground(theme, camY);

  ctx.fillStyle = difficulty === 'endless' ? endlessGroundCss() : theme.ground;
  ctx.fillRect(0, groundY - camY, W, H + 400);

  ctx.fillStyle = theme.plat;
  forPlatformsBetween(camX - 1040, camX + W + 800, function (p) {
    const sx = p.l - camX;
    const sy = p.t - camY;
    const pw = p.r - p.l;
    if (sx < W + 800 && sx + pw > -800) {
      ctx.fillRect(sx, sy, pw, 26);
      if (theme.sprinkle) {
        ctx.fillStyle = theme.sprinkle;
        for (let d of (p.deco || [])) {
          ctx.fillRect(sx + d.x, sy + d.y, d.sw || 6, d.sh || 4);
        }
        ctx.fillStyle = theme.plat;
      }
    }
  });

  // Draw secret portal on level 1 (high up, only when player has sleigh)
  if (currentLevel === 1 && secretPortal && !inSecretDimension) {
    const px = secretPortal.x - camX;
    const py = secretPortal.y - camY;
    const r = secretPortal.radius;
    const t = frameCount * 0.08;

    // === Strong vertical energy beam going downward (highly visible from below) ===
    const beamLength = 1800; // very tall beam so it's visible from far below
    const gradient = ctx.createLinearGradient(px, py, px, py + beamLength);
    gradient.addColorStop(0, 'rgba(0, 255, 150, 0.55)');
    gradient.addColorStop(0.15, 'rgba(0, 255, 180, 0.35)');
    gradient.addColorStop(1, 'rgba(0, 255, 150, 0.0)');
    ctx.fillStyle = gradient;
    ctx.fillRect(px - 22, py, 44, beamLength);

    // Outer green ring (bigger)
    ctx.strokeStyle = '#00ff99';
    ctx.lineWidth = 12;
    ctx.beginPath();
    ctx.arc(px, py, r, 0, Math.PI * 2);
    ctx.stroke();

    // Inner bright energy
    ctx.fillStyle = '#00dd88';
    ctx.beginPath();
    ctx.arc(px, py, r * 0.82, 0, Math.PI * 2);
    ctx.fill();

    // Swirling inner portal (Rick and Morty style)
    ctx.strokeStyle = '#aaffdd';
    ctx.lineWidth = 3;
    for (let i = 0; i < 14; i++) {
      const a1 = t + i * 0.52;
      const a2 = a1 + 0.85;
      const r1 = r * (0.22 + (i % 4) * 0.11);
      const r2 = r * (0.52 + (i % 4) * 0.13);
      ctx.beginPath();
      ctx.moveTo(px + Math.cos(a1) * r1, py + Math.sin(a1) * r1);
      ctx.lineTo(px + Math.cos(a2) * r2, py + Math.sin(a2) * r2);
      ctx.stroke();
    }

    // Center bright core + pulsing
    const pulse = 0.6 + Math.sin(frameCount * 0.12) * 0.4;
    ctx.fillStyle = `rgba(200, 255, 230, ${pulse})`;
    ctx.beginPath();
    ctx.arc(px, py, r * 0.32, 0, Math.PI * 2);
    ctx.fill();

    // Very strong outer glow (pulsing)
    ctx.strokeStyle = `rgba(0, 255, 150, ${0.25 + Math.sin(frameCount * 0.1) * 0.15})`;
    ctx.lineWidth = 22;
    ctx.beginPath();
    ctx.arc(px, py, r * 1.18, 0, Math.PI * 2);
    ctx.stroke();
  }

  for (let e of enemies) e.draw();
  if (boss) boss.draw();
  if (boss2) boss2.draw();
  drawPlayerAndInventory();

  // Warp / wormhole transition effect when entering the portal
  if (warpTimer > 0) {
    const progress = warpTimer / 210;
    ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
    ctx.fillRect(0, 0, W, H);

    // Intense swirling vortex lines (warp speed feel)
    ctx.strokeStyle = '#00ffcc';
    ctx.lineWidth = 2;
    const centerX = W / 2;
    const centerY = H / 2;

    for (let i = 0; i < 36; i++) {
      const angle = (i * 0.18) + (frameCount * 0.22 * (1.2 - progress * 0.6));
      const len = 120 + (1 - progress) * 380 + Math.sin(i) * 40;
      const x1 = centerX + Math.cos(angle) * 30;
      const y1 = centerY + Math.sin(angle) * 25;
      const x2 = centerX + Math.cos(angle) * len;
      const y2 = centerY + Math.sin(angle) * len * 0.7;

      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();
    }

    // Extra bright streaks
    ctx.strokeStyle = '#aaffff';
    ctx.lineWidth = 1;
    for (let i = 0; i < 18; i++) {
      const a = (i * 0.4) + frameCount * 0.35;
      const l = 80 + (1 - progress) * 500;
      ctx.beginPath();
      ctx.moveTo(centerX, centerY);
      ctx.lineTo(centerX + Math.cos(a) * l, centerY + Math.sin(a) * l * 0.65);
      ctx.stroke();
    }

    // Slight chromatic aberration on the player/sleigh during warp
    const shake = (1 - progress) * 8;
    ctx.globalAlpha = 0.5 + progress * 0.4;
    drawPlayerAndInventory(); // re-draw sleigh with distortion feel
    ctx.globalAlpha = 1;

    warpTimer--;

    if (warpTimer <= 0) {
      // Transition complete — enter the secret white dimension
      inSecretDimension = true;
      secretDimensionLevel = 1;
      secretPortal = null;
      enemies = [];
      boss = null;
      boss2 = null;
      worldSleighs = [];
      player.hasSantaSleigh = true; // keep the sleigh

      // Fully clear any leftover level 1 salesman state
      salesmanMenu.active = false;
      salesmanMenu.hasBeenShownThisFight = false;
      salesmanMenu.carOffer = null;
      gamePaused = false;
      pauseReason = null;
      // Player keeps flying controls in the void
    }
  }

  // Draw dropped sleighs in the world
  for (let s of worldSleighs) {
    const sx = s.x - camX;
    const sy = s.y - camY;

    // Green Futurama-style sleigh (on the ground)
    ctx.fillStyle = '#2e7d32'; // green body
    ctx.beginPath();
    ctx.moveTo(sx - 28, sy);
    ctx.lineTo(sx + 32, sy);
    ctx.lineTo(sx + 38, sy + 18);
    ctx.lineTo(sx - 34, sy + 18);
    ctx.closePath();
    ctx.fill();

    // Gold runners
    ctx.fillStyle = '#f4c430';
    ctx.fillRect(sx - 32, sy + 16, 70, 5);
    ctx.fillRect(sx - 30, sy + 8, 8, 10);
    ctx.fillRect(sx + 26, sy + 8, 8, 10);

    // Seat
    ctx.fillStyle = '#1b5e20';
    ctx.fillRect(sx - 18, sy - 2, 28, 10);

    // Glowing lights
    ctx.fillStyle = '#00f0ff';
    ctx.fillRect(sx - 24, sy + 4, 4, 4);
    ctx.fillRect(sx + 18, sy + 4, 4, 4);
  }
  
    // ====================== WEAPON DAMAGE - FIRST CONTACT ONLY ======================
  // Clean first-contact system: damage happens the moment a weapon touches something new during the current swing.
  // No more multi-frame spam or double systems.
  if (player.swingTimer > 0 && gameState === STATE_PLAYING) {
    checkWeaponFirstContact();
  } else {
    player.hitThisSwing.clear();
  }

  if (gooDropCool > 0) gooDropCool--;
  if (gooPoolCool > 0) gooPoolCool--;
  for (let i = bossBullets.length - 1; i >= 0; i--) {
    let b = bossBullets[i];
    if (b && typeof b.update === 'function') b.update();
    if (b && typeof b.draw === 'function') b.draw();
    if (b && b.life <= 0) bossBullets.splice(i, 1);
  }
  tickShowerPuddles();
  tickSauceAndFarts();

  for (let i = gooPuddles.length - 1; i >= 0; i--) {
    let p = gooPuddles[i];
    if (!p.drip) p.life--;
    ctx.fillStyle = p.color || '#39ff14';
    if (!p.drip) { ctx.shadowBlur = 8; ctx.shadowColor = p.color || '#39ff14'; }
    ctx.fillRect(p.x - p.w/2 - camX, p.y - 4 - camY, p.w, 8);
    ctx.shadowBlur = 0;
    if (player.x + 32 >= p.x - p.w/2 && player.x <= p.x + p.w/2 &&
        player.y + 60 >= p.y - 8 && player.y + 60 <= p.y + 4) {
      if (p.drip) {
        hurtFromGoo(player.armorFeet.includes('spike_shoes') ? 3 : 6, true);
      } else {
        // Fly shoes 50% protection on ground goo/hazards (Step 5)
        let damageTaken = (p.damage || 0.6);
        if (player.armorFeet.includes('fly_shoes')) {
          damageTaken = damageTaken * 0.5;
        }
        // Apply a bit of the resistance too for good measure (scaled like other dmg)
        const resistFactor = Math.min(100, player.resistance) / 100;
        damageTaken = Math.max(0.1, damageTaken * (1 - resistFactor * 0.5));
        player.hp -= damageTaken;
        player.hitTimer = 5; player.hitFlash = 12;
        document.getElementById('hp').textContent = Math.floor(player.hp);
        floatingText(player.x + 16, player.y - 25, '-' + damageTaken.toFixed(1), '#f00');
      }
    }
    if (p.life <= 0 || (p.drip && p.y > groundY + 80)) gooPuddles.splice(i,1);
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx||0; p.y += p.vy||0; p.vy = (p.vy||0)+0.37; p.life--;
    if (p.life <= 0) { particles.splice(i,1); continue; }
    ctx.globalAlpha = p.life / 52;
    ctx.fillStyle = p.c;
    ctx.fillRect(p.x - camX - (p.s||8)/2, p.y - camY - (p.s||8)/2, p.s||8, p.s||8);
  }
  ctx.globalAlpha = 1;

  for (let i = floatingTexts.length - 1; i >= 0; i--) {
    const t = floatingTexts[i];
    t.y += t.vy; t.life--;
    if (t.life <= 0) { floatingTexts.splice(i,1); continue; }
    ctx.globalAlpha = t.life / 58;
    ctx.fillStyle = t.color;
    ctx.font = "bold 22px Arial"; ctx.textAlign = "center";
    ctx.fillText(t.text, t.x - camX, t.y - camY);
  }
  ctx.globalAlpha = 1; ctx.textAlign = "left";

  // Draw salesman menu on top if active
  if (pauseReason === 'salesman_menu') {
    drawSalesmanMenu();
  }

  // Exit prompt while in Santa Sleigh
  if (player.hasSantaSleigh && !gamePaused) {
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 18px Arial';
    ctx.textAlign = 'center';
    ctx.fillText("Press E to Exit Sleigh", W / 2, 50);
    ctx.textAlign = 'left';
  }

  if (gameIsOver || isReviving) return;

  updateWorldPickups();
  updateMicrophoneWeapon();

  if (gameState === STATE_REBUILDING) nextColumnX = Math.max(nextColumnX, player.x - 800);
  if (!gamePaused) {
    while (nextColumnX < player.x + W * 3.5) {
    const columnX = nextColumnX;
    let lastX = columnX; let lastLvl = 0;
    for (let i = 0; i < 12; i++) {
      let jumpDist = 180 + Math.random() * 140; 
      let direction = Math.random() > 0.5 ? 1 : -1;
      let nextX = lastX + (jumpDist * direction);
      let lvlStep = Math.random() > 0.3 ? 1 : (Math.random() > 0.5 ? 0 : -1);
      let currentLvl = Math.max(0, Math.min(9, lastLvl + lvlStep));
      const w = 140 + Math.random() * 100;
      const t = platformHeights[currentLvl];
      let newPlat = { l: nextX, r: nextX + w, t: t, deco: [] };
      const sprinkleCount = Math.floor(w / 15); 
      for (let s = 0; s < sprinkleCount; s++) {
        newPlat.deco.push({ x: Math.random() * w, y: Math.random() * 18, sw: 2 + Math.random() * 10, sh: 2 + Math.random() * 8 });
      }
      platforms.push(newPlat);
      if (Math.random() < 0.4) {
        let branchX = nextX + (Math.random() > 0.5 ? 350 : -350);
        let bw = 100 + Math.random() * 80;
        let branchPlat = { l: branchX, r: branchX + bw, t: t, deco: [] };
        for (let s = 0; s < Math.floor(bw/15); s++) {
          branchPlat.deco.push({ x: Math.random() * bw, y: Math.random() * 18, sw: 2 + Math.random() * 10, sh: 2 + Math.random() * 8 });
        }
        platforms.push(branchPlat);
      }
      lastX = nextX;
      lastLvl = currentLvl;
    }
    nextColumnX += 520 + Math.random() * 160;
  }
  }  // close the if (!gamePaused) for platform generation

  // Platforms stay for the whole level so walking back still finds them.
  // They are cleared when the next level rebuilds. Off-screen ones are not drawn.

  if (gameState === STATE_PLAYING && !gamePaused) {
    if (!inSecretDimension) ensureModifierDrops();

    // Swinging is completely disabled while in the Santa Sleigh
    if (!player.hasSantaSleigh) {
      if (keys[' ']) {
        player.swingTimer = (player.swingTimer + 1) % 20;
        if (player.swingTimer === 1) releaseSpiders();
        if (micWeapon.equipped && micWeapon.state === 'ready') {
          micWeapon.state = 'thrown';
          micWeapon.x = player.x + player.w / 2;
          micWeapon.y = player.y + player.h / 3;
          micWeapon.vx = player.facing * 14;
          micWeapon.vy = -6;
          micWeapon.hitCooldown = 0;
        }
      } else {
        if (player.swingTimer > 0) player.swingTimer = Math.max(0, player.swingTimer - 3);
      }
    } else {
      // Force no weapons while in sleigh
      player.swingTimer = 0;
    }

    if (player.hasSantaSleigh) {
      // ====================== SANTA'S SLEIGH - FULL FLYING ======================
      // More momentum / faster flight feel
      const flySpeed = 10.5;
      const accel = 0.95;
      const friction = 0.945;

      // Horizontal
      if (keys['ArrowLeft']) {
        player.vx -= accel;
        player.facing = -1;
      } else if (keys['ArrowRight']) {
        player.vx += accel;
        player.facing = 1;
      } else {
        player.vx *= friction;
      }

      // Vertical (Up = ascend, Down = descend)
      if (keys['ArrowUp']) {
        player.vy -= accel;
      } else if (keys['ArrowDown']) {
        player.vy += accel;
      } else {
        player.vy *= friction;
      }

      // Clamp speed
      const maxSpeed = flySpeed;
      player.vx = Math.max(-maxSpeed, Math.min(maxSpeed, player.vx));
      player.vy = Math.max(-maxSpeed, Math.min(maxSpeed, player.vy));

      // Apply movement (no gravity, no platform collision while flying)
      player.x += player.vx;
      player.y += player.vy;

      player.coyoteTime = 8;
      player.onGround = false;

    } else {
      // ====================== NORMAL PLATFORMER MOVEMENT ======================
      player.vx = 0;
      // Fly shoes speed boost (Step 4)
      let speedMod = player.armorFeet.includes('fly_shoes') ? 1.3 : 1.0;
      if (keys['ArrowLeft']) { player.vx = -player.speed * speedMod; player.facing = -1; }
      if (keys['ArrowRight']) { player.vx = player.speed * speedMod; player.facing = 1; }
      if (keys['ArrowUp'] && player.coyoteTime > 0) {
        // 1.47 => vy ~22, same as the 2-platform boss hop. 2.0 cleared 4+ platforms.
        let jumpMod = player.armorFeet.includes('fly_shoes') ? 1.47 : 1.0;
        player.vy = -player.jump * jumpMod;
        player.coyoteTime = 0;
      }
      const dropping = keys['ArrowDown'];
      const dt = window._dt || 1;
      player.x += player.vx * dt;
      player.vy += 0.68 * dt;
      const fallDy = player.vy * dt;
      let ly = player.settleDrop ? landBelow(player, fallDy) : landOn(player, player.vy, dropping);
      if (ly !== null && player.vy >= 0) {
        player.y = ly; player.vy = 0; player.onGround = true; player.coyoteTime = 8;
        player.settleDrop = false;
      } else {
        player.y += fallDy; player.onGround = false;
        if (player.coyoteTime > 0) player.coyoteTime--;
      }
      // safety clamp to prevent falling below ground/screen (overshoot fix)
      if (player.y + player.h > groundY) {
        player.y = groundY - player.h;
        player.vy = 0;
        player.onGround = true;
        player.coyoteTime = 8;
        player.settleDrop = false;
      }
    }

  } else if (gamePaused && pauseReason === 'salesman_menu') {
    // Completely freeze player physics while the car salesman menu is open
    player.vx = 0;
    player.vy = 0;
  } else if (gameState === STATE_EXPLODING || gameState === STATE_REBUILDING) {
    player.vx = 0;
    player.vy = 0;
  }

  if (gameState === STATE_PLAYING && !gamePaused) {
    updateLaserGlasses();
  } else {
    player.isFiringLaser = false;
  }

  // Stand still timer (used by Used Car Salesman)
  if (!gamePaused && Math.abs(player.vx) < 0.6 && Math.abs(player.vy) < 0.6) {
    player.standStillTimer = (player.standStillTimer || 0) + 1;
  } else if (!gamePaused) {
    player.standStillTimer = 0;
  }

  // ====================== SALESMAN MENU INPUT ======================
  if (gamePaused && pauseReason === 'salesman_menu' && salesmanMenu.active) {
    // Allow selection to change even if awaiting key release
    const list = salesmanMenu.list || [];
    if (keys['ArrowUp']) {
      salesmanMenu.selected = (salesmanMenu.selected - 1 + list.length) % Math.max(1, list.length);
      keys['ArrowUp'] = false;
    } else if (keys['ArrowDown']) {
      salesmanMenu.selected = (salesmanMenu.selected + 1) % Math.max(1, list.length);
      keys['ArrowDown'] = false;
    }

    // Only accept confirmation after the player has released space at least once since the menu opened
    if ((keys[' '] || keys['Enter']) && !salesmanMenu.awaitingKeyRelease) {
      chooseDealerVehicle(list[salesmanMenu.selected]);
      keys[' '] = keys['Enter'] = false;
    }

    // Once space is released, allow future presses to confirm
    if (!keys[' ']) {
      salesmanMenu.awaitingKeyRelease = false;
    }
  }

  // ====================== EXIT SANTA SLEIGH ======================
  if (player.hasSantaSleigh && (keys['e'] || keys['E'])) {
    // Spawn a persistent sleigh in the world that falls to the ground
    worldSleighs.push({
      x: player.x,
      y: player.y + 10,
      vx: player.vx * 0.4,   // carry some horizontal momentum
      vy: 1.5,
      landed: false
    });

    // Exit sleigh mode
    player.hasSantaSleigh = false;

    // Give the player back the spork
    if (!player.weapons.includes('spork')) {
      player.weapons.push('spork');
    }

    // Small push so player doesn't immediately re-enter
    player.vy = Math.max(player.vy, 2);

    keys['e'] = keys['E'] = false;
  }

  camX = player.x - W * 0.47;
  camY += (Math.min(0, player.y - H * 0.57) - camY) * 0.13;

  if (!gamePaused) {
    for (let e of enemies) e.update();
    reapShrunkEnemies();
    if (boss) boss.update();
    if (boss2) boss2.update();
    updateLooseSpiders();
    // remove exploded left enemies
    enemies = enemies.filter(e => !e.exploded);

    // Update dropped sleighs (gravity + landing)
    for (let s of worldSleighs) {
      if (s.landed) continue;

      s.vy += 0.68;
      s.x += s.vx;
      s.y += s.vy;

      // Simple landing
      if (s.y > groundY - 20) {
        s.y = groundY - 20;
        s.vy = 0;
        s.vx *= 0.3; // slow down on ground
        s.landed = true;
      }
    }

    // Check for re-entering a sleigh
    if (!player.hasSantaSleigh && (keys['e'] || keys['E'])) {
      for (let i = worldSleighs.length - 1; i >= 0; i--) {
        const s = worldSleighs[i];
        const dist = Math.hypot(player.x - s.x, player.y - s.y);
        if (dist < 60) {
          // Enter the sleigh
          player.hasSantaSleigh = true;
          worldSleighs.splice(i, 1); // remove from world
          player.vx = 0;
          player.vy = -2; // small upward kick on entry
          break;
        }
      }
      keys['e'] = keys['E'] = false;
    }

    // Spawn secret high portal once player has the sleigh on level 1
    if (currentLevel === 1 && player.hasSantaSleigh && !secretPortal && !inSecretDimension) {
      secretPortal = {
        x: 850,
        y: groundY - (44 * 148),
        radius: 95   // made much larger and more obvious
      };
    }

    // Check if player in sleigh reaches the portal center
    if (currentLevel === 1 && player.hasSantaSleigh && secretPortal && !inSecretDimension && warpTimer <= 0) {
      const dx = player.x - secretPortal.x;
      const dy = player.y - secretPortal.y;
      if (Math.hypot(dx, dy) < secretPortal.radius * 0.55) {
        warpTimer = 210; // ~3.5 seconds of warp effect
      }
    }
  }

  const target = killsForLevel(currentLevel);
  const killedThisLevel = totalKills - killsAtStartOfLevel;
  updateEndlessWaves();

  // Endless ambient enemies (normal right-side + left exploding): spawn as player moves horizontally.
  // Decoupled from the "target" quota — the quota only controls when the boss appears.
  // Normal enemies and left-exploding enemies BOTH continue spawning even while any boss is active (additional pressure, not quiet boss time).
  const plan = enemySpawnPlan();
  const crowd = plan.crowd;
  const maxLive = plan.maxLive;
  const spawnInterval = plan.travelGap;
  if (plan.bossFight && bossSpawnCool > 0) bossSpawnCool--;
  const travelDue = lastEnemySpawnX < 0 || player.x > lastEnemySpawnX + spawnInterval;
  const timeDue = plan.bossFight && bossSpawnCool <= 0;
  if (difficulty !== 'endless' && !inSecretDimension && gameState === STATE_PLAYING && !gamePaused &&
      enemies.length < maxLive &&
      (travelDue || timeDue) &&
      Math.random() < (plan.bossFight ? 0.8 : 0.62)) {
    let spawnX, spawnY;
    // Spawn off-screen (to the right of camera) so they don't pop in right in front of the player.
    // Use camX + W to guarantee just off the right edge of the view. Fall back to far ahead of player.
    const offscreenMinX = camX + W + 40;
    const validPlatforms = platformsAheadForSpawns();
    const p = pickSpreadSpawnPlatform(validPlatforms);
    if (p) {
      spawnX = p.l + Math.random() * Math.max(8, p.r - p.l - ENEMY_W * ENEMY_SCALES[ENEMY_SCALES.length - 1]);
      spawnY = p.t;
    } else {
      spawnX = Math.max(player.x + 900, offscreenMinX) + Math.random() * 400;
      spawnY = groundY - Math.random() * 40;
    }
    const type = Math.random() < 0.4 ? 1 : (Math.random() < 0.3 ? 2 : 0);
    enemies.push(new Enemy(spawnX, spawnY, type));
    lastEnemySpawnX = player.x;
    if (plan.bossFight) bossSpawnCool = plan.timeGap;
  }

  // LEFT side small exploding enemies: spawn reliably as player moves LEFT (to prevent cheese by running left forever, no left platforms).
  // Start ~5 screens left. 1-2 at a time. These (and normal enemies) spawn even while boss is active.
  if (difficulty !== 'endless' && !inSecretDimension && gameState === STATE_PLAYING && !gamePaused && enemies.length < maxLive) {
    if (lastLeftEnemySpawnX > 900000) {
      lastLeftEnemySpawnX = player.x; // seed to current so first *deliberate* left movement (~520px) triggers spawns from the left
    }
    const leftStep = plan.leftStep;
    if (player.x < lastLeftEnemySpawnX - leftStep && Math.random() < 0.72) {
      const batch = (Math.random() < 0.35 ? 2 : 1) * crowd;
      for (let k = 0; k < batch && enemies.length < maxLive; k++) {
        let leftX = player.x - 5000 - Math.random() * 2200; // ~4-6 screens left, they chase right
        let leftY = groundY - 25 - Math.random() * 50;
        enemies.push(new SmallExplodingEnemy(leftX, leftY));
      }
      lastLeftEnemySpawnX = player.x;
    }
  }

  // Cull enemies far behind (for perf / to allow future right spawns).
  // SmallExplodingEnemy (left chasers) are exempt from tight left cull and get generous range so they can spawn 5+ screens left and approach.
  // They are also culled if passed far to the right (player ran the other way).
  if (difficulty !== 'endless') {
    for (let i = enemies.length - 1; i >= 0; i--) {
      const e = enemies[i];
      const isLeftChaser = (e instanceof SmallExplodingEnemy);
      const leftCullDist = isLeftChaser ? 8500 : 2100;
      if (e.x < player.x - leftCullDist || (isLeftChaser && e.x > player.x + 2800)) {
        enemies.splice(i, 1);
      }
    }
  }

  // Old snapshot damage check removed — replaced with proper first-contact system above.

  if (currentLevel === 3 && !lederhosenSpawned && frameCount > 180) {
    let spawnPlat = null;
    for (let p of platforms) {
      if (p.t <= platformHeights[5] && p.l > player.x + 800 && p.l < player.x + 2800) {
        spawnPlat = p;
        break;
      }
    }
    if (spawnPlat) {
      worldPickups.push({ id: 'lederhosen', x: spawnPlat.l + 50, y: spawnPlat.t - 35, w: 25, h: 20 });
      lederhosenSpawned = true;
    }
  }

  // Fly shoes on level 3 (mid platform, a little ahead of the lederhosen one)
  if (currentLevel === 3 && !flyShoesSpawned && frameCount > 220) {
    let spawnPlat = null;
    for (let p of platforms) {
      if (p.t <= platformHeights[3] && p.l > player.x + 600 && p.l < player.x + 2400) {
        spawnPlat = p;
        break;
      }
    }
    if (spawnPlat) {
      worldPickups.push({ id: 'fly_shoes', x: spawnPlat.l + 80, y: spawnPlat.t - 30, w: 25, h: 20 });
      flyShoesSpawned = true;
    }
  }

  if (difficulty !== 'endless' && !inSecretDimension && killedThisLevel >= target && !boss && gameState === STATE_PLAYING) {
    if (currentLevel === 1) boss = new UsedCarSalesman(player.x + 800);
    else if (currentLevel === 2) boss = new BunnyWithAKnife(player.x + 800);
    else if (currentLevel === 3) boss = new HandymanSanders(player.x + 800);
    else if (currentLevel === 4) boss = new ErrorPopupBoss(player.x + 800);
    else if (currentLevel === 5) boss = new BlueMysticBoss(player.x + 800);
    else if (currentLevel === 6) { boss = new NunSisterBoss(player.x + 700, 'AK'); boss2 = new NunSisterBoss(player.x + 950, 'SMG'); }
    else if (currentLevel === 7) boss = new HotSauceToddlerBoss(player.x + 800);
    else if (currentLevel === 8) boss = new ComicConGuyBoss(player.x + 800);
    else if (currentLevel === 9) boss = new GrimbyBoss(player.x + 800);
    else if (currentLevel === 10) boss = new ShowerHeadBoss(player.x + 700);

    const messages = {1:"HEY YOU- BUY A CAR OR I START BLASTIN!",6:"PRAY FOR DEATH LOSER!",10:"nice refreshing shower! right over here!"};
    showKillMsg(messages[currentLevel] || "BOSS INCOMING!");
    document.getElementById('bossHP').style.display = 'block';
  }

  if (boss && boss.hp <= 0) {
    boss = null; boss2 = null; bossBullets = []; gooPuddles = []; gooGroupLife = 0; saucePuddles = []; sauceBatchLife = 0; fartClouds = []; enemies = [];
    gameState = STATE_EXPLODING; transitionTimer = 100;
    platforms.forEach(p => { p.vx = (Math.random() - 0.5)*15; p.vy = Math.random()*-12-6; });
    document.getElementById('bossHP').style.display = 'none';
    if (currentLevel === 10) startShowerEnding();

    // Reset salesman menu state for next time
    salesmanMenu.hasBeenShownThisFight = false;
    salesmanMenu.active = false;
    salesmanMenu.carOffer = null;
    gamePaused = false;
    pauseReason = null;
  }
  if (boss2 && boss2.hp <= 0) boss2 = null;

  if (gameState === STATE_EXPLODING) {
    transitionTimer--;
    platforms.forEach(p => {
      p.vy += 0.65;
      p.l += p.vx || 0;
      p.t += p.vy || 0;
    });
    platIndexEpoch++;
    if (transitionTimer <= 0) {
      if (currentLevel >= 10) startShowerEnding();
      else {
        currentLevel++;
        killsAtStartOfLevel = totalKills;
        gameState = STATE_REBUILDING;
        rebuildFrames = 0;
        platforms = [];
        platIndexEpoch++;
        player.vx = 0;
        player.vy = 0;
        nextColumnX = player.x - 800;
        lastEnemySpawnX = player.x - 180;
        lastLeftEnemySpawnX = player.x;
        document.getElementById('lvl').textContent = currentLevel;
        showLevelMsg(`LEVEL ${currentLevel} FORMING...`);
        lederhosenSpawned = false;
        flyShoesSpawned = false;
      }
    }
  }

  if (gameState === STATE_REBUILDING) {
    rebuildFrames++;
    player.vx = 0;
    player.vy = 0;
    beginPlatformRise();
    const rising = stepPlatformRise();
    if ((!rising && platforms.length > 0) || rebuildFrames > 240) {
      for (const p of platforms) if (p.homeT != null) p.t = p.homeT;
      gameState = STATE_PLAYING;
      player.hp = Math.min(player.maxHp, player.hp + 30);
      document.getElementById('hp').textContent = Math.floor(player.hp);
      player.vx = 0;
      player.vy = 0;
      player.onGround = false;
      player.coyoteTime = 0;
      player.settleDrop = !player.hasSantaSleigh;
      levelAnchorX = player.x;
      planModifierDrops();

      if (currentLevel === 2 && platforms.length > 4) {
        let spawnPlat = platforms[4];
        worldPickups.push({ id: 'stage_mic', x: spawnPlat.l + (spawnPlat.r - spawnPlat.l) * 0.5, y: spawnPlat.t - 20, w: 25, h: 20 });
      }
      if (currentLevel === 4 && platforms.length > 4) {
        let spawnPlat = platforms[4];
        worldPickups.push({ id: 'pink_guitar', x: spawnPlat.l + (spawnPlat.r - spawnPlat.l) * 0.5, y: spawnPlat.t - 24, w: 36, h: 24 });
      }
      lastEnemySpawnX = player.x - 120;
      lastLeftEnemySpawnX = player.x;
    }
  }

  const healing = (keys['z'] || keys['Z']) && player.hp < player.maxHp && gameState === STATE_PLAYING;
  if (healing) {
    regenTimer = (regenTimer || 0) + 1;
    if (regenTimer >= 50) {
      const heal = healTickAmount();
      player.hp = Math.min(player.maxHp, player.hp + heal);
      document.getElementById('hp').textContent = Math.floor(player.hp);
      floatingText(player.x + 16, player.y - 30, '+' + heal, '#0f0');
      regenTimer = 0;
    }
  } else regenTimer = 0;

  if (player.hitTimer > 0) player.hitTimer--;
  if (player.hitTimer <= 0 && gameState === STATE_PLAYING && !gamePaused) {
    let rawDamage = 0;
    for (let e of enemies) {
      if (player.x < e.x + e.w && player.x + player.w > e.x && player.y < e.y + e.h && player.y + player.h > e.y) {
        rawDamage = Math.floor(8 * enemyDamageMul()); break;
      }
    }
    if (boss && player.x < boss.x + boss.w && player.x + player.w > boss.x && player.y < boss.y + boss.h && player.y + player.h > boss.y) rawDamage = 12;
    if (boss2 && player.x < boss2.x + boss2.w && player.x + player.w > boss2.x && player.y < boss2.y + boss2.h && player.y + player.h > boss2.y) rawDamage = 12;

    if (rawDamage > 0) {
      const resistFactor = Math.min(100, player.resistance) / 100;
      let finalDamage = Math.max(1, Math.floor(rawDamage * (1 - resistFactor)));
      player.hp -= finalDamage;
      player.hitTimer = 45;
      player.hitFlash = 12;
      document.getElementById('hp').textContent = Math.floor(player.hp);
      floatingText(player.x + 16, player.y - 30, '-' + finalDamage, '#f00');
      if (player.hp <= 0) gameOver(false);
    }
  }

  }

  const hpContainer = document.getElementById('bossHP');
  const hpBar = document.getElementById('bossHPBar');
  if (boss || boss2) {
    hpContainer.style.display = 'block';
    let cur = 0, mx = 0;
    if (boss) { cur += boss.hp; mx += boss.maxHp; }
    if (boss2) { cur += boss2.hp; mx += boss2.maxHp; }
    hpBar.style.width = Math.max(0, (cur / mx) * 100) + '%';
    const col = hpColor(cur, mx);
    const shown = Math.max(0, Math.round(cur)) + '/' + Math.round(mx);
    hpBar.style.background = col;
    hpContainer.style.borderColor = col;
    const hpText = document.getElementById('bossHPText');
    hpText.textContent = shown;
    hpText.style.color = col;
    hpBar.textContent = '';
  } else if (difficulty === 'endless') {
    hpContainer.style.display = 'block';
    hpBar.style.width = '100%';
    hpBar.style.background = '#222';
    hpBar.style.color = '#fff';
    hpBar.style.textAlign = 'center';
    hpBar.style.font = 'bold 14px Arial';
    hpBar.style.lineHeight = '20px';
    const secs = waveWait > 0 ? Math.ceil(waveWait / 60) : 0;
    hpBar.textContent = secs > 0 ? ('WAVE ' + waveIndex + '  ' + secs) : ('WAVE ' + (waveIndex || 1));
    hpContainer.style.borderColor = '#e02020';
    const hpText = document.getElementById('bossHPText');
    hpText.textContent = waveLeft + '/' + waveTotal;
    hpText.style.color = '#e02020';
  } else {
    hpContainer.style.display = 'none';
    document.getElementById('bossHPText').textContent = '';
    hpBar.textContent = '';
  }

  if (inSecretDimension && secretDimensionLevel === 1) {
    document.getElementById('lvl').textContent = "???1";
    document.getElementById('kills').textContent = "?";
    document.getElementById('goal').textContent = "?";
  } else if (difficulty === 'endless') {
    document.getElementById('lvl').textContent = String(waveIndex || 1);
    document.getElementById('kills').textContent = waveLeft;
    document.getElementById('goal').textContent = waveTotal || 10;
  } else {
    const killsThisLevel = totalKills - killsAtStartOfLevel;
    // Show the real number of kills (can exceed the boss quota now that endless spawns exist).
    // The goal number is still the threshold that triggers the boss for the level.
    document.getElementById('kills').textContent = killsThisLevel;
    document.getElementById('goal').textContent = killsForLevel(currentLevel);
  }
  updateHUD();

  if (frameCount === 5 && difficulty !== 'endless') {
    if (platforms.length >= 7) {
      let p6 = platforms[5];
      let p7 = platforms[6];
      worldPickups = [
        { id: 'bone_club', x: (p6.l + p6.r) / 2, y: p6.t - 20, w: 25, h: 20 },
        { id: 'possum_helmet', x: (p7.l + p7.r) / 2, y: p7.t - 20, w: 25, h: 20 }
      ];
    }
    if (devMode) {
      worldPickups.push({ id: 'noid_helmet', x: player.x - 350, y: groundY - 25, w: 32, h: 25 });
      worldPickups.push({ id: 'laser_glasses', x: player.x - 315, y: groundY - 25, w: 25, h: 20 });
    }

  }
}

// ====================== INPUT ======================
const DEBUG_SPAWN_EXTRAS = [
  { id: 'santa_sleigh', label: 'Santa Sleigh', category: 'special' }
];
const DEBUG_CAT_LABELS = {
  weapon: 'Weapons',
  modifier: 'Modifiers',
  armor_head: 'Head Armor',
  armor_legs: 'Leg Armor',
  armor_feet: 'Foot Armor',
  special: 'Special',
  dev_slot: 'Dev Slot'
};

function debugItemLabel(id) {
  return id.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
}

function isDebugSpawnOpen() {
  return document.getElementById('debugSpawn').style.display === 'block';
}

function closeDebugSpawn() {
  document.getElementById('debugSpawn').style.display = 'none';
}

function fillDebugSpawnSelect() {
  const sel = document.getElementById('debugSpawnSelect');
  const prev = sel.value;
  const groups = {};
  for (const id in itemDB) {
    const cat = itemDB[id].category || 'special';
    if (!groups[cat]) groups[cat] = [];
    groups[cat].push({ id, label: debugItemLabel(id) });
  }
  for (const extra of DEBUG_SPAWN_EXTRAS) {
    if (itemDB[extra.id]) continue;
    if (!groups[extra.category]) groups[extra.category] = [];
    groups[extra.category].push({ id: extra.id, label: extra.label });
  }
  sel.innerHTML = '';
  const catOrder = ['weapon', 'modifier', 'armor_head', 'armor_legs', 'armor_feet', 'dev_slot', 'special'];
  const cats = catOrder.filter(c => groups[c]).concat(Object.keys(groups).filter(c => !catOrder.includes(c)));
  for (const cat of cats) {
    const og = document.createElement('optgroup');
    og.label = DEBUG_CAT_LABELS[cat] || cat;
    for (const item of groups[cat]) {
      const opt = document.createElement('option');
      opt.value = item.id;
      opt.textContent = item.label;
      og.appendChild(opt);
    }
    sel.appendChild(og);
  }
  if (prev && [...sel.options].some(o => o.value === prev)) sel.value = prev;
}

function openDebugSpawn() {
  fillDebugSpawnSelect();
  document.getElementById('debugSpawn').style.display = 'block';
  for (const k in keys) keys[k] = false;
  document.getElementById('debugSpawnSelect').focus();
}

function spawnDebugItem(name) {
  if (!name) return;
  if (name === 'santa_sleigh' || name === 'sleigh') {
    player.hasSantaSleigh = true;
  } else {
    worldPickups.push({ id: name, x: player.x + 80, y: player.y - 30, w: 28, h: 22 });
    if (name === 'stage_mic') micWeapon.equipped = true;
  }
}

window.onkeydown = e => {
  if (isDebugSpawnOpen()) {
    if (e.key === 'Escape' || (e.shiftKey && e.key.toUpperCase() === 'I')) {
      closeDebugSpawn();
      e.preventDefault();
    } else if (e.key === 'Enter') {
      spawnDebugItem(document.getElementById('debugSpawnSelect').value);
      e.preventDefault();
    }
    return;
  }

  if (!gameIsOver && !isReviving) keys[e.key] = true;

  if (e.shiftKey && e.key.toUpperCase() === 'I') {
    if (devMode && gameState === STATE_PLAYING) openDebugSpawn();
    e.preventDefault();
  }

  if (e.key.toLowerCase() === 'q' && !gameIsOver && !isReviving) {
    const dropped = [];
    for (let i = player.weapons.length - 1; i >= 1; i--) dropped.push(player.weapons.splice(i, 1)[0]);
    while (player.armorHead.length > 0) dropped.push(player.armorHead.pop());
    while (player.armorLegs.length > 0) dropped.push(player.armorLegs.pop());
    while (player.armorFeet.length > 0) dropped.push(player.armorFeet.pop());
    while (player.devSlot1.length > 0) {
      const devItem = player.devSlot1.pop();
      dropped.push(devItem);
    }
    while (player.modifiers.length > 0) dropped.push(player.modifiers.pop());
    looseSpiders.length = 0;
    if (!player.weapons.includes('stage_mic')) {
      micWeapon.equipped = false;
      micWeapon.state = 'ready';
    }
    player.isFiringLaser = false;
    for (let i = 0; i < dropped.length; i++) dropSpreadItem(dropped[i], i, 28, 22);
    updateResistance();
    updateHUD();
  }
};
window.onkeyup = e => {
  if (isDebugSpawnOpen()) return;
  keys[e.key] = false;
};

document.getElementById('debugSpawnBtn').onclick = () => {
  spawnDebugItem(document.getElementById('debugSpawnSelect').value);
};

document.getElementById('restartBtn').onclick = () => location.reload();

// ====================== START ======================
document.getElementById('ui').style.display = 'none';
updateHUD();
loop();
</script>
