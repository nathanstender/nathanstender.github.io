// ====================== BOSSES ======================
class UsedCarSalesman {
  constructor(x) {
    this.x = x; this.y = groundY - 200; this.w = 90; this.h = 180;
    this.hp = 500; this.maxHp = 500; this.vy = 0; this.walkCycle = 0;
    this.menuOffered = false;   // has the car menu appeared this fight?
    this.phase = 1;
    this.phaseTimer = 0;
    this.phase2Started = false;
    this.cheese = 0;
    this.rush = 0;
  }

  update() {
    if (inSecretDimension) return;
    if (gamePaused) return; // freeze while menu is open

    if (!this.phase) this.phase = 1;

    // detect menu closed to start phase 2 (enraged chase)
    if (this.menuOffered && !salesmanMenu.active && !this.phase2Started) {
      this.phase = 2;
      this.phase2Started = true;
      this.phaseTimer = 0;
    }

    const distToPlayer = Math.hypot(this.x - player.x, this.y - player.y);
    const isCloseEnough = distToPlayer < 520;

    if (!salesmanMenu.active && isCloseEnough && player.standStillTimer > 180) {
      this.menuOffered = true;
      salesmanMenu.hasBeenShownThisFight = true;
      openDealerOffer();
      return;
    }

    if (this.phase === 1) {
      // Walk toward the player. If they keep stepping so the offer never comes, sprint for a few seconds.
      if (this.rush > 0) {
        this.rush--;
        this.x += Math.sign(player.x - this.x) * 4.5;
        let onGround = landOn(this, 0, false) !== null;
        if (onGround && player.y < this.y - 100) this.vy = -22;
      } else {
        this.x += Math.sign(player.x - this.x) * 1.2;
        if (distToPlayer < 480 && player.standStillTimer < 20) {
          this.cheese++;
          if (this.cheese >= 180) {
            this.rush = 180;
            this.cheese = 0;
          }
        } else if (player.standStillTimer > 60 && this.cheese > 0) {
          this.cheese--;
        }
      }
    } else {
      // phase 2: enraged chase + jump, cycle 5s fast / 5s slow+fire
      this.phaseTimer++;
      const cycle = this.phaseTimer % 600; // 10s cycle (5 fast + 5 slow)

      if (cycle < 300) {
        // fast chase 5s, jump up 2 platforms high to reach player
        const speed = 4.5;
        this.x += Math.sign(player.x - this.x) * speed;
        // decide jump before physics so vy negative takes effect this frame's gravity
        let onGround = landOn(this, 0, false) !== null;
        if (onGround && player.y < this.y - 100) {
          this.vy = -22; // 2 platform high jump
        }
      } else {
        // slow + fire gun 5s
        this.x += Math.sign(player.x - this.x) * 1.0;
        if (cycle % 90 === 0) { // fire periodically
          const bx = this.x + 45;
          const by = this.y + 60;
          const dx = player.x + 16 - bx;
          const dy = player.y + 30 - by;
          const dist = Math.hypot(dx, dy) || 1;
          bossBullets.push(new Bullet(bx, by, (dx / dist) * 8, (dy / dist) * 8, '#ff0'));
        }
      }
    }

    // common physics and jumps (for phase2 fast chase jump)
    const dt = window._dt || 1;
    this.walkCycle += 0.15 * dt;
    this.vy += 0.68 * dt;
    // allow drop through platforms to chase when player below
    let dropping = (player.y > this.y + 30);
    let ly = landOn(this, this.vy, dropping);
    if (ly !== null && this.vy >= 0) { this.y = ly; this.vy = 0; } else this.y += this.vy * dt;

  }

  draw() {
    if (inSecretDimension) return;
    const sx = this.x - camX, sy = this.y - camY;
    const bob = Math.sin(this.walkCycle) * 5;
    const legStretch = Math.cos(this.walkCycle) * 10;
    ctx.save();
    ctx.fillStyle = '#757575';
    ctx.fillRect(sx + 20, sy + 120, 20, 40 + legStretch);
    ctx.fillRect(sx + 50, sy + 120, 20, 40 - legStretch);
    ctx.fillStyle = '#c68e49'; ctx.fillRect(sx + 10, sy + 40, 70, 90);
    ctx.fillStyle = '#b73333';
    ctx.beginPath(); ctx.moveTo(sx + 40, sy + 40); ctx.lineTo(sx + 50, sy + 40); ctx.lineTo(sx + 45, sy + 100); ctx.fill();
    ctx.fillStyle = '#ffe0bd'; ctx.fillRect(sx + 20, sy + bob, 50, 50);
    ctx.fillStyle = '#000';
    ctx.fillRect(sx + 30, sy + 15 + bob, 8, 2); ctx.fillRect(sx + 52, sy + 15 + bob, 8, 2);
    ctx.fillStyle = '#8391c4';
    ctx.fillRect(sx + 10, sy - 10 + bob, 70, 10); ctx.fillRect(sx + 25, sy - 30 + bob, 40, 25);
    ctx.restore();
  }
}

class BunnyWithAKnife {
  constructor(x) {
    this.x = x; this.y = groundY - 140; this.w = 80; this.h = 120;
    this.hp = 600; this.maxHp = 600; this.vx = 0; this.vy = 0;
    this.jumpCooldown = 0; this.animTimer = 0; this.phase = 1; this.swingTimer = 0; this.facing = 1;
    this.bladeAngle = 0.15; this.bladeCool = 0; this.lunge = null; this.lungeT = 0; this.lungeCool = 0; this.stabbed = false;
    this.power = null; this.chargeT = 0; this.dashT = 0; this.dashDir = 1;
    this.didWave = false; this.didWave3 = false; this.queueWave = false;
  }
  bladeSegment() {
    const ang = this.bladeAngle || 0;
    const len = 72;
    const flip = this.facing < 0 ? -1 : 1;
    const lx = 30 + Math.cos(ang) * len;
    const ly = 40 + Math.sin(ang) * len;
    return {
      x1: this.x + 40 + flip * 30,
      y1: this.y + 70,
      x2: this.x + 40 + flip * lx,
      y2: this.y + 30 + ly
    };
  }
  bladeHits() {
    const s = this.bladeSegment();
    const px = player.x + 16, py = player.y + 30;
    const abx = s.x2 - s.x1, aby = s.y2 - s.y1;
    const ab2 = abx * abx + aby * aby || 1;
    let t = ((px - s.x1) * abx + (py - s.y1) * aby) / ab2;
    if (t < 0) t = 0; else if (t > 1) t = 1;
    const dx = s.x1 + abx * t - px;
    const dy = s.y1 + aby * t - py;
    return dx * dx + dy * dy < 34 * 34;
  }
  bodyTouches() {
    return player.x < this.x + this.w && player.x + player.w > this.x && player.y < this.y + this.h && player.y + player.h > this.y;
  }
  nick(raw, cool) {
    if (this.bladeCool > 0 || player.hitTimer > 0 || gameIsOver || isReviving) return;
    if (this.bodyTouches() || !this.bladeHits()) return;
    const resistFactor = Math.min(100, player.resistance) / 100;
    const dmg = Math.max(1, Math.floor(raw * (1 - resistFactor)));
    player.hp -= dmg;
    player.hitTimer = cool > 20 ? 18 : 12;
    player.hitFlash = 8;
    this.bladeCool = cool;
    document.getElementById('hp').textContent = Math.floor(player.hp);
    floatingText(player.x + 16, player.y - 25, '-' + dmg, '#f00');
    if (player.hp <= 0) gameOver(false);
  }
  tryLunge(dist, dx) {
    if (this.lunge || this.lungeCool > 0) return;
    if (dist < 80 || dist > 270) return;
    if (Math.random() >= 0.012) return;
    this.lunge = 'wind';
    this.lungeT = 18;
    this.stabbed = false;
    this.facing = Math.sign(dx) || this.facing || 1;
    this.vx = 0;
  }
  update() {
    const dx = player.x - this.x;
    const distToPlayer = Math.abs(dx);
    if (this.bladeCool > 0) this.bladeCool--;
    if (this.lungeCool > 0) this.lungeCool--;
    if (this.lunge !== 'wind' && this.lunge !== 'dash' && this.power !== 'dash' && Math.abs(dx) > 20) {
      this.facing = Math.sign(dx) || 1;
    }
    this.animTimer += 0.2;

    if (this.hp < this.maxHp / 3 && !this.didWave) {
      this.didWave = true;
      this.phase = 2;
      this.power = 'charge';
      this.chargeT = 0;
      this.swingTimer = 0;
      this.lunge = null;
    }
    if (this.hp < this.maxHp / 6 && !this.didWave3) {
      this.didWave3 = true;
      if (this.power === 'charge' || this.power === 'dash') this.queueWave = true;
      else {
        this.phase = 3;
        this.power = 'charge';
        this.chargeT = 0;
        this.swingTimer = 0;
        this.lunge = null;
      }
    }

    if (this.power === 'charge') {
      this.vx = 0;
      this.chargeT++;
      this.swingTimer++;
      const speed = this.phase === 3 ? 0.85 : 0.55;
      this.bladeAngle = Math.sin(this.swingTimer * speed) * 1.25;
      this.nick(8, 12);
      if (this.chargeT >= 140) {
        this.power = 'dash';
        this.dashDir = Math.sign(dx) || this.facing || 1;
        this.facing = this.dashDir;
        const need = Math.abs(dx);
        this.dashT = Math.max(16, Math.min(36, Math.ceil(need / 10) + 8));
        this.stabbed = false;
        this.bladeAngle = 0.12;
        if (player.y < this.y - 80) this.vy = -16;
      }
    } else if (this.power === 'dash') {
      this.vx = this.dashDir * 10;
      this.bladeAngle = 0.12;
      if (!this.stabbed) {
        const before = player.hp;
        this.nick(8, 40);
        if (player.hp < before) this.stabbed = true;
      }
      this.dashT--;
      if (this.dashT <= 0) {
        this.power = this.queueWave ? 'charge' : null;
        this.queueWave = false;
        if (this.power === 'charge') {
          this.phase = 3;
          this.chargeT = 0;
          this.swingTimer = 0;
        }
      }
    } else if (this.lunge === 'wind' || this.lunge === 'dash') {
      if (this.lunge === 'wind') {
        this.vx = 0;
        const flip = this.facing < 0 ? -1 : 1;
        const gx = this.x + 40 + flip * 30;
        const gy = this.y + 70;
        this.bladeAngle = Math.atan2(player.y + 30 - gy, (player.x + 16 - gx) * flip);
        this.lungeT--;
        if (this.lungeT <= 0) {
          this.lunge = 'dash';
          this.lungeT = 16;
          this.stabbed = false;
          this.lungeDir = this.facing < 0 ? -1 : 1;
        }
      } else {
        this.vx = this.lungeDir * 12;
        this.bladeAngle = 0.12;
        if (!this.stabbed) {
          const before = player.hp;
          this.nick(8, 40);
          if (player.hp < before) this.stabbed = true;
        }
        this.lungeT--;
        if (this.lungeT <= 0) {
          this.lunge = null;
          this.lungeCool = 90;
        }
      }
    } else {
      this.bladeAngle = Math.sin(this.animTimer) * 0.35;
      this.vx = Math.sign(dx) * 3.5;
      let onGround = landOn(this, 1, false) !== null;
      if (onGround && this.jumpCooldown <= 0) {
        if (player.y < this.y - 200) this.vy = -22;
        else this.vy = -12;
        this.jumpCooldown = 40;
      }

      this.nick(5, 28);
      this.tryLunge(distToPlayer, dx);
    }
    const dt = window._dt || 1;
    let dropping = (player.y > this.y + 30);
    this.vy += 0.68 * dt;
    this.x += this.vx * dt;
    let ly = landOn(this, this.vy, dropping);
    if (ly !== null && this.vy >= 0) { this.y = ly; this.vy = 0; } else this.y += this.vy * dt;
  }
  draw() {

    ctx.fillStyle = '#ffc0cb'; ctx.fillRect(-15, -60, 5, 30); ctx.fillRect(10, -70, 5, 40);
    ctx.fillStyle = '#ffffff'; ctx.fillRect(-40, -30, 70, 100);
    ctx.fillStyle = '#999999'; ctx.fillRect(-40, -30, 30, 100);
    ctx.fillStyle = '#ff0000'; ctx.shadowBlur = 10; ctx.shadowColor = "red";
    ctx.fillRect(-5, -10, 12, 12); ctx.fillRect(15, -10, 12, 12); ctx.shadowBlur = 0;
    ctx.fillStyle = '#444444'; ctx.fillRect(10, 30, 20, 10);
    ctx.fillStyle = '#bbbbbb';
    ctx.save();
    ctx.translate(30, 40);
    ctx.rotate(this.bladeAngle || 0);
    ctx.beginPath();

}

class HandymanSanders {

    this.lastSide = 1;
  }
  update() {
    this.timer++;
    this.anim += 0.12;
    const dx = player.x - this.x;
    // Only update facing/side when player is significantly left or right; stick to previous when above (small dx)
    const side = Math.abs(dx) > 20 ? (player.x < this.x ? -1 : 1) : (this.lastSide || 1);
    this.lastSide = side;
    if (this.state === 'chase') {
      this.vx = Math.sign(dx) * 2.5;
      if (this.timer > 120) {
        this.state = Math.random() > 0.5 ? 'jump' : 'charge';
        this.timer = 0;
      }
    } else if (this.state === 'jump') {
      if (this.vy === 0 && this.timer < 5) {
        this.vy = -20;
        this.vx = Math.sign(dx) * 6;
      }
      if (this.timer > 60) { this.state = 'chase'; this.timer = 0; }
    } else if (this.state === 'charge') {
      this.vx = Math.sign(dx) * 8;
      if (this.timer > 45) { this.state = 'chase'; this.timer = 0; }
    }

    // jump up through platforms to chase if player is higher (one or more platforms)
    if (player.y < this.y - 148 && this.state === 'chase' && this.vy >= 0) {
      this.state = 'jump';
      this.timer = 0;
    }

    const dt = window._dt || 1;
    this.vy += 0.68 * dt;
    this.x += this.vx * dt;
    // allow falling through platforms like player to chase when player is below
    let dropping = (player.y > this.y + 30);
    let ly = landOn(this, this.vy, dropping);
    if (ly !== null && this.vy >= 0) {
      this.y = ly;
      this.vy = 0;
    } else {
      this.y += this.vy * dt;
    }
    if (this.y > groundY) this.y = groundY - this.h;

    if (Math.abs(player.x - this.x) < 60) {
      this.vx = Math.sign(player.x - this.x) * -4; // bounce away

class ErrorPopupBoss {
  constructor(x) {
    this.x = x;
    this.y = groundY - 300;
    this.w = 220;
    this.h = 140;
    this.hp = 1000;
    this.maxHp = 1000;
    this.vx = 0;
    this.vy = 0;
    this.timer = 0;
    this.state = 'cascade';
    this.history = [];
    this.phase = 1;
    this.phaseTimer = 0;
    this.did50Phase2 = false;
  }
  update() {
    this.timer++;
    const hpPct = this.hp / this.maxHp;
    if (hpPct < 0.5 && !this.did50Phase2) {
      this.phase = 2;
      this.phaseTimer = 600; // 10s
      this.did50Phase2 = true;
    }
    if (hpPct < 0.25 && this.phase === 1) {
      this.phase = 2;
      this.phaseTimer = 600;
    }

    if (this.phase === 1) {
      // phase 1: faster toward player, travel up/down platform heights
      const dx = player.x - this.x;
      this.vx = Math.sign(dx) * 4.5;
      this.vy = Math.sin(this.timer * 0.1) * 3;
      // follow player y to travel platforms, and impulse up to "jump" through heights
      if (Math.abs(this.y - player.y) > 40) {
        this.vy += Math.sign(player.y - this.y) * 2;
      }
      if (player.y < this.y - 100) {
        this.vy -= 3; // jump impulse to chase high platforms
      }
      if (this.timer % 180 === 0) this.state = 'jitter'; // occasional jitter
    } else {
      // phase 2: create multiple bouncing popups like solitaire win, attack player, last few seconds (5s)
      // main and popups continue to chase player during the effect
      if (!this.popups || this.popups.length === 0) {
        this.popups = [];
        for (let i = 0; i < 5; i++) {
          this.popups.push({
            x: this.x + (Math.random() - 0.5) * 100,
            y: this.y + (Math.random() - 0.5) * 50,
            vx: (Math.random() - 0.5) * 12,
            vy: (Math.random() - 0.5) * 8
          });
        }
        this.phaseTimer = 300; // 5 seconds
      }
      // main chases during p2
      const dx = player.x - this.x;
      this.vx = Math.sign(dx) * 3 + (Math.random()-0.5)*5;
      this.vy = (player.y - this.y) * 0.05 + (Math.random()-0.5)*4;
      const dt = window._dt || 1;
      // update popups bounce and attack, with chase bias
      for (let p of this.popups) {
        p.vx = (player.x - p.x) * 0.03 * dt + (Math.random()-0.5)*8 * dt;
        p.vy = (player.y - p.y) * 0.03 * dt + (Math.random()-0.5)*6 * dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        // bounce
        if (p.x < 50 || p.x > 2500) p.vx *= -1;
        if (p.y < 20 || p.y > groundY - 50) p.vy *= -1;
        // attack if close to player
        if (Math.abs(p.x - player.x) < 80 && Math.abs(p.y - player.y) < 80) {
          if (player.hitTimer <= 0) {
            player.hp -= 5;
            player.hitTimer = 20;
            player.hitFlash = 10;
            document.getElementById('hp').textContent = Math.floor(player.hp);
            floatingText(player.x + 16, player.y - 25, '-5', '#f00');
            if (player.hp <= 0) gameOver(false);
          }
        }
      }
      this.phaseTimer--;
      if (this.phaseTimer <= 0) {
        this.phase = 1;
        this.popups = [];
        this.timer = 0;
      }
    }

    const dt = window._dt || 1;
    if (this.kbTime > 0) {
      this.vx = this.kbVx;
      this.vy = this.kbVy;
      this.kbVx *= 0.8;
      this.kbVy *= 0.8;
      this.kbTime--;
    }
    this.x += this.vx * dt;
    this.y += this.vy * dt;
    if (this.y > groundY - this.h) this.y = groundY - this.h;
    // no low y clamp to allow chasing all heights
    // if (this.y < 50) this.y = 50;  removed to chase high platforms

    if (this.timer % 5 === 0 && this.phase === 1) {
      this.history.push({x: this.x, y: this.y});
      if (this.history.length > 4) this.history.shift();
    }
  }
  drawWindow(x, y) {
    const sx = x - camX;
    const sy = y - camY;
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 2;
    ctx.fillStyle = '#c0c0c0';
    ctx.fillRect(sx, sy, this.w, this.h);
    ctx.strokeRect(sx, sy, this.w, this.h);
    ctx.fillStyle = '#000080';
    ctx.fillRect(sx + 2, sy + 2, this.w - 4, 25);
    ctx.fillStyle = '#fff';
    ctx.fillRect(sx + 10, sy + 10, this.w * 0.6, 4);
    ctx.fillStyle = '#c0c0c0';
    ctx.fillRect(sx + this.w - 22, sy + 4, 18, 18);
    ctx.strokeRect(sx + this.w - 22, sy + 4, 18, 18);
    ctx.fillStyle = '#000';
    ctx.font = "bold 14px Arial";
    ctx.fillText("✓", sx + this.w - 18, sy + 18);
    ctx.beginPath();
    ctx.moveTo(sx + 20, sy + 50);
    ctx.lineTo(sx + this.w - 20, sy + 50);
    ctx.moveTo(sx + 20, sy + 80);
    ctx.lineTo(sx + this.w - 80, sy + 80);
    ctx.stroke();
    ctx.strokeRect(sx + this.w/2 - 30, sy + 105, 60, 25);
    ctx.fillRect(sx + this.w/2 - 5, sy + 115, 10, 2);
  }
  draw() {
    if (this.phase === 2 && this.popups) {
      // draw the multiple bouncing popups
      for (let p of this.popups) {
        ctx.globalAlpha = 0.8;
        this.drawWindow(p.x, p.y);
      }
      ctx.globalAlpha = 1;
      // draw main too
      this.drawWindow(this.x, this.y);
    } else {
      for (let i = 0; i < this.history.length; i++) {
        ctx.globalAlpha = (i + 1) / (this.history.length + 1);
        this.drawWindow(this.history[i].x, this.history[i].y);
      }
      ctx.globalAlpha = 1;
      this.drawWindow(this.x, this.y);
    }
  }
}

class BlueMysticBoss {
  constructor(x) {
    this.x = x;
    this.y = groundY - 240;
    this.w = 110;
    this.h = 190;
    this.hp = 1200;
    this.maxHp = 1200;
    this.vx = 0;
    this.vy = 0;
    this.timer = 0;
    this.state = 'hover';
    this.anim = 0;
    this.lastSide = 1;
  }
  update() {
    this.timer++;
    this.anim += 0.08;
    const dx = player.x - this.x;
    // Only flip when significantly left/right of player; keep facing when player mostly above
    if (Math.abs(dx) > 20) {
      this.lastSide = Math.sign(dx) || this.lastSide || 1;
    }
    const side = this.lastSide || 1;
    if (this.state === 'hover') {
      this.vx = Math.sign(dx) * 2.2;
      // Smooth natural y following instead of snapping to player.y every frame.
      // This prevents the boss from comically mirroring the player's every jump.
      // Teleports handle big vertical repositioning, so continuous lockstep jumping isn't needed.
      const targetY = player.y - 55;
      this.vy = (targetY - this.y) * 0.09;
      this.y += this.vy + Math.sin(this.timer * 0.05) * 1.5; // damped follow + gentle bob
      if (this.timer % 150 === 0) this.state = 'teleport';
    } else if (this.state === 'teleport') {
      // teleport to player just outside spork swing distance (~60-70px), at player's current height level (not ground)
      const swingDist = 90;
      this.x = player.x + (Math.random() > 0.5 ? swingDist : -swingDist);
      this.y = player.y - 40; // align roughly with player height
      this.state = 'cast';
      this.timer = 0;
    } else if (this.state === 'cast') {
      this.vx = 0;
      // very gentle y tracking during the short cast (teleport already placed it well)
      const castTarget = player.y - 40;
      this.y += (castTarget - this.y) * 0.03;
      if (this.timer > 40) {
        this.state = 'hover';
        showKillMsg("MYSTIC BLAST!");
      }
    }
    this.x += this.vx;
  }
  draw() {
    const sx = this.x - camX;
    const sy = this.y - camY;
    const side = this.lastSide || 1;
    ctx.save();
    ctx.translate(sx + this.w / 2, sy + this.h / 2);
    if (side === -1) ctx.scale(-1, 1);
    ctx.fillStyle = '#d3d3d3';
    ctx.beginPath();
    ctx.moveTo(-40, 60); ctx.lineTo(40, 60); ctx.lineTo(25, -50); ctx.lineTo(-25, -50);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = '#fdf5bc';
    ctx.fillRect(-28, 10, 56, 12);
    ctx.strokeRect(-28, 10, 56, 12);
    ctx.save();
    ctx.rotate(-0.5);
    ctx.fillRect(-5, -65, 15, 110);
    ctx.strokeRect(-5, -65, 15, 110);
    ctx.restore();
    ctx.fillStyle = '#8396d3';
    ctx.beginPath(); ctx.moveTo(15, -75); ctx.lineTo(45, -95); ctx.lineTo(15, -55); ctx.fill(); ctx.stroke();
    ctx.beginPath();
    ctx.arc(0, -75, 22, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = '#0047ab';
    ctx.beginPath(); ctx.moveTo(-15, -65); ctx.lineTo(0, -40); ctx.lineTo(15, -65); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#fdf5bc';
    ctx.beginPath();
    ctx.moveTo(-18, -85); ctx.quadraticCurveTo(0, -140, 18, -85);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#8396d3';
    let wave = Math.sin(this.anim) * 10;
    ctx.fillRect(20, -30 + wave, 25, 15);

class NunSisterBoss {
  constructor(x, type) {
    this.x = x; this.y = groundY - 180; this.w = 90; this.h = 160;
    this.hp = 700; this.maxHp = 700; this.vx = 0; this.vy = 0;
    this.type = type; this.state = 'move'; this.timer = Math.random() * 100;
    this.isShooting = false; this.noFire = 0; this.spin = 0; this.beingThrown = false;
  }
  mate() {
    if (!boss || !boss2) return null;
    return this === boss ? boss2 : boss;
  }
  update() {
    if (this.noFire > 0) this.noFire--;
    if (this.y + this.h > groundY) {
      this.y = groundY - this.h;
      if (this.vy > 0) this.vy = 0;
    }
    const mate = this.mate();

    if (this.state === 'spin') {
      this.isShooting = false;
      this.spin = (this.spin || 0) + 0.55;
      this.x += this.vx;
      this.y += this.vy;
      if (this.y + this.h > groundY) {
        this.y = groundY - this.h;
        if (this.vy > 0) this.vy = 0;
      }
      this.spinLife--;
      const cx = this.x + this.w / 2;
      const cy = this.y + this.h / 2;
      const dx = this.tx - cx;
      const dy = this.ty - cy;
      if (dx * this.vx + dy * this.vy <= 0 || this.spinLife <= 0) {
        this.state = 'return';
        this.vx = 0;
        this.vy = 0;
      }
      return;
    }

    if (mate && this.state !== 'toss' && this.state !== 'return') {
      let apart = this.x - mate.x;
      if (Math.abs(apart) < 60) this.x += Math.sign(apart || 1) * 2;
    }

    this.timer++;
    const dx = player.x - this.x;
    const dist = Math.abs(dx);

    if (this.state === 'toss') {
      this.vx = 0;
      this.isShooting = false;
      if (this.timer > 12 && mate && mate.state !== 'spin' && mate.state !== 'return') {
        const mx = mate.x + mate.w / 2;
        const my = mate.y + mate.h / 2;
        const px = player.x + 16;
        const py = Math.min(player.y + 30, groundY - 80);
        const dir = Math.sign(px - mx) || 1;
        const tx = px + dir * 76;
        const ty = py;
        const tdx = tx - mx;
        const tdy = ty - my;
        const td = Math.hypot(tdx, tdy) || 1;
        mate.state = 'spin';
        mate.vx = (tdx / td) * 16;
        mate.vy = (tdy / td) * 16;
        mate.tx = tx;
        mate.ty = ty;
        mate.spin = 0;
        mate.spinLife = 75;
        mate.noFire = 600;
        mate.beingThrown = false;
        mate.isShooting = false;
        this.state = 'move';
        this.timer = 180;
      } else if (this.timer > 12) {
        this.state = 'move';
        this.timer = 180;
        if (mate) mate.beingThrown = false;
      }
    } else if (this.state === 'return') {
      this.isShooting = false;
      if (!mate) {
        this.state = 'move';
        this.timer = 0;
        this.beingThrown = false;
      } else {
        const hx = mate.x - this.x;
        this.vx = Math.abs(hx) < 36 ? 0 : Math.sign(hx) * 3.2;
        if (Math.abs(hx) < 48 && Math.abs(mate.y - this.y) < 90) {
          this.state = 'move';
          this.timer = 0;
          this.vx = 0;
          this.beingThrown = false;
        }
      }
    } else if (this.state === 'move') {
      this.isShooting = false;
      if (dist > 350) this.vx = Math.sign(dx) * 3;
      else if (dist < 200) this.vx = -Math.sign(dx) * 2;
      else this.vx = 0;
      if (this.beingThrown) { /* held for the throw */ }
      else if (this.noFire <= 0 && this.timer > 240) { this.state = 'aim'; this.timer = 0; }
      else if (this.timer > 240) this.timer = 0;
      if (this.noFire <= 0 && mate && !this.beingThrown && !mate.beingThrown && mate.state === 'move' && Math.random() < 0.002) {
        this.state = 'toss';
        this.timer = 0;
        this.vx = 0;
        mate.beingThrown = true;
      }
    } else if (this.state === 'aim') {
      if (this.noFire > 0) {
        this.state = 'move';
        this.timer = 0;
        this.isShooting = false;
      } else {
        this.vx *= 0.8;
        this.isShooting = true;
        if (this.timer % 19 === 0) {
          const side = player.x < this.x ? -1 : 1;
          const bX = this.x + (this.w / 2) + (side * 40);
          const bY = this.y + 60;
          const targetDx = player.x - bX;
          const targetDy = (player.y + 20) - bY;
          const targetDist = Math.sqrt(targetDx * targetDx + targetDy * targetDy) || 1;
          bossBullets.push(new Bullet(bX, bY, (targetDx / targetDist) * 8, (targetDy / targetDist) * 8));
        }
        if (this.timer > 80) { this.state = 'move'; this.timer = 0; }
      }
    }
    this.x += this.vx;

    const dt = window._dt || 1;
    this.vy += 0.68 * dt;
    let dropping = (player.y > this.y + 30);
    if (this.state === 'return' && mate) dropping = mate.y > this.y + 30;
    let ly = landOn(this, this.vy, dropping);
    if (ly !== null && this.vy >= 0) {
      this.y = ly;
      this.vy = 0;
    } else {
      this.y += this.vy * dt;
    }
    if (this.y + this.h > groundY) {
      this.y = groundY - this.h;
      this.vy = 0;
    }
    let onGround = landOn(this, 0, false) !== null;
    if (this.state !== 'toss' && this.state !== 'spin' && onGround && player.y < this.y - 100 && Math.random() < 0.05) {
      this.vy = -12;
    }
  }
  draw() {
    const sx = this.x - camX;
    const sy = this.y - camY;
    const side = player.x < this.x ? -1 : 1;
    ctx.save();
    ctx.translate(sx + this.w / 2, sy + this.h / 2);
    if (this.state === 'spin') ctx.rotate(this.spin || 0);
    else if (side === -1) ctx.scale(-1, 1);
    ctx.fillStyle = '#222';
    ctx.beginPath();
    ctx.moveTo(-30, 60); ctx.lineTo(30, 60); ctx.lineTo(20, -40); ctx.lineTo(-20, -40);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(0, -35, 15, 0, Math.PI, false);
    ctx.fill();
    ctx.fillStyle = '#222';
    ctx.beginPath();
    ctx.ellipse(0, -65, 35, 45, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fce5cd';
    ctx.beginPath();
    ctx.ellipse(0, -65, 22, 28, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.fillRect(-20, -90, 40, 12);
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(-8, -70, 5, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(8, -70, 5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#000';
    ctx.fillRect(-9, -71, 3, 3); ctx.fillRect(7, -71, 3, 3);
    ctx.save();
    ctx.translate(0, -20);
    let armAngle = this.isShooting ? 0 : -Math.PI / 3;
    ctx.rotate(armAngle);
    ctx.fillStyle = '#222';
    ctx.fillRect(0, -5, 40, 12);
    ctx.strokeRect(0, -5, 40, 12);
    if (this.type === 'AK') {
      ctx.fillStyle = '#8b4513';
      ctx.fillRect(35, 0, 40, 8);
      ctx.fillStyle = '#444';
      ctx.fillRect(40, -5, 50, 6);
      ctx.fillStyle = '#333';
      ctx.fillRect(50, 5, 10, 20);
    } else {
      ctx.fillStyle = '#555';
      ctx.fillRect(35, -10, 30, 20);
      ctx.fillRect(40, -5, 45, 6);
      ctx.fillStyle = '#333';
      ctx.fillRect(45, 5, 8, 25);
    }
    if (this.isShooting && this.timer % 10 < 5) {
      ctx.fillStyle = '#ff0';
      ctx.beginPath();
      ctx.arc(90, -2, 10 + Math.random() * 10, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
    ctx.fillStyle = '#fff';
    ctx.fillRect(-20, 60, 15, 10);
    ctx.fillRect(5, 60, 15, 10);
    ctx.restore();
  }
}

class HotSauceToddlerBoss {
  constructor(x) {
    this.x = x; this.y = groundY - 150; this.w = 90; this.h = 140;
    this.hp = 1500; this.maxHp = 1500; this.vx = 0; this.vy = 0;
    this.timer = 0; this.walkCycle = 0;
    this.throwCool = 40; this.fartState = 'idle'; this.fartT = 0; this.fartCool = 0; this.struck = false;
  }
  lobAtPlayer() {
    const bx = this.x + this.w / 2;
    const by = this.y + 36;
    const px = player.x + 16;
    const head = player.y;
    const dist = Math.hypot(px - bx, (player.y + 30) - (this.y + this.h / 2));
    const dir = Math.sign(px - bx) || 1;
    const spread = (Math.random() - 0.5) * Math.min(280, 50 + dist * 0.25);
    let tx = px + dir * 190 + spread;
    if ((tx - px) * dir < 80) tx = px + dir * 190;
    const ty = Math.min(groundY - 4, player.y + player.h);
    const g = 0.3;
    const span = tx - bx || 1;
    let T = 46;
    let vy0 = (ty - by) / T - 0.5 * g * T;
    for (let n = 0; n < 14; n++) {
      const tHead = ((px - bx) / span) * T;
      const yHead = by + vy0 * tHead + 0.5 * g * tHead * tHead;
      if (yHead <= head - 100) break;
      T += 16;
      vy0 = (ty - by) / T - 0.5 * g * T;
    }
    bossBullets.push(new SauceBottle(bx, by, span / T, vy0));
  }
  update() {
    this.timer++;
    this.walkCycle += 0.15;
    if (this.fartCool > 0) this.fartCool--;
    const dx = player.x - this.x;
    if (this.struck && this.fartState === 'idle' && this.fartCool <= 0) {
      this.fartState = 'squat';
      this.fartT = 30;
    }
    if (this.fartState === 'squat') {
      this.vx = 0;
      this.fartT--;
      if (this.fartT <= 0) {
        fartClouds.push({ x: this.x + this.w / 2, y: this.y + this.h - 150, rx: 328, ry: 216, life: 120 });
        this.fartState = 'idle';
        this.fartCool = 70;
      }
    } else {
      this.vx = Math.sign(dx) * 3.5;
    }
    this.struck = false;
    this.x += this.vx;
    this.throwCool--;
    if (this.throwCool <= 0) {
      this.lobAtPlayer();
      const dist = Math.hypot((player.x + 16) - (this.x + this.w / 2), (player.y + 30) - (this.y + this.h / 2));
      this.throwCool = babyThrowGap(dist);
    }
  }
  draw() {
    const sx = this.x - camX, sy = this.y - camY;
    const side = player.x < this.x ? -1 : 1;
    const legWobble = Math.sin(this.walkCycle) * 15;

    ctx.save();
    ctx.translate(sx + 45, sy + 70);
    if (side === -1) ctx.scale(-1, 1);
    if (this.fartState === 'squat') {
      ctx.translate(0, 24);
      ctx.scale(1.12, 0.75);
    }

    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.ellipse(0, 45, 40, 30, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#f9b391';
    ctx.fillRect(-25 + (legWobble/2), 60, 15, 20); 
    ctx.fillRect(10 - (legWobble/2), 60, 15, 20);

    ctx.fillStyle = '#f9b391';
    ctx.fillRect(-30, -20, 60, 70);

    ctx.fillStyle = '#f9b391';
    ctx.fillRect(30, 0, 15, 40);
    ctx.fillRect(-45, 0, 15, 40);
    ctx.fillStyle = '#d32f2f'; ctx.fillRect(32, 30, 12, 25);

    ctx.fillStyle = '#f9b391';
    ctx.fillRect(-25, -70, 50, 50);
    ctx.fillStyle = '#000'; ctx.fillRect(-20, -55, 40, 15);
    ctx.fillStyle = '#0ff'; ctx.fillRect(-18, -50, 36, 5);

    ctx.restore();
  }
}

    this.damageMultiplier = 1.0; 
    this.saltTimer = 0;
    const intervals = [120, 240, 360, 480];
    this.nextSaltFrame = intervals[Math.floor(Math.random() * intervals.length)];
    
    this.animTimer = 0;
  }

  update() {
    this.saltTimer++;
    this.animTimer++;

    const dx = player.x - this.x;
    this.vx = Math.sign(dx) * 3.8;
    this.x += this.vx;

    if (this.saltTimer >= this.nextSaltFrame) {
      this.damageMultiplier += 0.5;
      this.saltTimer = 0;
      
      const intervals = [120, 240, 360, 480];
      this.nextSaltFrame = intervals[Math.floor(Math.random() * intervals.length)];
      
      for (let i = 0; i < 15; i++) {
        particles.push({
          x: this.x + this.w / 2,
          y: this.y + 40,
          vx: (Math.random() - 0.5) * 8,
          vy: (Math.random() - 0.5) * 8 - 3,
          c: '#fff',
          life: 30
        });
      }
    }

    if (Math.abs(this.x - player.x) < 50 && Math.abs(this.y - player.y) < 60) {
      if (player.hitTimer <= 0) {
        const baseDamage = 8;
        player.hp -= baseDamage * this.damageMultiplier;
        player.hitTimer = 30;
        document.getElementById('hp').textContent = Math.floor(player.hp);
        if (player.hp <= 0) gameOver(false);
      }
    }
  }

  draw() {
    const sx = this.x - camX;
    const sy = this.y - camY;
    const side = player.x < this.x ? -1 : 1;
    
    const jitterX = (this.damageMultiplier > 1) ? (Math.random() - 0.5) * (this.damageMultiplier * 3) : 0;
    const jitterY = (this.damageMultiplier > 1) ? (Math.random() - 0.5) * (this.damageMultiplier * 3) : 0;

    ctx.save();
    ctx.translate(sx + this.w / 2 + jitterX, sy + this.h / 2 + jitterY);
    if (side === -1) ctx.scale(-1, 1);

    ctx.fillStyle = '#6a1b9a';
    ctx.fillRect(-45, -70, 90, 145);
    ctx.fillRect(-40, -100, 80, 45);

    ctx.fillStyle = '#ffd54f';
    ctx.fillRect(-25, -40, 50, 75);

    ctx.fillStyle = '#000';
    ctx.fillRect(-25, -75, 50, 25);
    
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.moveTo(-25, -75); ctx.lineTo(-20, -68); ctx.lineTo(-15, -75);
    ctx.lineTo(-10, -68); ctx.lineTo(-5, -75);  ctx.lineTo(0, -68);
    ctx.lineTo(5, -75);   ctx.lineTo(10, -68);  ctx.lineTo(15, -75);
    ctx.lineTo(20, -68);  ctx.lineTo(25, -75);
    ctx.moveTo(-25, -50); ctx.lineTo(-20, -57); ctx.lineTo(-15, -50);
    ctx.lineTo(-10, -57); ctx.lineTo(-5, -50);  ctx.lineTo(0, -57);
    ctx.lineTo(5, -50);   ctx.lineTo(10, -57);  ctx.lineTo(15, -50);
    ctx.lineTo(20, -57);  ctx.lineTo(25, -50);
    ctx.fill();

    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(-18, -88, 12, 0, Math.PI * 2);
    ctx.arc(18, -88, 12, 0, Math.PI * 2);
    ctx.fill();
    
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(-18, -88, 3, 0, Math.PI * 2);
    ctx.arc(18, -88, 3, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#6a1b9a';
    const armWiggle = Math.sin(this.animTimer * 0.3) * 8;
    ctx.fillRect(40, -45 + armWiggle, 25, 18);
    ctx.fillRect(-65, -45 - armWiggle, 25, 18);

    ctx.restore();
  }
}

// ====================== FINAL BOSS - SHOWERHEAD BOSS (LEVEL 10) ======================
function showerHoseLocal(timer) {
  const arms = [];
  const shoulders = [
    { y: -34, phase: 0.2 },
    { y: 18, phase: 2.4 }
  ];
  for (let a = 0; a < 2; a++) {
    const sh = shoulders[a];
    const pts = [];
    for (let i = 0; i <= 10; i++) {
      const u = i / 10;
      const reach = 20 + u * 120;
      const whip = Math.sin(timer * 0.16 + sh.phase) * u * 30;
      const wave = Math.sin(timer * 0.29 + i * 0.85 + sh.phase) * (5 + u * 16);
      const bob = Math.sin(timer * 0.11 + i * 0.7 + sh.phase) * u * 20;
      pts.push({
        x: reach + whip + wave * 0.35,
        y: sh.y * (1 - u * 0.35) + bob + wave * 0.25
      });
    }
    arms.push(pts);
  }
  return arms;
}

function showerHoseWorld(boss) {
  const facing = player.x < boss.x ? -1 : 1;
  const ox = boss.x + boss.w / 2;
  const oy = boss.y + boss.h / 2;
  return showerHoseLocal(boss.timer).map(pts => pts.map(p => ({ x: ox + p.x * facing, y: oy + p.y })));
}

function distToSeg(px, py, a, b) {
  const dx = b.x - a.x;
  const dy = b.y - a.y;
  const len2 = dx * dx + dy * dy || 1;
  let t = ((px - a.x) * dx + (py - a.y) * dy) / len2;
  if (t < 0) t = 0;
  if (t > 1) t = 1;
  return Math.hypot(px - (a.x + dx * t), py - (a.y + dy * t));
}

class ShowerHeadBoss {
  constructor(x) {
    this.x = x; this.y = groundY - 200; this.w = 100; this.h = 200;
    this.hp = 3500; this.maxHp = 3500; this.vx = 0; this.vy = 0;
    this.onGround = true;
    this.jumpCool = 0;
    this.jumped = false;
    this.wanderT = 1;
    this.wanderDir = 1;
    this.climbTimer = 140;
    this.climbing = false;
    this.climbPlatX = null;
    this.climbLock = 0;
    this.didHorde = false;
    this.timer = 0;
    this.fanfareTimer = 120;
    this.powerMark = 3500;
    this.power = 0;
    this.didHalf = false;
    this.didLow = false;
    this.burst = 0;
    this.burstIn = 180 + Math.floor(Math.random() * 421);
    this.armCool = 0;
  }
  startPower() { this.power = 300; }
  sprayUp() {
    for (let i = 0; i < 2; i++) {
      const spread = (Math.random() - 0.5) * 80;
      const drop = new GooDrop(this.x + this.w / 2 + spread, this.y + this.h / 2 - 88, spread * 0.04, -8 - Math.random() * 6);
      drop.canPool = true;
      drop.life = 90;
      bossBullets.push(drop);
    }
  }
  sprayArms() {
    const arms = showerHoseWorld(this);
    for (const pts of arms) {
      const a = pts[pts.length - 2];
      const b = pts[pts.length - 1];
      const dx = b.x - a.x;
      const dy = b.y - a.y;
      const len = Math.hypot(dx, dy) || 1;
      const drop = new GooDrop(b.x, b.y, (dx / len) * 3.4, (dy / len) * 3.4 - 1.2);
      drop.canPool = true;
      bossBullets.push(drop);
    }
  }
  flailHit() {
    if (this.armCool > 0) { this.armCool--; return; }
    const px = player.x + 16;
    const py = player.y + 30;
    const arms = showerHoseWorld(this);
    for (const pts of arms) {
      for (let i = 1; i < pts.length; i++) {
        if (distToSeg(px, py, pts[i - 1], pts[i]) < 20) {
          const resistFactor = Math.min(100, player.resistance) / 100;
          const dmg = Math.max(1, Math.floor(8 * (1 - resistFactor)));
          player.hp -= dmg;
          player.hitTimer = 6;
          player.hitFlash = 10;
          document.getElementById('hp').textContent = Math.floor(player.hp);
          floatingText(px, player.y - 10, '-' + dmg, '#9aa');
          if (player.hp <= 0) gameOver(false);
          this.armCool = 20;
          return;
        }
      }
    }
  }
  update() {
    if (this.fanfareTimer > 0) {
      this.fanfareTimer--;
      camX += (Math.random() - 0.5) * 15;
      camY += (Math.random() - 0.5) * 15;
      return;
    }

    this.timer++;
    if (this.onGround && this.jumpCool > 0) this.jumpCool--;

    const cx = this.x + this.w / 2;
    const foot = this.y + this.h;
    const playerAbove = (player.y + player.h) < foot - 90;
    let nearPlat = null;
    let nearScore = 99999;
    let chasePlat = null;
    let chaseScore = 99999;
    forPlatformsBetween(cx - 720, cx + 720, function (p) {
      const vDist = foot - p.t;
      if (vDist < 70 || vDist > 170) return;
      const platCx = (p.l + p.r) / 2;
      const hDist = Math.abs(platCx - cx);
      if (hDist > 460) return;
      const near = Math.abs(vDist - 148) * 1.2 + hDist;
      if (near < nearScore) { nearScore = near; nearPlat = platCx; }
      const chase = near + Math.abs(platCx - (player.x + 16));
      if (chase < chaseScore) { chaseScore = chase; chasePlat = platCx; }
    });

    if (this.wanderT <= 0) {
      const toward = Math.sign((player.x + 16) - cx) || 1;
      const roll = Math.random();
      if (roll < 0.35) this.wanderDir = -toward;
      else if (roll < 0.55) this.wanderDir = Math.random() < 0.5 ? 1 : -1;
      else this.wanderDir = toward;
      this.wanderT = 80 + Math.floor(Math.random() * 110);
    } else if (this.onGround) {
      this.wanderT--;
    }

    if (this.climbing) {
      this.climbLock++;
      if (this.climbLock > 200 || nearPlat == null) {
        this.climbing = false;
        this.climbLock = 0;
        this.climbPlatX = null;
      }
    } else if (this.onGround && !playerAbove && this.jumpCool <= 0 && this.climbTimer <= 0) {
      if (nearPlat != null && Math.random() < 0.4) {
        this.climbing = true;
        this.climbPlatX = nearPlat;
        this.climbLock = 0;
      }
      this.climbTimer = 120 + Math.floor(Math.random() * 140);
    } else if (this.climbTimer > 0) {
      this.climbTimer--;
    }

    let targetX = null;
    if (playerAbove) targetX = chasePlat;
    else if (this.climbing) targetX = this.climbPlatX;

    let dir = this.wanderDir || 1;
    if (targetX != null) {
      const tdx = targetX - cx;
      dir = Math.abs(tdx) > 8 ? (Math.sign(tdx) || dir) : 0;
    }
    this.vx = dir * 2.5;

    this.vy += 0.26;
    if (this.onGround && this.jumpCool <= 0 && targetX != null && Math.abs(targetX - cx) < 36 && (playerAbove || this.climbing)) {
      const hop = Math.sign(targetX - cx);
      this.vy = -9.6;
      this.vx = hop === 0 ? 0 : hop * 0.45;
      this.jumped = true;
      this.onGround = false;
      this.climbing = false;
      this.climbLock = 0;
    }

    this.x += this.vx;
    if (this.vy >= 0) {
      const nextFoot = foot + this.vy;
      let land = null;
      forPlatformsBetween(this.x, this.x + this.w, (p) => {
        if (this.x + this.w > p.l && this.x < p.r && foot <= p.t + 12 && nextFoot >= p.t) {
          if (land === null || p.t < land) land = p.t;
        }
      });
      if (land === null && foot <= groundY + 2 && nextFoot >= groundY) land = groundY;
      if (land !== null) {
        const wasAir = !this.onGround;
        this.y = land - this.h;
        this.vy = 0;
        this.onGround = true;
        if (wasAir && this.jumped) {
          this.jumpCool = 60;
          this.jumped = false;
        }
      } else {
        this.y += this.vy;
        this.onGround = false;
      }
    } else {
      this.y += this.vy;
      this.onGround = false;
    }

    while (this.powerMark - this.hp >= this.maxHp * 0.15) {
      this.powerMark -= this.maxHp * 0.15;
      this.startPower();
    }
    if (!this.didHalf && this.hp <= this.maxHp * 0.5) {
      this.didHalf = true;
      this.startPower();
    }
    if (!this.didLow && this.hp <= this.maxHp * 0.15) {
      this.didLow = true;
      this.startPower();
    }
    if (!this.didHorde && this.hp <= this.maxHp * 0.3) {
      this.didHorde = true;
      for (let i = 0; i < 12; i++) {
        const side = i < 6 ? 1 : -1;
        const rank = i % 6;
        const ex = side > 0 ? (camX + W + 30 + rank * 26) : (camX - 78 - rank * 26);
        let surface = groundY;
        const shelf = [];
        forPlatformsBetween(ex - 8, ex + 8, function (p) {
          if (ex > p.l && ex < p.r) shelf.push(p);
        });
        if (shelf.length) surface = shelf[rank % shelf.length].t;
        const foe = new Enemy(ex, surface, i % 3);
        foe.activated = true;
        enemies.push(foe);
      }
    }

    if (this.power > 0) {
      this.power--;
      this.sprayUp();
    } else if (this.burst > 0) {
      this.burst--;
      this.sprayArms();
      if (this.burst === 0) this.burstIn = 180 + Math.floor(Math.random() * 421);
    } else {
      this.burstIn--;
      if (this.burstIn <= 0) this.burst = 30;
    }
    this.flailHit();
  }
  draw() {
    const sx = this.x - camX, sy = this.y - camY;
    const side = player.x < this.x ? -1 : 1;

    ctx.save();
    ctx.translate(sx + this.w / 2, sy + this.h / 2);
    if (side === -1) ctx.scale(-1, 1);

    ctx.fillStyle = '#78909c';
    ctx.fillRect(-25, -40, 50, 100);
    ctx.fillRect(-35, 60, 20, 40);
    ctx.fillRect(15, 60, 20, 40);

    ctx.fillStyle = '#78909c';
    ctx.beginPath();
    ctx.moveTo(-15, -40); ctx.lineTo(-35, -80); ctx.lineTo(35, -80); ctx.lineTo(15, -40);
    ctx.fill();
    ctx.fillStyle = '#b0bec5';
    ctx.fillRect(-40, -85, 80, 10);
    ctx.fillStyle = '#37474f';
    for (let i = -30; i <= 30; i += 15) {
      ctx.fillRect(i - 2, -82, 4, 4);
    }

    ctx.fillStyle = '#000000';
    ctx.fillRect(-45, 25, 90, 30);

    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 14px Arial, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('СПУНК', 0, 45);

    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    const hoses = showerHoseLocal(this.timer);
    for (const pts of hoses) {
      ctx.beginPath();
      ctx.moveTo(pts[0].x, pts[0].y);
      for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
      ctx.strokeStyle = '#546e7a';
      ctx.lineWidth = 8;
      ctx.stroke();
      ctx.strokeStyle = '#cfd8dc';
      ctx.lineWidth = 3;
      ctx.stroke();
    }

    ctx.restore();

    if (this.fanfareTimer > 0) {
      ctx.fillStyle = '#ff0000';
      ctx.font = 'bold 36px Arial';
      ctx.textAlign = 'center';
      ctx.shadowBlur = 20; ctx.shadowColor = '#ff0000';
      ctx.fillText('nice refreshing shower! right over here!', canvas.width / 2 + camX, canvas.height / 3 + camY);
      ctx.shadowBlur = 0;
    }
  }
}

// ====================== MICROPHONE ======================
function updateMicrophoneWeapon() {
  if (!micWeapon.equipped) return;
  let handX = player.x + player.w / 2;
  let handY = player.y + player.h / 2;
  if (micWeapon.state === 'thrown') {
    micWeapon.vy += 0.5;
    micWeapon.x += micWeapon.vx;
    micWeapon.y += micWeapon.vy;
    if (Math.hypot(micWeapon.x - handX, micWeapon.y - handY) > 280) micWeapon.state = 'returning';
    if (micWeapon.hitCooldown <= 0) {
      let hit = false;
      let targets = [];
      if (boss) targets.push(boss);
      if (boss2) targets.push(boss2);
      enemies.forEach(e => targets.push(e));
      targets.forEach(t => {
        if (micWeapon.x > t.x && micWeapon.x < t.x + t.w && micWeapon.y > t.y && micWeapon.y < t.y + t.h) {
          t.hp -= micWeapon.damage;
          blood(micWeapon.x, micWeapon.y);
          hit = true;
        }
      });
      if (hit) micWeapon.hitCooldown = 15;
    }
    if (micWeapon.hitCooldown > 0) micWeapon.hitCooldown--;
  } else if (micWeapon.state === 'returning') {
    let dx = handX - micWeapon.x;
    let dy = handY - micWeapon.y;
    let d = Math.hypot(dx, dy);
    if (d < 20) micWeapon.state = 'ready';
    else {
      micWeapon.x += (dx / d) * 16;
      micWeapon.y += (dy / d) * 16;
    }
  }
}

// ====================== WEAPON FIRST CONTACT DAMAGE (CLEAN) ======================
function sporkKnock(ent, big, extra) {
  const dir = player.facing < 0 ? -1 : 1;
  const k = sporkKnockScale() * (extra || 1);
  if (big) {
    if (ent instanceof ErrorPopupBoss) {
      ent.kbTime = 12;
      ent.kbVx = dir * 9 * k;
      ent.kbVy = -3 * k;
      return;
    }
    ent.x += dir * 14 * k;
    return;
  }
  ent.kbTime = 7;
  ent.kbVx = dir * 6 * k;
  if (ent.vy > -2.4 * k) ent.vy = -2.4 * k;
}

function checkWeaponFirstContact() {
  if (!player.hitThisSwing || !player.hitThisSwing.get) player.hitThisSwing = new Map();

  const chop = getChopT();
  const weaponPose = getPinnedWeaponPose(chop);
  const weaponFist = {
    x: player.x + 16 + weaponPose.fistX,
    y: player.y + 30 + weaponPose.fistY,
    ang: weaponPose.w
  };
  const offPose = getOffHandWeaponPose(chop);
  const offFist = {
    x: player.x + 16 + offPose.fistX,
    y: player.y + 30 + offPose.fistY,
    ang: offPose.w
  };

  // Helper to test one weapon against all targets
  function testWeapon(fist, length, radius, weaponName) {
    const damage = weaponStrikeDamage(weaponName);
    const bossHit = Math.max(8, Math.floor(damage * 0.4));
    for (let i = 2; i <= 6; i++) {   // 5 sample points along the weapon
      const t = i / 6;
      const wx = fist.x + Math.cos(fist.ang) * length * t;
      const wy = fist.y + Math.sin(fist.ang) * length * t;

      // Enemies
      for (let j = enemies.length - 1; j >= 0; j--) {
        const e = enemies[j];
        if (swingAlready(weaponName, e)) continue;

        const ex = e.x + 17;
        const ey = e.y + 25;
        if (Math.hypot(wx - ex, wy - ey) < radius) {
          e.hp -= damage;
          if (weaponName === 'spork' && e.hp > 0) sporkKnock(e);
          else if (difficulty === 'endless' && weaponName === 'pink_guitar' && e.hp > 0) sporkKnock(e, false, 1.25);
          blood(ex, ey);
          floatingText(ex, ey - 20, '-' + damage, '#f00');
          if (e.hp <= 0) {
            dropShrunkPuddles(e);
            maybeDropHealBottle(e);
            floatingText(ex, ey - 20, killPhrases[Math.floor(Math.random()*killPhrases.length)], '#ff0');
            enemies.splice(j, 1);
            totalKills++;
          } else {
            swingMark(weaponName, e);
          }
        }
      }

      // Bosses
      if (boss && !swingAlready(weaponName, boss)) {
        const bx = boss.x + boss.w / 2;
        const by = boss.y + boss.h / 2;
        if (Math.hypot(wx - bx, wy - by) < radius + 20) {
          boss.hp -= bossHit;
          if (weaponName === 'spork') sporkKnock(boss, true);
          else if (difficulty === 'endless' && weaponName === 'pink_guitar') sporkKnock(boss, true, 1.25);
          if (boss instanceof HotSauceToddlerBoss) boss.struck = true;
          blood(bx, by);
          floatingText(bx, by - 20, '-' + bossHit, '#f00');
          swingMark(weaponName, boss);
        }
      }
      if (boss2 && !swingAlready(weaponName, boss2)) {
        const bx = boss2.x + boss2.w / 2;
        const by = boss2.y + boss2.h / 2;
        if (Math.hypot(wx - bx, wy - by) < radius + 20) {
          boss2.hp -= bossHit;
          if (weaponName === 'spork') sporkKnock(boss2, true);
          else if (difficulty === 'endless' && weaponName === 'pink_guitar') sporkKnock(boss2, true, 1.25);
          if (boss2 instanceof HotSauceToddlerBoss) boss2.struck = true;
          blood(bx, by);
          floatingText(bx, by - 20, '-' + bossHit, '#f00');
          swingMark(weaponName, boss2);
        }
      }
    }
  }

  // Run checks
  testWeapon(weaponFist, 78, 42, 'spork');

  if (player.weapons.includes('bone_club')) {
    testWeapon(offFist, 90, 48, 'bone_club');
  }
  if (player.weapons.includes('pink_guitar')) {
    testWeapon(offFist, 120, 52, 'pink_guitar');
  }
}

function fireBulletBill() {
  if (!boss) return;
  const bx = boss.x + boss.w / 2 - 54;
  const by = boss.y + 50;
  const dx = (player.x + 16) - (bx + 54);
  const dy = (player.y + 30) - (by + 32);
  const dist = Math.hypot(dx, dy) || 1;
  const speed = 7;
  bossBullets.push(new BulletBill(bx, by, (dx / dist) * speed, (dy / dist) * speed));
}

function fireSalesmanRevolver(bigDamage = true) {
  if (!boss) return;
  const bx = boss.x + 45;
  const by = boss.y + 70;
  const dx = player.x + 16 - bx;
  const dy = player.y + 30 - by;
  const dist = Math.hypot(dx, dy) || 1;

  const speed = bigDamage ? 10 : 8;
  const bullet = new Bullet(bx, by, (dx / dist) * speed, (dy / dist) * speed, '#ff0');
  bossBullets.push(bullet);

  // Big damage version
  if (bigDamage) {
    // We'll apply the damage when the bullet hits, or apply it directly for reliability
    setTimeout(() => {
      if (player.hp > 0) {
        player.hp -= 42; // substantial damage
        player.hitTimer = 30;
        player.hitFlash = 20;
        document.getElementById('hp').textContent = Math.floor(player.hp);
        floatingText(player.x + 16, player.y - 30, '-42', '#f00');
        if (player.hp <= 0) gameOver(false);
      }
    }, 120);
  }
}
