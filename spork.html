const DEALER_SLEIGH_MENU = [

];
const DEALER_OTHER_MENU = [

  { id: 'amc_eagle', name: 'AMC EAGLE' },
  { id: 'ford_taurus', name: '1997 FORD TAURUS' }
];

let micWeapon = { equipped: false, x:0, y:0, vx:0, vy:0, state:'ready', damage:40, hitCooldown:0 };

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
canvas.width = 1280; canvas.height = 720;
let W = 1280, H = 720, groundY = H - 150;

const platformHeights = [];
let currentY = groundY;
for (let i = 1; i <= 10; i++) {
  currentY -= 148;
  platformHeights.push(currentY);
}

// ====================== STAT FUNCTIONS ======================
function sporkBonusDamage() {
  let extra = 0;
  if (player.modifiers.includes('hot_sauce')) extra += 4;
  if (player.modifiers.includes('gypsy_tears')) extra += 1;
  return extra;
}
function weaponStrikeDamage(weaponName) {
  if (weaponName === 'spork') {
    const base = (itemDB.spork.damage || 0) + sporkBonusDamage();
    return player.modifiers.includes('spider_box') ? base * 2 : base;
  }
  const db = itemDB[weaponName];
  return db ? (db.damage || 0) : 0;
}
function spiderStrikeDamage() {
  let dmg = 1;
  if (player.modifiers.includes('hot_sauce')) dmg *= 2;
  if (player.modifiers.includes('gypsy_tears')) dmg *= 2;
  return dmg;
}
function getCurrentSpunk() {
  return weaponStrikeDamage('spork');
}
// Later heal items add into heal first. Gypsy tears double that sum at the end.
function healAmount(base) {
  let heal = base;
  if (player.modifiers.includes('gypsy_tears')) heal *= 2;
  return heal;
}
function healTickAmount() {
  return healAmount(1);
}
function maybeDropHealBottle(ent) {
  if (difficulty !== 'endless' || !ent || ent.healRolled) return;
  ent.healRolled = true;
  if (Math.random() >= 0.02) return;
  const w = 16;
  const h = 36;
  const foot = ent.y + (ent.h || 60);
  worldPickups.push({
    id: 'heal_bottle',
    x: ent.x + ((ent.w || 32) - w) / 2,
    y: foot - h,
    w: w,
    h: h,
    vx: 0,
    vy: -2,
    falling: true,
    softFall: true,
    cool: 10
  });
}
function sporkKnockScale() {
  if (!player.modifiers.includes('gypsy_tears')) return 1;
  return player.modifiers.includes('spider_box') ? 4 : 2;
}
function swingAlready(weaponName, ent) {
  const hit = player.hitThisSwing && player.hitThisSwing.get && player.hitThisSwing.get(ent);
  return !!(hit && hit.has(weaponName));
}
function swingMark(weaponName, ent) {
  if (!player.hitThisSwing || !player.hitThisSwing.get) player.hitThisSwing = new Map();
  let hit = player.hitThisSwing.get(ent);
  if (!hit) {
    hit = new Set();
    player.hitThisSwing.set(ent, hit);
  }
  hit.add(weaponName);
}
function updateResistance() {
  let res = 0;
  player.armorHead.forEach(a => { if (itemDB[a] && itemDB[a].resistance) res += itemDB[a].resistance; });
  player.armorLegs.forEach(id => { if (id === 'lederhosen') res += 10; });
  
  // === Fly Shoes Base Resistance (+8) ===
  player.armorFeet.forEach(id => { if (id === 'fly_shoes') res += 8; });

  player.resistance = res;
}
function hpColor(cur, max) {
  const ratio = max <= 0 ? 0 : cur / max;
  if (ratio <= 0.25) return '#e02020';
  if (ratio <= 0.5) return '#f08818';
  return '#3dcc3d';
}
function updateHUD() {
  const hpEl = document.getElementById('hp');
  hpEl.textContent = Math.floor(player.hp);
  hpEl.style.color = hpColor(player.hp, player.maxHp);
  document.getElementById('spunk').textContent = getCurrentSpunk();
  document.getElementById('resist').textContent = player.resistance;
}

// ====================== PICKUP ======================
function jumpOffPickup(id, destX, w, h) {
  worldPickups.push({
    id: id,
    x: player.x + 16,
    y: player.y + 6,
    w: w || 28,
    h: h || 22,
    vx: (destX - (player.x + 16)) / 22,
    vy: -6.4,
    falling: true,
    cool: 28,
    destX: destX
  });
}

function dropReplacedItem(id, w, h) {
  jumpOffPickup(id, player.x + 16 - 160, w, h);
}

function dropSpreadItem(id, index, w, h) {
  const side = (index % 2 === 0) ? -1 : 1;
  const rank = Math.floor(index / 2);
  jumpOffPickup(id, player.x + 16 + side * (80 + rank * 110), w, h);
}

function settleDroppedItem(it) {
  const h = it.h || 22;
  const w = it.w || 28;
  const foot = it.y + h;
  let plat = null;
  forPlatformsBetween(it.x, it.x + w, function (p) {
    if (it.x + w > p.l && it.x < p.r && Math.abs(foot - p.t) <= 8) plat = p;
  });
  let x = it.destX != null ? it.destX : it.x;
  if (plat) {
    if (x < plat.l + 6) x = plat.l + 6;
    if (x > plat.r - w - 6) x = plat.r - w - 6;
  }
  for (let n = 0; n < 6; n++) {
    let hit = null;
    for (const other of worldPickups) {
      if (other === it || other.falling) continue;
      if (Math.abs(other.x - x) < 100) { hit = other; break; }
    }
    if (!hit) break;
    const dir = x >= hit.x ? 1 : -1;
    x = hit.x + dir * 110;
    if (plat) {
      if (x < plat.l + 6) x = plat.l + 6;
      if (x > plat.r - w - 6) x = plat.r - w - 6;
    }
  }
  it.x = x;
  it.vx = 0;
  it.vy = 0;
  it.falling = false;
  it.cool = Math.max(it.cool || 0, 16);
}

function stepFallingPickup(it) {
  it.vy = (it.vy || 0) + 0.55;
  if (it.softFall && it.vy > 6) it.vy = 6;
  it.x += it.vx || 0;
  const h = it.h || 22;
  const w = it.w || 28;
  const future = it.y + h + it.vy;
  let landTop = null;
  if (it.vy >= 0) {
    forPlatformsBetween(it.x, it.x + w, function (p) {
      if (it.x + w > p.l && it.x < p.r && future >= p.t && it.y + h <= p.t + 16) {
        if (landTop === null || p.t < landTop) landTop = p.t;
      }
    });
    if (landTop === null && future >= groundY && it.y + h <= groundY + 2) landTop = groundY;
  }
  if (landTop !== null) {
    it.y = landTop - h;
    settleDroppedItem(it);
  } else {
    it.y += it.vy;
  }
}

function updateWorldPickups() {
  for (let i = worldPickups.length - 1; i >= 0; i--) {
    let it = worldPickups[i];
    if (it.falling) stepFallingPickup(it);
    if (it.falling) continue;
    if (it.cool > 0) { it.cool--; continue; }
    if (Math.abs(player.x + 16 - it.x) < 45 && Math.abs(player.y + 30 - it.y) < 55) {
      if (it.id === 'heal_bottle') {
        const heal = healAmount(40);
        player.hp = Math.min(player.maxHp, player.hp + heal);
        floatingText(it.x, it.y - 28, '+' + heal, '#8eb6ff');
        worldPickups.splice(i, 1);
        updateHUD();
        continue;
      }
      if (itemDB[it.id]) {
        let db = itemDB[it.id];

        // Block all pickups while in Santa Sleigh (no weapons or armor allowed)
        if (player.hasSantaSleigh) {
          // Only allow the sleigh itself if it ever becomes a pickup (not currently)
          continue;
        }

        if (db.category === 'weapon') {
          if (it.id === 'pink_guitar' || it.id === 'bone_club') {
            const other = it.id === 'pink_guitar' ? 'bone_club' : 'pink_guitar';
            const otherIdx = player.weapons.indexOf(other);
            if (otherIdx !== -1) {
              player.weapons.splice(otherIdx, 1);
              dropReplacedItem(other, 28, 22);
            }
          }
          if (!player.weapons.includes(it.id)) player.weapons.push(it.id);
          if (it.id === 'stage_mic') micWeapon.equipped = true;
        } else if (db.category === 'armor_head') {
          player.armorHead.push(it.id);
        } else if (it.id === 'lederhosen') {
          if (player.armorLegs.length > 0) {
            let old = player.armorLegs.pop();
            dropReplacedItem(old, 25, 20);
          }
          player.armorLegs.push('lederhosen');
        } else if (it.id === 'fly_shoes' || it.id === 'spike_shoes') {
          if (player.armorFeet.length > 0) {
            let oldFeet = player.armorFeet.pop();
            dropReplacedItem(oldFeet, 25, 20);
          }
          player.armorFeet.push(it.id);
        } else if (it.id === 'laser_glasses' || db.category === 'dev_slot') {
          if (player.devSlot1.length > 0) {
            let oldDev = player.devSlot1.pop();
            dropReplacedItem(oldDev, 25, 20);
          }
          player.devSlot1.push(it.id);
        } else if (db.category === 'modifier') {
          if (!player.modifiers.includes(it.id)) player.modifiers.push(it.id);
          let modName = 'HOT SAUCE';
          let modColor = '#f01400';
          if (it.id === 'spider_box') { modName = 'SPIDERS'; modColor = '#c8c8c8'; }
          if (it.id === 'gypsy_tears') { modName = 'GYPSY TEARS'; modColor = '#7ee0d0'; }
          floatingText(it.x, it.y - 28, modName, modColor);
        }
        worldPickups.splice(i, 1);
        updateResistance();
        updateHUD();
      }
    }
  }
}

function updateLaserGlasses() {
  const firing = (keys['f'] || keys['F']) && player.devSlot1.includes('laser_glasses');
  player.isFiringLaser = !!firing;
  if (!firing) return;

  const dir = player.facing >= 0 ? 1 : -1;
  const startX = player.x + 16 + dir * 10;
  const laserY = player.y + 8;
  const endX = startX + dir * 800;
  const minX = Math.min(startX, endX);
  const maxX = Math.max(startX, endX);

  function beamHits(ent) {
    if (!ent) return false;
    const w = ent.w || 34;
    const h = ent.h || 58;
    const beamTop = laserY - 16;
    const beamBot = laserY + 16;
    return ent.x + w >= minX && ent.x <= maxX && beamBot >= ent.y && beamTop <= ent.y + h;
  }

  for (let j = enemies.length - 1; j >= 0; j--) {
    const e = enemies[j];
    if (!beamHits(e)) continue;
    e.hp -= 10;
    if (e.hp <= 0) {
      dropShrunkPuddles(e);
      maybeDropHealBottle(e);
      const ex = e.x + (e.w || 34) / 2;
      const ey = e.y + (e.h || 58) / 2;
      floatingText(ex, ey - 20, killPhrases[Math.floor(Math.random() * killPhrases.length)], '#ff0');
      enemies.splice(j, 1);
      totalKills++;
    }
  }
  if (boss && beamHits(boss)) boss.hp -= 10;
  if (boss2 && beamHits(boss2)) boss2.hp -= 10;
}

// ====================== LANDON ======================
// Platforms stay for the whole level. Searches use a horizontal cell index so a long walk does not scan every platform.
const PLAT_CELL = 512;
let platBuckets = new Map();
let platIndexed = 0;
let platIndexEpoch = 0;
let platBuiltEpoch = -1;
let platStamp = 1;
let platLast = null;

function ensurePlatIndex() {
  if (platBuiltEpoch !== platIndexEpoch || platIndexed > platforms.length || (platIndexed > 0 && platforms[platIndexed - 1] !== platLast)) {
    platBuckets = new Map();
    platIndexed = 0;
    platLast = null;
    platBuiltEpoch = platIndexEpoch;
  }
  while (platIndexed < platforms.length) {
    platLast = platforms[platIndexed];
    platAddToIndex(platLast);
    platIndexed++;
  }
}

function platAddToIndex(p) {
  const a = Math.floor(p.l / PLAT_CELL);
  const b = Math.floor(Math.max(p.l, p.r - 0.001) / PLAT_CELL);
  p._cellA = a;
  p._cellB = b;
  p._epoch = platIndexEpoch;
  for (let c = a; c <= b; c++) {
    let list = platBuckets.get(c);
    if (!list) {
      list = [];
      platBuckets.set(c, list);
    }
    list.push(p);
  }
}

function forPlatformsBetween(x0, x1, fn) {
  ensurePlatIndex();
  if (x1 < x0) {
    const swap = x0;
    x0 = x1;
    x1 = swap;
  }
  const a = Math.floor(x0 / PLAT_CELL);
  const b = Math.floor(x1 / PLAT_CELL);
  const stamp = ++platStamp;
  for (let c = a; c <= b; c++) {
    const list = platBuckets.get(c);
    if (!list) continue;
    for (let i = 0; i < list.length; i++) {
      const p = list[i];
      if (p._vis === stamp) continue;
      p._vis = stamp;
      if (fn(p)) return true;
    }
  }
  return false;
}

function landOn(obj, dy, dropping) {
  const future = obj.y + obj.h + dy;
  if (future >= groundY && obj.y + obj.h <= groundY) return groundY - obj.h;
  let hit = null;
  forPlatformsBetween(obj.x, obj.x + obj.w, function (p) {
    if (obj.x + obj.w > p.l && obj.x < p.r && future >= p.t && obj.y + obj.h <= p.t + 12) {
      hit = dropping ? 'drop' : (p.t - obj.h);
      return true;
    }
  });
  if (hit === 'drop') return null;
  return hit;
}

function landBelow(obj, dy) {
  const foot = obj.y + obj.h;
  const next = foot + dy;
  if (dy < 0) return null;
  let top = null;
  forPlatformsBetween(obj.x, obj.x + obj.w, function (p) {
    if (obj.x + obj.w > p.l && obj.x < p.r && foot <= p.t + 8 && next >= p.t) {
      if (top === null || p.t < top) top = p.t;
    }
  });
  if (top !== null) return top - obj.h;
  if (foot <= groundY + 2 && next >= groundY) return groundY - obj.h;
  return null;
}

function beginPlatformRise() {
  const below = camY + H + 24;
  const cap = H * 0.85;
  for (const p of platforms) {
    if (p.homeT != null) continue;
    p.homeT = p.t;
    const lift = Math.min(cap, Math.max(0, below - p.homeT));
    p.t = p.homeT + lift;
  }
}

function stepPlatformRise() {
  let rising = false;
  for (const p of platforms) {
    if (p.homeT == null) { rising = true; continue; }
    if (p.t > p.homeT) {
      p.t = Math.max(p.homeT, p.t - 16);
      if (p.t > p.homeT) rising = true;
    }
  }
  return rising;
}

function blood(x, y) {
  const n = difficulty === 'endless' ? 10 : 40;
  for (let i = 0; i < n; i++) particles.push({x, y, vx:Math.random()*30-15, vy:Math.random()*26-20, life:52, c:'#c33', s:6+Math.random()*8});
}
function endlessQuietFloat(text) {
  if (difficulty !== 'endless' || inSecretDimension) return false;
  const s = String(text);
  if (typeof killPhrases !== 'undefined' && killPhrases.indexOf(s) >= 0) return true;
  return /^[+-]?\d+(\.\d+)?$/.test(s);
}
function floatingText(x, y, text, color = '#fff') {
  if (endlessQuietFloat(text)) return;
  floatingTexts.push({x, y, text, color, life:58, vy:-1.9});
}

const killPhrases = ["SPORKED!", "BOOM!", "GOT EM!", "BLASTED!"];

function showKillMsg(text) { const el=document.getElementById('killMsg'); el.textContent=text; el.style.display='block'; setTimeout(()=>el.style.display='none',5000); }
function showLevelMsg(text) { const el=document.getElementById('levelMsg'); el.textContent=text; el.style.display='block'; setTimeout(()=>el.style.display='none',3800); }

function gameOver(win = false) {

    let idx = player.armorHead.indexOf('possum_helmet');

      let btn = document.getElementById('restartBtn');
      btn.textContent = "Revive Now!";
      btn.onclick = () => { gameIsOver = false; isReviving = false; lastEnemySpawnX = player.x - 220; lastLeftEnemySpawnX = player.x; document.getElementById('gameOver').style.display = 'none'; };
      document.getElementById('gameOver').style.display = 'flex';
      return;
    }
  }
  gameIsOver = true;

}

// ====================== ENEMY ======================
const ENEMY_BROWNS = ['#4a2812', '#6a3b1c', '#8f5a32'];
const POMP_RISE = [6, 10, 14, 18, 22];
const ENEMY_W = 32;
const ENEMY_H = 60;
const ENEMY_SCALES = [0.88, 0.96, 1.05, 1.14];

class Enemy {
  constructor(x, y, type = 0) {
    this.brown = ENEMY_BROWNS[Math.floor(Math.random() * ENEMY_BROWNS.length)];
    this.hair = Math.floor(Math.random() * 6);
    this.scale = ENEMY_SCALES[Math.floor(Math.random() * ENEMY_SCALES.length)];
    this.x = x;
    this.w = ENEMY_W * this.scale;
    this.h = ENEMY_H * this.scale;
    this.y = (y == null ? groundY : y) - this.h;
    this.vx = 0; this.vy = 0;
    this.type = type;
    this.hp = 30 + currentLevel * 8 + type * 10;
    this.onGround = false;
    this.jumpCooldown = 0;
    this.activated = difficulty === 'endless';
    this.wanderTimer = Math.floor(Math.random() * 55);
    this.wanderBias = 0;
    this.ledgeSearchDir = 0;   // +1 or -1 when actively hunting a drop while player is below
    this.searchTimer = 0;
    this.steppingOff = 0;      // short counter to force clean fall off ledge without re-landing wobble
    this.jumpTargetX = null;   // target platform center to jump onto when player is above
    this.jumpTargetTimer = 0;
    this.jumpStartY = 0;       // y when we started a target jump, to detect vertical progress on land
  }
  update() {
    for (let other of enemies) {
      if (other === this) continue;
      let dx = this.x - other.x;
      if (Math.abs(dx) < 30 && Math.abs(this.y - other.y) < 40) {
        if (this.steppingOff > 0) {
          // reduce separation nudge while stepping off ledge to avoid extra wobble in the drop
          this.x += Math.sign(dx) * 0.5;
        } else {
          this.x += Math.sign(dx) * 1.5;
        }
      }
    }
    const distToPlayer = Math.abs(player.x - this.x);
    const vertDist = Math.abs(player.y - this.y);
    const onScreen = this.x < camX + W && this.x + this.w > camX && this.y < camY + H && this.y + this.h > camY;
    if ((boss || boss2) && onScreen) this.activated = true;
    if (distToPlayer < 600 && vertDist < 400) this.activated = true;

    if (!this.activated) {
      if (this.vx === 0) this.vx = Math.random() > 0.5 ? 1 : -1;
      const dt = window._dt || 1;
      this.vy += 0.68 * dt;
      let ly = landOn(this, this.vy, false);
      if (ly !== null) { 
        this.y = ly; this.vy = 0;
        let edgeCheck = landOn({x: this.x + this.vx * 20, y: this.y, w: this.w, h: this.h}, 1, false);
        if (edgeCheck === null) this.vx *= -1;
      } else { this.y += this.vy * dt; }
      if (this.kbTime > 0) {
        this.kbTime--;
        this.vx = this.kbVx;
        this.kbVx *= 0.75;
        this.x += this.vx * dt;
      } else {
        this.x += this.vx * 0.5 * dt * enemySpeedMul();
      }
      return; 
    }

    if (this.jumpCooldown > 0) this.jumpCooldown--;

    // Smarter chase: head toward player + real side-to-side when needed.
    const dx = player.x - this.x;
    const distP = Math.abs(dx);
    const vertP = Math.abs(player.y - this.y);
    const playerBelow = player.y > this.y + 65;
    const playerAbove = player.y < this.y - 55;

    if (distP < 28 && vertP < 50) {
      // Skip the close-range zeroing / nudge if we have an active ledge search dir (playerBelow committed drop).
      // Otherwise the x nudge could fight the outward dir and contribute to vibration at the edge.
      if (this.ledgeSearchDir === 0 && this.steppingOff <= 0) {
        this.x -= Math.sign(dx) * 2;
        this.vx = 0;
      }
    }

    const speed = (this.type === 2 ? 3.1 : 2.15) * enemySpeedMul();

    if (playerBelow) {
      this.jumpTargetX = null;
      this.jumpTargetTimer = 0;
      this.jumpStartY = 0;
      if (this.onGround) {
        // Commit to a direction (biased toward the player at the time of choice) and walk for a long time
        // to actually reach a ledge and drop. This restores the "move around to find a ledge" behavior.
        // We pick dir toward player when re-evaluating, but stick with long timer so we don't flip when
        // crossing the vertical line above the player; we continue to the far edge.
        this.searchTimer--;
        if (this.searchTimer <= 0 || this.ledgeSearchDir === 0) {
          let dir = Math.sign(player.x - this.x);
          if (dir === 0) dir = Math.random() > 0.5 ? 1 : -1;
          this.ledgeSearchDir = dir;
          this.searchTimer = 120 + Math.floor(Math.random() * 80);  // long commit to cross platform to ledge
        }
        this.vx = this.ledgeSearchDir * speed;
        this.wanderBias = 0;
        this.wanderTimer = 0;
      } else if (this.ledgeSearchDir !== 0) {
        // While falling off the ledge (onGround false) but we have a committed search dir from when we
        // were on the platform, KEEP using that dir for vx. This prevents switching to normal chase logic
        // (sign(dx)*speed + bias) which causes rapid left/right vibration around the player's x (when
        // player is directly below) just after stepping over the edge.
        this.vx = this.ledgeSearchDir * speed;
        this.wanderBias = 0;
      } else {
        // playerBelow but no active search dir yet (rare), fall back to normal
        this.wanderTimer++;
        if (this.wanderTimer > 90 + Math.random() * 50) {
          this.wanderBias = (Math.random() - 0.5) * 2.6;
          this.wanderTimer = 0;
        }
        this.vx = Math.sign(dx) * speed + this.wanderBias;
      }
    } else {
      this.ledgeSearchDir = 0;
      this.searchTimer = 0;
      this.steppingOff = 0;

      // === Platform-aware jumping when player is above ===
      // Find a nearby higher platform, but score targets to prefer those horizontally near the PLAYER's x
      // (in addition to good jump height and reasonable hDist). This makes enemies chain jumps toward the
      // player instead of wandering sideways into aimless loops on lower platforms.
      if (playerAbove) {
        this.jumpTargetTimer--;
        if (this.jumpTargetTimer <= 0 || this.jumpTargetX === null) {
          let bestTarget = null;
          let bestScore = 99999;
          const jumpRange = 420;           // horizontal search distance (a bit wider for stepping stones)
          forPlatformsBetween(this.x - jumpRange - 260, this.x + this.w + jumpRange + 260, (p) => {
            const vDist = this.y - p.t;
            if (vDist < 80 || vDist > 220) return; // only reasonable jump heights (mostly 1 level up ~148)
            const platCx = (p.l + p.r) / 2;
            const hDist = Math.abs(platCx - this.x);
            if (hDist > jumpRange) return;
            // Strongly prefer platforms at ideal one-level jump height, and especially those horizontally close
            // to the PLAYER's current x (not just enemy's). This makes them chain jumps toward the player
            // instead of picking sideways platforms and jumping around aimlessly in loops.
            const heightScore = Math.abs(vDist - 148) * 1.2;
            const playerSideDist = Math.abs(platCx - player.x);
            const score = heightScore + playerSideDist + hDist * 0.3;  // small weight on current hDist to not jump too far sideways from here
            if (score < bestScore) {
              bestScore = score;
              bestTarget = platCx;
            }
          });
          this.jumpTargetX = bestTarget;
          this.jumpTargetTimer = 25 + Math.floor(Math.random() * 15); // re-evaluate ~every 0.4s
        }
      } else {
        this.jumpTargetX = null;
        this.jumpTargetTimer = 0;
        this.jumpStartY = 0;
      }

      // Normal (or player above/same) behavior: chase x with larger, slower-changing wander
      // so they actually take noticeable side trips instead of quick tiny wobbles.
      // If we have a jumpTargetX (platform chosen to lead toward player's x), strongly bias vx toward it
      // so the enemy runs sideways to a jumpable platform on the way to the player.
      // When playerAbove but no target, still do direct chase (less wander) so they move toward player
      // instead of random side trips that look aimless.
      this.wanderTimer++;
      if (this.wanderTimer > 90 + Math.random() * 50) {
        this.wanderBias = (Math.random() - 0.5) * 2.6;  // bigger side-to-side than before
        this.wanderTimer = 0;
      }
      let chaseVx = Math.sign(dx) * speed + this.wanderBias;
      if (this.jumpTargetX !== null && playerAbove) {
        const tdx = this.jumpTargetX - this.x;
        if (Math.abs(tdx) > 15) {
          // bias movement toward the target platform (overrides pure player chase while above)
          chaseVx = Math.sign(tdx) * speed * 1.15;
        }
      } else if (playerAbove) {
        // When above the player but no (good) platform target, still chase directly toward player's x
        // (reduce wander a bit so it doesn't look aimless/random jumping while trying to get under).
        chaseVx = Math.sign(dx) * speed * 1.05 + this.wanderBias * 0.5;
      }
      this.vx = chaseVx;
    }

    // Jump decision: ALL enemy types now use the same high jump power when player is above
    // so both "brown" and "green" (all types) can reach platforms. Previously only type 1 had enough height.
    // When player below we almost never jump (prefer pure drops via ledge search + gravity).
    // ONLY jump (eagerly) when we have a specific platform target (chosen to lead toward player's x).
    // This stops random aimless up-down jumping loops on lower platforms when there's no good path to the player.
    if (this.onGround && this.jumpCooldown <= 0 && !playerBelow) {
      let jumpProb = 0.022;  // base low; only boost when we have a good target toward the player
      let targetJump = false;
      if (this.jumpTargetX !== null && playerAbove) {
        const tdx = this.jumpTargetX - this.x;
        if (Math.abs(tdx) < 420) {
          jumpProb = 0.22;   // much more eager to jump when a good platform target exists
          targetJump = true;
          // bias vx one last time toward target just before jump (helps landing on it)
          this.vx = Math.sign(tdx) * speed * 1.1;
        }
      }
      if (Math.random() < jumpProb) {
        let mult = playerAbove ? 1.08 : 0.92;   // 1.08 * 15 gives enough height (~150+ px) for all types to clear platforms
        let jPower = player.jump * mult;
        if (targetJump) jPower *= 1.05; // slightly stronger for platform jumps
        this.vy = -jPower;
        this.jumpCooldown = targetJump ? 28 : 40;
        if (targetJump) {
          this.jumpStartY = this.y;  // remember start height to detect if we made progress on landing
          // DO NOT clear target here — keep it so that on failed land we continue moving sideways toward it
        }
      }
    }

    // Edge awareness: if about to walk off and player is below us, commit to the fall (works great with ledge search)
    if (this.onGround) {
      // Use a short lookahead so we only trigger when the enemy is *right at* the visual edge.
      // Then push a few extra pixels (as requested) so the body fully clears the platform support.
      // This makes them actually step over and drop instead of stopping/turning at the edge.
      const previewX = this.x + this.vx * 5;
      const edgeLand = landOn({x: previewX, y: this.y, w: this.w, h: this.h}, 2, false);
      if (edgeLand === null) {
        if (playerBelow || player.y > this.y + 18) {
          // Intentionally walk off the platform to drop toward the player below.
          // Do not reverse, and suppress any pending jump this frame.
          this.vx *= 1.05;  // gentler speed change to reduce visual jerk
          // Small step off the edge (a few pixels) so the visual transition looks natural instead of teleporting.
          // The steppingOff + force will handle starting the fall cleanly even with partial overlap.
          // Smaller numbers + shorter preview make the drop happen when closer to the actual edge for gracefulness.
          this.x += Math.sign(this.vx) * 6;
          this.steppingOff = 2;
          if (this.vy < 0) this.vy *= 0.3;
        } else if (Math.random() < 0.55 && this.jumpCooldown <= 0) {
          // Player not clearly below — try a jump to pursue upward or turn back a little
          this.vy = -player.jump * 0.88;
          this.jumpCooldown = 32;
        } else {
          this.vx *= -0.6;
        }
      }
    }

    const dt = window._dt || 1;
    this.vy += 0.68 * dt;
    if (this.kbTime > 0) {
      this.kbTime--;
      this.vx = this.kbVx;
      this.kbVx *= 0.75;
    }
    this.x += this.vx * dt;
    let ly = landOn(this, this.vy, false);
    if (ly !== null && this.vy >= 0) {
      this.y = ly; this.vy = 0; this.onGround = true;
      // On landing: only clear jump target if we made real vertical progress (successful jump to higher platform)
      // or landed right under the target. Otherwise KEEP the target so the enemy continues walking
      // sideways on this level toward the stepping-stone platform instead of jumping in place under the player.
      if (this.jumpTargetX !== null) {
        const madeProgress = this.y < this.jumpStartY - 40;
        const landedNearTarget = Math.abs(this.x - this.jumpTargetX) < 90;
        if (madeProgress || landedNearTarget) {
          this.jumpTargetX = null;
          this.jumpTargetTimer = 0;  // force immediate re-scan on next frame to pick next platform toward the player
          this.jumpStartY = 0;
        }
        // else: failed to reach higher — keep targetX so vx bias keeps moving us horizontally to a better launch point
      }
    } else {
      this.y += this.vy * dt; this.onGround = false;
    }

    // If we just stepped off a ledge intentionally, force onGround=false for a couple frames *only if*
    // there is actually no support at the current (pushed) position. This prevents falling through
    // a platform if the (now smaller) push was borderline, while still allowing clean drop when over edge.
    // The smaller push (6px) + short preview makes the off-edge look like a natural step rather than teleport.
    if (this.steppingOff > 0) {
      this.steppingOff--;
      let support = landOn(this, 0, false);
      if (support === null) {
        this.onGround = false;
      } else {
        // still supported after push -- don't force fall through; let it land and continue (dir will keep it moving)
        this.onGround = true;
        this.y = support;
        this.vy = 0;
      }
    }
  }
  draw() {
    const sx = this.x - camX;
    const sy = this.y - camY;
    const moving = this.onGround && Math.abs(this.vx) > 0.4;
    const swing = moving ? Math.sin(frameCount * 0.34 + this.x * 0.02) * 0.52 : (this.vy < 0 ? 0.4 : 0);
    const face = this.vx !== 0 ? Math.sign(this.vx) : (player.x >= this.x ? 1 : -1);
    const centerX = sx + this.w / 2;
    const footY = sy + this.h - 3;
    ctx.save();
    ctx.translate(centerX, footY);
    ctx.scale(face < 0 ? -this.scale : this.scale, this.scale);
    ctx.translate(0, -27);
    drawBrownRunner(this.brown, this.hair, swing);
    ctx.restore();
  }
}

function drawEnemyArm(len, thick) {
  const r = thick / 2;
  ctx.beginPath();
  ctx.moveTo(0, -r);
  ctx.lineTo(len, -r);
  ctx.arc(len, 0, r, -Math.PI / 2, Math.PI / 2);
  ctx.lineTo(0, r);
  ctx.arc(0, 0, r, Math.PI / 2, -Math.PI / 2);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(len + 1, 0, 5, 4.5, 0, 0, Math.PI * 2);
  ctx.fill();
}

function drawPompadour(rise) {
  ctx.fillStyle = '#000';
  const top = -52 - rise;
  ctx.beginPath();
  ctx.moveTo(-11, -36);
  ctx.quadraticCurveTo(-19, -44, -15, -55);
  ctx.quadraticCurveTo(-11, top + 4, -1, top + 1);
  ctx.quadraticCurveTo(6, top - 2, 8, top);
  ctx.quadraticCurveTo(14, top + 2, 14.5, top + 7);
  ctx.lineTo(14.5, -47);
  ctx.quadraticCurveTo(10, -50, 2, -49);
  ctx.quadraticCurveTo(-6, -43, -11, -36);
  ctx.closePath();
  ctx.fill();
}

function drawBrownRunner(color, hair, swing) {
  const hips = [-6.3, 6.3];
  const angles = [-swing, swing];
  ctx.fillStyle = color;
  for (let i = 0; i < 2; i++) {
    ctx.save();
    ctx.translate(hips[i], 8.8);
    ctx.rotate(angles[i]);
    ctx.fillRect(-3, 0, 6, 17.2);
    ctx.fillRect(-2, 14.2, 8, 4);
    ctx.restore();
  }
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.roundRect(-9.945, -20, 19.89, 28.8, 9.18);
  ctx.fill();
  ctx.fillStyle = color;
  ctx.save();
  ctx.translate(2, -16);
  drawEnemyArm(26, 5.6);
  ctx.restore();
  ctx.save();
  ctx.translate(2, -6);
  drawEnemyArm(34, 5.6);
  ctx.restore();
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.ellipse(0, -35.5, 12.55, 15.45, 0, 0, Math.PI * 2);
  ctx.fill();
  if (hair > 0) drawPompadour(POMP_RISE[hair - 1]);
  ctx.save();
  ctx.shadowBlur = 14;
  ctx.shadowColor = '#ff3333';
  ctx.fillStyle = '#ff6b6b';
  ctx.beginPath();
  ctx.ellipse(-5.4, -39, 4.8, 5.5, 0, 0, Math.PI * 2);
  ctx.ellipse(5.4, -39, 4.8, 5.5, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

// ====================== LEFT EXPLODING ENEMIES (for left side, no left platforms) ======================
class SmallExplodingEnemy {
  constructor(x, y) {
    this.x = x; this.y = y || groundY - 50;
    this.w = 18; this.h = 28; // smaller version of regular enemies
    this.vx = 0; this.vy = 0;
    this.hp = 15;
    this.onGround = false;
    this.jumpCooldown = 0;
    this.brown = ENEMY_BROWNS[Math.floor(Math.random() * ENEMY_BROWNS.length)];
    this.hair = Math.floor(Math.random() * 6);
    this.color = this.brown;
    this.exploded = false;
  }
  update() {
    if (this.exploded) return;
    const dx = player.x - this.x;
    if (this.kbTime > 0) {
      this.kbTime--;
      this.vx = this.kbVx;
      this.kbVx *= 0.75;
    } else {
      this.vx = Math.sign(dx) * 2.2 * enemySpeedMul();
      if (this.jumpCooldown > 0) this.jumpCooldown--;
      let onGround = landOn(this, 1, false) !== null;
      if (onGround && this.jumpCooldown <= 0 && Math.random() < 0.04) {
        this.vy = -10;
        this.jumpCooldown = 25;
      }
    }
    const dt = window._dt || 1;
    this.vy += 0.68 * dt;
    this.x += this.vx * dt;
    let ly = landOn(this, this.vy, false);
    if (ly !== null && this.vy >= 0) {
      this.y = ly; this.vy = 0; this.onGround = true;
    } else {
      this.y += this.vy * dt; this.onGround = false;
    }
    // explode if close to player (contact damage) or hp low
    if (Math.abs(this.x - player.x) < 35 && Math.abs(this.y - player.y) < 35) {
      this.explode();
    }
    if (this.hp <= 0 && !this.exploded) {
      this.explode();
    }
  }
  explode() {
    if (this.exploded) return;
    this.exploded = true;
    // direct damage on explode
    if (Math.abs(this.x - player.x) < 50 && Math.abs(this.y - player.y) < 50) {
      const boom = Math.floor(7 * enemyDamageMul());
      player.hp -= boom;
      player.hitTimer = 10;
      player.hitFlash = 10;
      document.getElementById('hp').textContent = Math.floor(player.hp);
      floatingText(player.x + 16, player.y - 25, '-' + boom, '#f00');
      if (player.hp <= 0) gameOver(false);
    }
    // splatter yellow goo
    for (let i = 0; i < 3; i++) {
      gooPuddles.push({
        x: this.x + (Math.random() - 0.5) * 25,
        y: groundY - 3,
        w: 10 + Math.random() * 8,
        h: 5,
        life: 100 + Math.random() * 80,
        color: '#ffcc00', // yellow
        damage: 1.2 // stronger goo
      });
    }
  }
  draw() {
    if (this.exploded) return;
    const sx = this.x - camX, sy = this.y - camY;
    const scale = this.h / ENEMY_H;
    const moving = Math.abs(this.vx) > 0.4;
    const swing = moving ? Math.sin(frameCount * 0.34 + this.x * 0.02) * 0.52 : 0;
    const face = this.vx !== 0 ? Math.sign(this.vx) : 1;
    ctx.save();
    ctx.translate(sx + this.w / 2, sy + this.h - 3 * scale);
    ctx.scale(face < 0 ? -scale : scale, scale);
    ctx.translate(0, -27);
    drawBrownRunner(this.brown, this.hair, swing);
    ctx.restore();
  }
}

class SauceBottle {
  constructor(x, y, vx, vy) { this.x = x; this.y = y; this.vx = vx; this.vy = vy; this.w = 15; this.h = 30; this.life = 500; }
  update() {
    this.vy += 0.3;
    const nextY = this.y + this.vy;
    if (this.vy > 0) {
      const foot = nextY + this.h;
      const prevFoot = this.y + this.h;
      let hitY = null;
      forPlatformsBetween(this.x, this.x, (p) => {
        if (this.x > p.l && this.x < p.r && prevFoot <= p.t && foot >= p.t) {
          if (hitY === null || p.t < hitY) hitY = p.t;
        }
      });
      if (hitY === null && prevFoot <= groundY && foot >= groundY) hitY = groundY;
      if (hitY !== null) {
        stickSaucePuddle(this.x + this.w / 2, hitY);
        this.life = 0;
        return;
      }
    }
    this.x += this.vx;
    this.y = nextY;
    this.life--;
  }
  draw() {
    const sx = this.x - camX, sy = this.y - camY;

function modifierSpotDistances() {
  if (currentLevel <= 2) return [5000, 9000];
  return [5000 + ((currentLevel * 173) % 1001), 9000 + ((currentLevel * 251) % 1001)];
}

function planModifierDrops() {
  modifierDrops = [];
  if (currentLevel < 2) return;
  const pool = [];
  const ids = ['hot_sauce', 'spider_box', 'gypsy_tears'];
  for (let n = 0; n < ids.length; n++) {
    const id = ids[n];
    if (!player.modifiers.includes(id) && !worldPickups.some(p => p.id === id)) pool.push(id);
  }
  for (let n = pool.length - 1; n > 0; n--) {
    const j = Math.floor(Math.random() * (n + 1));
    const swap = pool[n];
    pool[n] = pool[j];
    pool[j] = swap;
  }
  const spots = modifierSpotDistances();
  for (let n = 0; n < pool.length && n < spots.length; n++) {
    modifierDrops.push({ id: pool[n], x: levelAnchorX + spots[n], dropped: false });
  }
}

function modifierPickupSize(id) {
  if (id === 'spider_box') return { w: 36, h: 18 };
  if (id === 'gypsy_tears') return { w: 16, h: 50 };
  return { w: 16, h: 36 };
}

function dropModifierFromTop(drop) {
  const size = (drop.w && drop.h) ? { w: drop.w, h: drop.h } : modifierPickupSize(drop.id);
  const h = size.h;
  const w = size.w;
  let surface = null;
  forPlatformsBetween(drop.x, drop.x + w, function (p) {
    if (drop.x + w > p.l && drop.x < p.r && (surface === null || p.t < surface)) surface = p.t;
  });
  const y = surface !== null ? surface - h - 48 : platformHeights[platformHeights.length - 1] - h;
  worldPickups.push({
    id: drop.id, x: drop.x, y: y, w: w, h: h,
    vx: 0, vy: 0, falling: true, softFall: true, cool: 8
  });
  drop.dropped = true;
}

function ensureModifierDrops() {
  for (let i = 0; i < modifierDrops.length; i++) {
    const drop = modifierDrops[i];
    if (drop.dropped) continue;
    if (nextColumnX > drop.x + 80) dropModifierFromTop(drop);
  }
}

function gearPickupSize(id) {
  if (id === 'spider_box') return { w: 36, h: 18 };
  if (id === 'gypsy_tears') return { w: 16, h: 50 };
  if (id === 'hot_sauce') return { w: 16, h: 36 };
  if (id === 'pink_guitar') return { w: 36, h: 24 };

  if (id === 'bone_club') return { w: 28, h: 22 };
  return { w: 25, h: 20 };
}

function pushEndlessGear(id, x) {
  const size = gearPickupSize(id);
  endlessGear.push({ id: id, x: x, w: size.w, h: size.h, dropped: false });
}

function planEndlessGear() {
  endlessGear = [];
  const a = endlessGearAnchor;
  if (devMode) {
    pushEndlessGear('noid_helmet', a + 400);
    pushEndlessGear('laser_glasses', a + 700);
  }
  const step = 5000;
  let slot = 1;
  const place = (id) => {
    pushEndlessGear(id, a + step * slot);
    slot++;
  };
  place('possum_helmet');
  place('bone_club');
  place('stage_mic');
  place('lederhosen');
  place('pink_guitar');
  const rollGear = (id, chance) => {
    let skips = 0;
    while (Math.random() >= chance && skips < 200) {
      slot++;
      skips++;
    }
    place(id);
  };
  rollGear('fly_shoes', 0.5);
  rollGear('spike_shoes', 0.5);
  rollGear('hot_sauce', 0.5);
  rollGear('gypsy_tears', 0.5);
  rollGear('spider_box', 0.2);
}

function ensureEndlessGear() {
  for (let i = 0; i < endlessGear.length; i++) {
    const drop = endlessGear[i];
    if (drop.dropped) continue;
    if (nextColumnX > drop.x + 80) dropModifierFromTop(drop);

function sweepEndlessDead() {
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    if (!e || e.hp > 0 || e.exploded) continue;
    dropShrunkPuddles(e);

    enemies.splice(i, 1);
    totalKills++;

function mixRgb(a, b, t) {
  return {
    r: Math.round(a.r + (b.r - a.r) * t),
    g: Math.round(a.g + (b.g - a.g) * t),
    b: Math.round(a.b + (b.b - a.b) * t)
  };
}
function rgbCss(c) {
  return 'rgb(' + c.r + ',' + c.g + ',' + c.b + ')';
}
function endlessHeatRgb(h) {
  const stops = [
    { t: 0, c: { r: 0, g: 0, b: 0 } },
    { t: 0.22, c: { r: 255, g: 186, b: 40 } },
    { t: 0.45, c: { r: 255, g: 98, b: 18 } },
    { t: 0.7, c: { r: 220, g: 28, b: 16 } },
    { t: 1, c: { r: 176, g: 8, b: 12 } }
  ];
  const u = Math.max(0, Math.min(1, h));
  let i = 0;
  while (i < stops.length - 1 && stops[i + 1].t < u) i++;
  const a = stops[i];
  const b = stops[Math.min(i + 1, stops.length - 1)];
  const span = (b.t - a.t) || 1;
  return mixRgb(a.c, b.c, (u - a.t) / span);
}
function endlessSkyTargetRgb(wave) {
  const w = Math.max(1, wave || 1);
  if (w <= 6) return mixRgb({ r: 135, g: 206, b: 235 }, { r: 0, g: 0, b: 0 }, (w - 1) / 5);
  return endlessHeatRgb((w - 6) / 14);
}
function endlessGroundTargetRgb(wave) {
  const t = Math.max(0, Math.min(1, (Math.max(1, wave || 1) - 1) / 5));
  return mixRgb({ r: 187, g: 187, b: 187 }, { r: 0, g: 0, b: 0 }, t);
}
function stepEndlessSky() {
  const w = Math.max(1, waveIndex || 1);
  const blackTarget = Math.max(0, Math.min(1, (w - 1) / 5));
  const heatTarget = w <= 6 ? 0 : Math.max(0, Math.min(1, (w - 6) / 14));
  endlessBlacken += (blackTarget - endlessBlacken) * 0.018;
  endlessHeat += (heatTarget - endlessHeat) * 0.018;
}
function endlessGroundCss() {
  return rgbCss(mixRgb({ r: 187, g: 187, b: 187 }, { r: 0, g: 0, b: 0 }, Math.max(0, Math.min(1, endlessBlacken))));
}
function drawEndlessSkyWash(camY) {
  if (endlessBlacken < 0.01 && endlessHeat < 0.01) return;
  const horizonScreenY = 390 - camY * 0.28;
  const groundScreen = groundY - camY;
  const skyBottom = Math.min(horizonScreenY, groundScreen);
  if (skyBottom > 0) {
    if (endlessHeat > 0.02) {
      ctx.fillStyle = rgbCss(endlessHeatRgb(endlessHeat));
      ctx.fillRect(0, 0, W, skyBottom);
    } else if (endlessBlacken > 0.01) {
      ctx.fillStyle = 'rgba(0,0,0,' + endlessBlacken + ')';
      ctx.fillRect(0, 0, W, skyBottom);
    }
  }
  if (endlessBlacken > 0.01 && groundScreen > skyBottom) {
    const top = Math.max(0, skyBottom);
    const h = groundScreen - top;
    ctx.fillStyle = 'rgba(18,18,18,' + endlessBlacken + ')';
    ctx.fillRect(0, top, W, h);
    ctx.fillStyle = 'rgba(58,58,58,' + (endlessBlacken * 0.92) + ')';
    ctx.fillRect(0, top, W, Math.min(52, h));
  }
}

function spawnEndlessOne(dir, slot) {
  if (waveUnreleased <= 0) return;
  const d = dir < 0 ? -1 : 1;
  const slotN = slot == null ? Math.floor(Math.random() * 8) : slot;
  const dist = 900 + (slotN % 8) * 70 + Math.random() * 40;
  const x = player.x + d * dist;
  const surfaces = [];
  forPlatformsBetween(x - 40, x + 40, function (p) {
    if (x > p.l && x < p.r) surfaces.push(p.t);
  });
  let surface = groundY;
  if (surfaces.length) {
    const n = Math.min(4, surfaces.length);
    surface = surfaces[Math.floor(Math.random() * n)];
  }
  enemies.push(new Enemy(x, surface, Math.floor(Math.random() * 3)));
  waveUnreleased--;
}

function leashEndlessEnemies() {
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    if (!e || Math.abs(e.x - player.x) <= 2500) continue;
    enemies.splice(i, 1);
    waveUnreleased++;
  }
}

function spawnEndlessWave() {
  waveIndex++;
  const n = waveIndex * 10;
  waveTotal = n;
  waveUnreleased = n;
  waveWait = 0;
  const cap = Math.min(25, n);
  for (let i = 0; enemies.length < cap && waveUnreleased > 0; i++) spawnEndlessOne(endlessWalkDir || 1, i);
  waveLeft = waveUnreleased + enemies.length;
}

function updateEndlessWaves() {
  if (difficulty !== 'endless' || inSecretDimension || gameState !== STATE_PLAYING || gamePaused) return;
  sweepEndlessDead();
  ensureEndlessGear();
  if (player.vx > 0.35) endlessWalkDir = 1;
  else if (player.vx < -0.35) endlessWalkDir = -1;
  if (endlessNeedSpawn) {
    spawnEndlessWave();
    endlessNeedSpawn = false;
  } else if (waveWait > 0) {
    waveWait--;
    if (waveWait <= 0) spawnEndlessWave();
  } else {
    leashEndlessEnemies();
    if (waveUnreleased > 0 && enemies.length <= 24) spawnEndlessOne(endlessWalkDir || 1);
    else if (waveUnreleased <= 0 && enemies.length === 0 && waveIndex > 0) waveWait = 300;
  }
  stepEndlessSky();
  waveLeft = waveUnreleased + enemies.length;
}

function beginEndless() {
  currentLevel = 10;
  waveIndex = 0;
  waveTotal = 10;
  waveLeft = 10;
  waveWait = 0;
  waveUnreleased = 0;
  endlessWalkDir = 1;
  endlessBlacken = 0;
  endlessHeat = 0;
  endlessGearAnchor = player.x;
  endlessNeedSpawn = true;
  planEndlessGear();
  document.getElementById('lvl').textContent = '1';
  document.getElementById('kills').textContent = '10';
  document.getElementById('goal').textContent = '10';
  showLevelMsg('WAVE 1');
}

function releaseSpiders() {
  if (!player.modifiers.includes('spider_box') || inSecretDimension) return;
  let left = 2;
  while (left > 0 && looseSpiders.length < 6) {
    looseSpiders.push({
      x: player.x + 6 + Math.random() * 14,
      y: player.y + player.h - 8,
      w: 12,
      h: 8,
      vx: 0,
      vy: -1,
      onGround: false
    });
    left--;
  }
}

function spiderFoeList() {
  const list = [];
  for (let i = 0; i < enemies.length; i++) {
    const e = enemies[i];
    if (!e || e.hp <= 0 || e.exploded) continue;
    list.push(e);
  }
  if (boss && boss.hp > 0) list.push(boss);
  if (boss2 && boss2.hp > 0) list.push(boss2);
  return list;
}

function spiderOnScreen(e) {
  const w = e.w || 32;
  const h = e.h || 40;
  return e.x + w >= camX && e.x <= camX + W && e.y + h >= camY && e.y <= camY + H;
}

function spiderGoal(s, i) {
  const sx = s.x + s.w / 2;
  const px = player.x + 16;
  const lo = Math.min(sx, px) - 20;
  const hi = Math.max(sx, px) + 20;
  const list = spiderFoeList();
  let between = null;
  let betweenD = 1e9;
  let nearest = null;
  let nearestD = 1e9;
  for (let n = 0; n < list.length; n++) {
    const e = list[n];
    if (!spiderOnScreen(e)) continue;
    const w = e.w || 32;
    const h = e.h || 40;
    const cx = e.x + w / 2;
    const cy = e.y + h / 2;
    const d = (cx - sx) * (cx - sx) + (cy - (s.y + s.h / 2)) * (cy - (s.y + s.h / 2));
    if (d < nearestD) { nearestD = d; nearest = e; }
    if (cx >= lo && cx <= hi && d < betweenD) { betweenD = d; between = e; }
  }
  const foe = between || nearest;
  if (foe) {
    const w = foe.w || 32;
    const h = foe.h || 40;
    return { foe: true, x: foe.x + w / 2, feet: foe.y + h };
  }
  const slot = (i - (looseSpiders.length - 1) / 2) * 11;
  return { foe: false, x: player.x + 16 + slot, feet: player.y + player.h };
}

function spiderRunVx(s, tx, speed) {
  const dx = tx - (s.x + s.w / 2);
  if (Math.abs(dx) < 3) return 0;
  return Math.sign(dx) * speed;
}

// Same step as the live spider: vy -15.2, then gravity 0.62, then move.
function spiderHopLands(s, vx) {
  let x = s.x;
  let y = s.y;
  let vy = -15.2;
  const startFeet = s.y + s.h;
  for (let f = 0; f < 80; f++) {
    vy += 0.62;
    x += vx;
    const land = landOn({ x: x, y: y, w: s.w, h: s.h }, vy, false);
    if (land !== null && vy >= 0) {
      const top = land + s.h;
      if (top < startFeet - 28) return { x: x, top: top };
      return null;
    }
    y += vy;
    if (y > groundY + 80) return null;
  }
  return null;
}

function spiderPickHop(s, gx, goalFeet) {
  const speeds = [0, 2, -2, 3.2, -3.2, 5.4, -5.4];
  let best = null;
  let bestScore = 1e9;
  const sx = s.x + s.w / 2;
  const feet = s.y + s.h;
  for (let n = 0; n < speeds.length; n++) {
    const vx = speeds[n];
    const land = spiderHopLands(s, vx);
    if (!land) continue;
    const landCx = land.x + s.w / 2;
    const hBefore = Math.abs(sx - gx);
    const hAfter = Math.abs(landCx - gx);
    const vBefore = Math.abs(feet - goalFeet);
    const vAfter = Math.abs(land.top - goalFeet);
    if (vAfter > vBefore - 10 && hAfter > hBefore - 8) continue;
    const score = hAfter + vAfter * 0.35 + Math.abs(vx) * 0.15;
    if (score < bestScore) { bestScore = score; best = vx; }
  }
  return best;
}

function spiderClimbStand(s, gx, goalFeet) {
  const feet = s.y + s.h;
  const sx = s.x + s.w / 2;
  let best = null;
  let bestScore = 1e9;
  forPlatformsBetween(sx - 2560, sx + 2560, function (p) {
    const rise = feet - p.t;
    if (rise < 28 || rise > 175) return;
    if (s.x + s.w > p.l && s.x < p.r) return;
    const standCx = sx < p.l ? p.l : p.r;
    const mid = (p.l + p.r) / 2;
    const hAfter = Math.abs(mid - gx);
    const hNow = Math.abs(sx - gx);
    const vAfter = Math.abs(p.t - goalFeet);
    const vNow = Math.abs(feet - goalFeet);
    const vertCloser = vAfter < vNow - 16;
    const horizCloser = hAfter < hNow - 12;
    if (!vertCloser && !horizCloser) return;
    const wrongWay = Math.abs(gx - sx) > 30 && Math.sign(mid - sx) !== Math.sign(gx - sx);
    let score = Math.abs(standCx - sx) * 0.15 + hAfter * 0.45 + vAfter * 0.25;
    if (wrongWay) score += 800;
    if (!vertCloser) score += 180;
    if (score < bestScore) { bestScore = score; best = standCx; }
  });
  return best;
}

function shrinkRegularEnemy(foe) {
  if (!foe || foe.shrunk || !(foe instanceof Enemy)) return;
  const oldH = foe.h;
  foe.w = 18;
  foe.h = 28;
  foe.y += oldH - 28;
  foe.scale = 28 / ENEMY_H;
  foe.shrunk = true;
}

function dropShrunkPuddles(ent) {
  if (!ent || !ent.shrunk || ent.puddled) return;
  ent.puddled = true;
  const cx = ent.x + (ent.w || 18) / 2;
  const foot = ent.y + (ent.h || 28);
  for (let n = 0; n < 3; n++) {
    gooPuddles.push({
      x: cx + (Math.random() - 0.5) * 25,
      y: foot - 3,
      w: 10 + Math.random() * 8,
      h: 5,
      life: 100 + Math.random() * 80,
      color: '#ffcc00',
      damage: 1.2
    });
  }
}

function reapShrunkEnemies() {
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    if (!e || !e.shrunk || e.hp > 0) continue;
    dropShrunkPuddles(e);
    maybeDropHealBottle(e);
    const ex = e.x + (e.w || 18) / 2;
    const ey = e.y + (e.h || 28) / 2;
    floatingText(ex, ey - 20, killPhrases[Math.floor(Math.random() * killPhrases.length)], '#ff0');
    enemies.splice(i, 1);
    totalKills++;
  }
}

function hurtSpiderFoe(foe, dmg, goo) {
  foe.hp -= dmg;
  const x = foe.x + (foe.w || 32) / 2;
  const y = foe.y + 8;
  floatingText(x, y - 16, '-' + dmg, goo ? '#f01400' : '#fff');
  if (goo) {

      particles.push({ x: x, y: y, vx: Math.random() * 8 - 4, vy: Math.random() * 8 - 6, life: 18, c: '#f01400', s: 3 });
    }
  }
  if (foe.hp > 0) return;
  const idx = enemies.indexOf(foe);
  if (idx < 0) return;
  dropShrunkPuddles(foe);
  maybeDropHealBottle(foe);
  floatingText(x, y - 28, killPhrases[Math.floor(Math.random() * killPhrases.length)], '#ff0');
  enemies.splice(idx, 1);
  totalKills++;
}

function updateLooseSpiders() {
  if (inSecretDimension) return;
  const goo = player.modifiers.includes('hot_sauce');
  const tears = player.modifiers.includes('gypsy_tears');
  for (let i = looseSpiders.length - 1; i >= 0; i--) {
    const s = looseSpiders[i];
    const goal = spiderGoal(s, i);
    const speed = goal.foe ? 3.6 : 5.4;
    const above = goal.feet < s.y + s.h - 28;
    if (!s.onGround) {
      if (s.hopVx != null) s.vx = s.hopVx;
      else s.vx = spiderRunVx(s, goal.x, speed);
    } else if (above) {
      const hop = spiderPickHop(s, goal.x, goal.feet);
      if (hop !== null) {
        s.vy = -15.2;
        s.vx = hop;
        s.hopVx = hop;
      } else {
        s.hopVx = null;
        const stand = spiderClimbStand(s, goal.x, goal.feet);
        s.vx = spiderRunVx(s, stand === null ? goal.x : stand, speed);
      }
    } else {
      s.hopVx = null;
      s.vx = spiderRunVx(s, goal.x, speed);
    }
    s.vy += 0.62;
    s.x += s.vx;
    const land = landOn(s, s.vy, false);
    if (land !== null && s.vy >= 0) {
      s.y = land;
      s.vy = 0;
      s.onGround = true;
      s.hopVx = null;
    } else {
      s.y += s.vy;
      s.onGround = false;
    }
    const foes = spiderFoeList();
    for (let f = 0; f < foes.length; f++) {
      const foe = foes[f];
      const fw = foe.w || 32;
      const fh = foe.h || 40;
      if (s.x < foe.x + fw && s.x + s.w > foe.x && s.y < foe.y + fh && s.y + s.h > foe.y) {
        if (tears) shrinkRegularEnemy(foe);
        hurtSpiderFoe(foe, spiderStrikeDamage(), goo);
        looseSpiders.splice(i, 1);
        break;
      }
    }
  }
}

function drawLooseSpiders() {
  if (inSecretDimension) return;
  const goo = player.modifiers.includes('hot_sauce');
  for (let i = 0; i < looseSpiders.length; i++) {
    const s = looseSpiders[i];
    ctx.save();
    ctx.translate(s.x - camX + s.w / 2, s.y - camY + s.h / 2);
    if (s.vx < 0) ctx.scale(-1, 1);
    drawSpider(goo);
    ctx.restore();
  }
}

function tickSauceAndFarts() {
  if (sauceHurtCool > 0) sauceHurtCool--;
  if (fartHurtCool > 0) fartHurtCool--;
  if (sauceBatchLife > 0) {
    sauceBatchLife--;
    if (sauceBatchLife <= 0) saucePuddles.length = 0;
  }
  ctx.fillStyle = '#b71c1c';
  let inSauce = false;
  for (let i = 0; i < saucePuddles.length; i++) {
    const p = saucePuddles[i];
    ctx.fillRect(p.x - p.w / 2 - camX, p.y - 6 - camY, p.w, 8);
    if (!inSauce && player.x + player.w > p.x - p.w / 2 && player.x < p.x + p.w / 2 &&
        player.y + player.h > p.y - 10 && player.y + player.h < p.y + 14) inSauce = true;
  }
  if (inSauce && sauceHurtCool <= 0 && !gameIsOver && !isReviving) {
    player.hp -= 1;
    sauceHurtCool = 120;
    player.hitFlash = 6;
    document.getElementById('hp').textContent = Math.floor(player.hp);
    floatingText(player.x + 16, player.y - 25, '-1', '#c62828');
    if (player.hp <= 0) gameOver(false);
  }
  let inFart = false;
  for (let i = fartClouds.length - 1; i >= 0; i--) {
    const c = fartClouds[i];
    c.life--;
    if (c.life <= 0) { fartClouds.splice(i, 1); continue; }
    drawFartCloud(c);
    const dx = (player.x + 16) - c.x;
    const dy = (player.y + 40) - c.y;
    if ((dx * dx) / (c.rx * c.rx) + (dy * dy) / (c.ry * c.ry) < 1) inFart = true;
  }
  if (inFart && fartHurtCool <= 0 && !gameIsOver && !isReviving) {
    const resistFactor = Math.min(100, player.resistance) / 100;
    const dmg = Math.max(1, Math.floor(4 * (1 - resistFactor)));
    player.hp -= dmg;
    fartHurtCool = 20;
    player.hitFlash = 8;
    document.getElementById('hp').textContent = Math.floor(player.hp);
    floatingText(player.x + 16, player.y - 25, '-' + dmg, '#3a4a22');
    if (player.hp <= 0) gameOver(false);
  }
}

function hurtFromGoo(raw, pool) {
  if (gameIsOver || isReviving) return;
  if (pool) {
    if (gooPoolCool > 0) return;
    gooPoolCool = 22;
  } else {
    if (gooDropCool > 0) return;
    gooDropCool = 22;
  }
  const resistFactor = Math.min(100, player.resistance) / 100;
  const dmg = Math.max(1, Math.floor(raw * (1 - resistFactor)));
  player.hp -= dmg;
  player.hitTimer = 5;
  player.hitFlash = 12;
  document.getElementById('hp').textContent = Math.floor(player.hp);
  floatingText(player.x + 16, player.y - 25, '-' + dmg, '#39ff14');
  if (player.hp <= 0) gameOver(false);
}

class GooDrop {
  constructor(x, y, vx, vy) {
    this.x = x; this.y = y; this.vx = vx; this.vy = vy;
    this.radius = 6; this.life = 180; this.canPool = false;
  }
  update() {
    this.life--;
    this.x += this.vx;
    this.vy += 0.28;
    const nextY = this.y + this.vy;
    if (this.canPool && this.vy > 0) {
      let hit = null;
      forPlatformsBetween(this.x - 8, this.x + 8, (p) => {
        if (this.x > p.l && this.x < p.r && this.y <= p.t && nextY >= p.t) {
          if (!hit || p.t < hit.t) hit = p;
        }
      });
      if (hit) {
        if (Math.random() < 0.05) {
          stickShowerPuddle(this.x, hit.t);
          this.life = 0;
          return;
        }
      } else if (this.y <= groundY && nextY >= groundY && Math.random() < 0.05) {
        stickShowerPuddle(this.x, groundY);
        this.life = 0;
        return;
      }
    }
    this.y = nextY;
    if (this.y > groundY + 120) { this.life = 0; return; }
    if (Math.abs(this.x - (player.x + 16)) < 24 && Math.abs(this.y - (player.y + 28)) < 40) {
      hurtFromGoo(3, false);
      this.life = 0;
    }
  }
  draw() {
    ctx.save();
    ctx.translate(this.x - camX, this.y - camY);
    ctx.rotate(Math.atan2(this.vy, this.vx || 0.001));
    ctx.fillStyle = '#39ff14';
    ctx.fillRect(-1, -2, 12, 4);
    ctx.restore();
  }
}

function getPlayerLegSwing() {
  if (titleActor && titleActor.walking) return Math.sin(titleActor.t * 0.34) * 0.52;
  const moving = player.onGround && Math.abs(player.vx) > 0.5;
  if (!player.onGround) return player.vy < 0 ? 0.45 : 0.22;
  if (!moving) return 0;
  return Math.sin(frameCount * 0.34) * 0.52;
}

const ARM_UPPER = 11;
const ARM_FORE = 12;

function lerp(a, b, t) { return a + (b - a) * t; }

function getChopT() {
  if (player.swingTimer <= 0) return 0;
  const p = player.swingTimer / 20;
  if (p < 0.45) return p / 0.45;
  if (p < 0.72) return 1 - ((p - 0.45) / 0.27) * 0.12;
  return 0.88 * (1 - (p - 0.72) / 0.28);
}

function getArmPose(side, chop) {
  const mir = (a) => (side > 0 ? a : Math.PI - a);
  const restU = mir(0.95);
  const restF = mir(-2.2);
  const restW = mir(-2.5);
  const ext = mir(0.9);
  const u = lerp(restU, ext, chop);
  const f = lerp(restF, ext, chop);
  const w = lerp(restW, ext, chop);
  const shx = 13 * side;
  const shy = -15;
  const elbowX = shx + Math.cos(u) * ARM_UPPER;
  const elbowY = shy + Math.sin(u) * ARM_UPPER;
  const fistX = elbowX + Math.cos(f) * ARM_FORE;
  const fistY = elbowY + Math.sin(f) * ARM_FORE;
  return { shx, shy, u, f, w, fistX, fistY };
}

// Right shoulder stays put when the body flips. Facing right keeps the original pose.
// Facing left: elbow drops down the outer side, forearm reaches in toward the body,
// so the weapon handle sits lower and closer to center. Swing still ends the same way.
function getPinnedWeaponPose(chop) {
  if (player.facing >= 0) return getArmPose(1, chop);
  const restU = 1.35;
  const restF = -160 * Math.PI / 180;
  const restW = Math.PI + 2.25;
  const swing = Math.PI - 0.9;
  const u = lerp(restU, swing, chop);
  const f = lerp(restF, swing - Math.PI * 2, chop);
  const w = lerp(restW, swing, chop);
  const shx = 13;
  const shy = -15;
  const elbowX = shx + Math.cos(u) * ARM_UPPER;
  const elbowY = shy + Math.sin(u) * ARM_UPPER;
  const fistX = elbowX + Math.cos(f) * ARM_FORE;
  const fistY = elbowY + Math.sin(f) * ARM_FORE;
  return { shx, shy, u, f, w, fistX, fistY };
}

// Other hand stays on the screen-left shoulder. Same angles as the spork,
// so both weapons rest and swing the same direction. Turning does not swap hands.
function getOffHandWeaponPose(chop) {
  const pose = getPinnedWeaponPose(chop);
  const shx = -13;
  const shy = -15;
  const elbowX = shx + Math.cos(pose.u) * ARM_UPPER;
  const elbowY = shy + Math.sin(pose.u) * ARM_UPPER;
  const fistX = elbowX + Math.cos(pose.f) * ARM_FORE;
  const fistY = elbowY + Math.sin(pose.f) * ARM_FORE;
  return { shx, shy, u: pose.u, f: pose.f, w: pose.w, fistX, fistY };
}

}

function drawPinkGuitarBlade() {
  ctx.save();
  // Translate slightly back so the character grips the top of the neck/headstock
  ctx.translate(-10, 0);

  const guitarPink = '#e478ce';
  const darkPink = '#b84d9f';
  const neckColor = '#c0c0c0';
  const pickupColor = '#1a1a1a';
  const outlineColor = '#000000';

  ctx.lineWidth = 2;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  // --- 1. HEADSTOCK (At the grip/origin) ---
  ctx.fillStyle = darkPink;
  ctx.strokeStyle = outlineColor;
  ctx.beginPath();
  ctx.moveTo(0, -6);
  ctx.lineTo(20, -10);
  ctx.lineTo(28, -2);
  ctx.lineTo(20, 4);
  ctx.lineTo(0, 4);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  // --- 2. GUITAR NECK ---
  ctx.fillStyle = neckColor;
  ctx.fillRect(18, -4, 52, 8);
  ctx.strokeRect(18, -4, 52, 8);

  // Fretboard/Strings lines
  ctx.strokeStyle = '#888888';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(20, -2); ctx.lineTo(70, -2);
  ctx.moveTo(20, 0);  ctx.lineTo(70, 0);
  ctx.moveTo(20, 2);  ctx.lineTo(70, 2);
  ctx.stroke();

  // --- 3. GUITAR BODY (Offset to the end of the neck) ---
  ctx.lineWidth = 2;
  ctx.strokeStyle = outlineColor;
  ctx.fillStyle = guitarPink;

  ctx.beginPath();
  // Neck joint
  ctx.moveTo(70, -5);
  // Upper horn/cutaway
  ctx.quadraticCurveTo(74, -18, 86, -22);
  ctx.quadraticCurveTo(98, -20, 96, -8);
  // Upper bout & waist
  ctx.quadraticCurveTo(110, -18, 126, -14);
  // Bottom / Tail of guitar
  ctx.quadraticCurveTo(138, 0, 126, 16);
  // Lower bout & waist
  ctx.quadraticCurveTo(106, 22, 92, 14);
  // Lower horn
  ctx.quadraticCurveTo(76, 18, 70, 5);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  // --- 4. PICKUP & DETAILS ---
  // Black Pickup
  ctx.fillStyle = pickupColor;
  ctx.fillRect(82, -6, 12, 12);

  // Knobs
  ctx.fillStyle = '#222222';
  ctx.beginPath();
  ctx.arc(102, -8, 3, 0, Math.PI * 2);
  ctx.arc(110, -4, 3, 0, Math.PI * 2);
  ctx.arc(116, 2, 3, 0, Math.PI * 2);
  ctx.fill();

  // Blood/Spunk Splatter on the body tip (matching spork/club aesthetic)
  ctx.fillStyle = '#d32f2f';
  ctx.beginPath();
  ctx.arc(126, 6, 7, 0, Math.PI * 2);
  ctx.arc(130, -2, 5, 0, Math.PI * 2);
  ctx.arc(122, 12, 4, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

function drawGuitarBesideSpork() {
  ctx.save();
  ctx.rotate(8 * Math.PI / 180);
  drawPinkGuitarBlade();
  ctx.restore();
}

function drawGuitarArm(legSwing) {

function drawFreeArm(legSwing) {

function drawTitleBareArm(legSwing) {

function drawStubbyArm(len, thick, fist) {
  const r = thick / 2;
  const L = Math.max(0, len);
  ctx.fillStyle = PLAYER_SKIN;
  ctx.beginPath();
  ctx.moveTo(0, -r);
  ctx.lineTo(L, -r);
  ctx.arc(L, 0, r, -Math.PI / 2, Math.PI / 2);
  ctx.lineTo(0, r);
  ctx.arc(0, 0, r, Math.PI / 2, -Math.PI / 2);
  ctx.closePath();
  ctx.fill();
  if (fist) {
    ctx.beginPath();
    ctx.ellipse(L + 1, 0, 5, 4.5, 0, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawPossumHelmet() {
  ctx.fillStyle = '#4a2c2c'; ctx.fillRect(-18, -48, 36, 22);
  ctx.fillStyle = '#f0d0b0'; ctx.fillRect(-14, -46, 28, 14);
  ctx.fillStyle = '#111'; ctx.fillRect(-10, -42, 4, 4); ctx.fillRect(6, -42, 4, 4);
  ctx.fillStyle = '#4a2c2c';
  ctx.fillRect(-20, -52, 8, 8); ctx.fillRect(12, -52, 8, 8);
  ctx.strokeStyle = '#e8a0b0'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(18, -38); ctx.quadraticCurveTo(26, -35, 30, -28); ctx.stroke();
  ctx.fillStyle = '#4a2c2c';
  ctx.fillRect(-14, -28, 4, 8); ctx.fillRect(-6, -28, 4, 8); ctx.fillRect(2, -28, 4, 8); ctx.fillRect(10, -28, 4, 8);

function drawNoidHelmet() {
  ctx.save();
  ctx.fillStyle = '#ff3131';

function drawLaserGlasses(withBeam) {
  ctx.strokeStyle = '#2b4bb2';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(-2, -36, 11, Math.PI * 0.85, Math.PI * 0.15, true);
  ctx.stroke();

  ctx.fillStyle = '#0a0a0a';
  ctx.beginPath();
  ctx.moveTo(-12, -38);
  ctx.lineTo(-3, -38);
  ctx.lineTo(-7.5, -29);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(3, -38);
  ctx.lineTo(12, -38);
  ctx.lineTo(7.5, -29);
  ctx.closePath();
  ctx.fill();

  if (withBeam && player.isFiringLaser) {
    ctx.shadowBlur = 0;
    const beamY = -32;
    ctx.lineCap = 'round';
    ctx.strokeStyle = 'rgba(255, 0, 0, 0.35)';
    ctx.lineWidth = 28;
    ctx.beginPath();
    ctx.moveTo(12, beamY);
    ctx.lineTo(812, beamY);
    ctx.stroke();
    ctx.strokeStyle = '#ff0033';
    ctx.lineWidth = 12;
    ctx.beginPath();
    ctx.moveTo(12, beamY);
    ctx.lineTo(812, beamY);
    ctx.stroke();
    ctx.strokeStyle = '#ffccdd';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(12, beamY);
    ctx.lineTo(812, beamY);
    ctx.stroke();
  }
}

function drawLederhosen() {
  ctx.fillStyle = "#1b5e20";
  ctx.fillRect(-13, 4, 26, 12);

  ctx.fillStyle = "#2e7d32";
  ctx.fillRect(-8, 6, 16, 8);

  ctx.strokeStyle = "#1b5e20";
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(-9, 4); ctx.lineTo(-9, -6);
  ctx.moveTo(9, 4);  ctx.lineTo(9, -6);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(-12, 1); ctx.lineTo(12, 1);
  ctx.stroke();

  ctx.fillStyle = "#ffd700";
  ctx.fillRect(-5, 8, 2, 2);

}

function drawFlyShoe(legLen) {
  const pos = { x: -4, y: legLen - 2 };

  ctx.fillStyle = '#e0e0e4';
  ctx.fillRect(pos.x, pos.y - 4, 8, 7);
  ctx.fillRect(pos.x + 1, pos.y - 8, 6, 5);

  ctx.beginPath();
  ctx.moveTo(pos.x + 1, pos.y + 1);
  ctx.lineTo(pos.x + 11, pos.y + 1);
  ctx.lineTo(pos.x + 11, pos.y + 4);
  ctx.lineTo(pos.x + 1, pos.y + 4);
  ctx.closePath();
  ctx.fill();

  ctx.strokeStyle = '#00ffff';
  ctx.lineWidth = 1.6;
  ctx.beginPath();
  ctx.moveTo(pos.x, pos.y + 4);
  ctx.lineTo(pos.x + 10, pos.y + 4);
  ctx.stroke();
  ctx.lineWidth = 0.8;
  ctx.strokeStyle = 'rgba(0,255,255,0.6)';
  ctx.beginPath();
  ctx.moveTo(pos.x - 1, pos.y + 5);
  ctx.lineTo(pos.x + 11, pos.y + 5);
  ctx.stroke();

  ctx.fillStyle = '#ff3366';
  ctx.fillRect(pos.x + 2, pos.y - 7, 3, 2);
}

function drawSpikeShoe(legLen) {
  const pos = { x: -4, y: legLen - 2 };
  ctx.fillStyle = '#6b4423';
  ctx.fillRect(pos.x, pos.y - 4, 8, 7);
  ctx.fillRect(pos.x + 1, pos.y - 8, 6, 5);
  ctx.beginPath();
  ctx.moveTo(pos.x + 1, pos.y + 1);
  ctx.lineTo(pos.x + 11, pos.y + 1);
  ctx.lineTo(pos.x + 11, pos.y + 4);
  ctx.lineTo(pos.x + 1, pos.y + 4);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.moveTo(pos.x + 10, pos.y - 1);
  ctx.lineTo(pos.x + 19, pos.y - 5);
  ctx.lineTo(pos.x + 11, pos.y + 1);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(pos.x + 10, pos.y + 2);
  ctx.lineTo(pos.x + 19, pos.y + 6);
  ctx.lineTo(pos.x + 11, pos.y + 4);
  ctx.closePath();
  ctx.fill();
}

function drawGroundPickupArt(item) {
  const sx = item.x - camX;
  const sy = item.y - camY;
  const foot = sy + (item.h || 20);
  const mid = sx + (item.w || 25) / 2;
  ctx.save();
  if (item.id === 'lederhosen') {
    ctx.translate(mid, foot - 16);
    drawLederhosen();
  } else if (item.id === 'fly_shoes' || item.id === 'spike_shoes') {
    const drawShoe = item.id === 'spike_shoes' ? drawSpikeShoe : drawFlyShoe;
    ctx.save();
    ctx.translate(mid - 14, foot - 17);
    drawShoe(14);
    ctx.restore();
    ctx.save();
    ctx.translate(mid + 2, foot - 17);
    drawShoe(14);
    ctx.restore();
  } else if (item.id === 'possum_helmet') {
    ctx.translate(mid - 5, foot + 20);
    drawPossumHelmet();
  } else if (item.id === 'laser_glasses') {
    ctx.translate(mid, foot + 29);
    drawLaserGlasses(false);
  } else if (item.id === 'noid_helmet') {
    ctx.translate(mid, foot + 28);
    drawNoidHelmet();
  } else if (item.id === 'bone_club') {
    ctx.translate(mid - 52, foot - 12);
    drawClubBlade();
  } else if (item.id === 'pink_guitar') {
    ctx.translate(mid - 59, foot - 22);
    drawPinkGuitarBlade();
  } else if (item.id === 'hot_sauce') {
    ctx.translate(mid, foot);
    ctx.scale(1.4, 1.4);
    drawHotSauceBottle();
  } else if (item.id === 'spider_box') {
    ctx.translate(mid, foot);
    drawSpiderBox();
  } else if (item.id === 'gypsy_tears') {
    ctx.translate(mid, foot);
    drawGypsyTears();
  } else if (item.id === 'heal_bottle') {
    drawWaterBottle(mid, foot - 15, 1.15);
  } else if (item.id === 'stage_mic') {
    ctx.fillStyle = '#1c2526'; ctx.fillRect(sx - 4, sy + 8, 8, 22);
    ctx.fillStyle = '#e6e6e6'; ctx.beginPath(); ctx.ellipse(sx, sy - 2, 12, 10, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#111'; ctx.lineWidth = 2.5; ctx.stroke();
    ctx.fillStyle = '#374151'; ctx.fillRect(sx - 8, sy - 6, 16, 2); ctx.fillRect(sx - 8, sy - 2, 16, 2); ctx.fillRect(sx - 8, sy + 2, 16, 2);
    ctx.fillStyle = '#ffd700'; ctx.fillRect(sx - 7, sy + 13, 14, 3);
  }
  ctx.restore();
}

function drawPlayerAndInventory() {
  const sx = player.x - camX;
  const sy = player.y - camY;
  const legSwing = getPlayerLegSwing();
  const legHipY = 12;
  const legLen = 14;

  const healing = (keys['z'] || keys['Z']) && player.hp < player.maxHp && gameState === STATE_PLAYING;
  if (healing) { ctx.shadowColor = '#0f0'; ctx.shadowBlur = 25; }

  ctx.save();
  ctx.translate(sx + 16, sy + 30);
  if (titleActor && titleActor.pose === 'squat') ctx.translate(0, 16);
  const offHandWeapon = player.weapons.includes('bone_club') || player.weapons.includes('pink_guitar');
  const titleHideArms = titleActor && (titleActor.pose === 'squat' || titleActor.pose === 'hold' || titleActor.pose === 'toss');
  const titleBare = titleActor && !titleActor.smiling;
  if (!player.hasSantaSleigh && !offHandWeapon && !titleHideArms) drawFreeArm(legSwing);
  if (player.facing < 0) ctx.scale(-1, 1);

  if (player.hitFlash > 0) {
    ctx.globalAlpha = 0.6;
    ctx.fillStyle = '#ff4444';
    ctx.beginPath();
    ctx.roundRect(-11.05, -20, 22.1, 32, 10.2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(0, -35.5, 13.7, 16.6, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
    player.hitFlash--;
  }

  ctx.fillStyle = PLAYER_SKIN;
  ctx.beginPath();
  ctx.roundRect(-11.05, -20, 22.1, 32, 10.2);
  ctx.fill();

  const weaponsInFront = player.facing < 0 && getChopT() > 0;
  if (!player.hasSantaSleigh && !weaponsInFront && !titleHideArms) {
    ctx.save();
    if (player.facing < 0) ctx.scale(-1, 1);
    if (player.weapons.includes('bone_club')) drawClubArm(legSwing);
    if (player.weapons.includes('pink_guitar')) drawGuitarArm(legSwing);
    if (titleBare) drawTitleBareArm(legSwing);
    else drawSporkArm();
    ctx.restore();
  }

  ctx.fillStyle = PLAYER_SKIN;
  ctx.beginPath();
  ctx.ellipse(0, -35.5, 12.55, 15.45, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.ellipse(-5.4, -39, 4.8, 5.5, 0, 0, Math.PI * 2);
  ctx.ellipse(5.4, -39, 4.8, 5.5, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#3b2a20';
  ctx.beginPath();
  ctx.ellipse(-4.2, -38.5, 2.1, 2.4, 0, 0, Math.PI * 2);
  ctx.ellipse(6.6, -38.5, 2.1, 2.4, 0, 0, Math.PI * 2);
  ctx.fill();
  if (!titleActor || titleActor.smiling) {
    ctx.fillStyle = '#f4e7a4';
    ctx.beginPath();
    ctx.moveTo(-6.6, -30.4);
    ctx.lineTo(6.6, -30.4);
    ctx.quadraticCurveTo(0, -16.6, -6.6, -30.4);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#2a1810';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.save();
    ctx.clip();
    ctx.beginPath();
    ctx.moveTo(-6.6, -26.95);
    ctx.lineTo(6.6, -26.95);
    ctx.moveTo(-3.3, -30.4);
    ctx.lineTo(-3.3, -21);
    ctx.moveTo(0, -30.4);
    ctx.lineTo(0, -21);
    ctx.moveTo(3.3, -30.4);
    ctx.lineTo(3.3, -21);
    ctx.stroke();
    ctx.restore();
  }

  if (!player.hasSantaSleigh) {
    const hips = [-7, 7];
    const angles = (titleActor && titleActor.pose === 'squat') ? [1.15, -0.95] : [-legSwing, legSwing];
    ctx.fillStyle = PLAYER_SKIN;
    for (let i = 0; i < 2; i++) {
      ctx.save();
      ctx.translate(hips[i], legHipY);
      ctx.rotate(angles[i]);
      ctx.fillRect(-3, 0, 6, legLen);
      ctx.fillRect(-2, legLen - 3, 8, 4);
      ctx.restore();
    }
  }
  if (!titleHideArms && !player.hasSantaSleigh && player.facing < 0 && getChopT() > 0) {
    ctx.save();
    if (player.facing < 0) ctx.scale(-1, 1);
    if (player.weapons.includes('bone_club')) drawClubArm(legSwing);
    if (player.weapons.includes('pink_guitar')) drawGuitarArm(legSwing);
    if (titleBare) drawTitleBareArm(legSwing);
    else drawSporkArm();
    ctx.restore();
  }
  if (titleActor && titleActor.pose === 'squat') drawTitleSquatArm();
  if (titleActor && titleActor.pose === 'hold') drawTitleHoldArm();
  if (titleActor && titleActor.pose === 'toss') drawTitleToss();
  ctx.restore();

  // ====================== SANTA'S SLEIGH DRAWING ======================
  if (player.hasSantaSleigh) {
    ctx.save();
    ctx.translate(sx + 16, sy + 30);
    if (player.facing < 0) ctx.scale(-1, 1);

    drawSantaSleighBody();
    ctx.restore();

    // Pointing arm (sleigh + space): character arm aims at the secret portal
    if (secretPortal && keys[' ']) {
      const dx = secretPortal.x - player.x;
      const dy = secretPortal.y - player.y;
      const angle = Math.atan2(dy, dx);

      ctx.save();
      ctx.translate(sx + 16, sy + 15);
      ctx.rotate(angle);
      drawStubbyArm(26, 7, false);
      ctx.fillStyle = PLAYER_SKIN;
      ctx.beginPath();
      ctx.roundRect(26, -1.5, 12, 3, 1.5);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(26, 3.2, 3.2, 2.2, 0.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  // Mounted cannons on the sleigh inside ???1. Overworld keeps the slung look.
  if (player.hasSantaSleigh && inSecretDimension) {
    ctx.save();
    ctx.translate(sx + 16, sy + 30);
    if (player.facing < 0) ctx.scale(-1, 1);
    ctx.save();
    ctx.translate(36, 12);
    ctx.scale(0.5, 0.5);
    drawSporkBlade();
    ctx.restore();
    if (player.weapons.includes('pink_guitar')) {
      ctx.save();
      ctx.translate(22, 10);
      ctx.scale(0.72, 0.72);
      drawPinkGuitarBlade();
      ctx.restore();
    } else if (player.weapons.includes('bone_club')) {
      ctx.save();
      ctx.translate(16, -8);
      ctx.scale(0.46, 0.46);
      drawClubBlade();
      ctx.restore();
    }
    if ((player.weapons.includes('stage_mic') || micWeapon.equipped) && micWeapon.state === 'ready') {
      ctx.save();
      ctx.translate(-24, 4);
      ctx.rotate(1.05);
      ctx.fillStyle = '#1c2526';
      ctx.fillRect(-3, 0, 6, 28);
      ctx.fillStyle = '#e6e6e6';
      ctx.beginPath();
      ctx.ellipse(0, -2, 8, 7, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#111';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.restore();
    }
    ctx.restore();
  }

  // ====================== SLUNG WEAPONS ON BACK (while in sleigh) ======================
  if (player.hasSantaSleigh && !inSecretDimension) {
    ctx.save();
    ctx.translate(sx + 16, sy + 30);
    if (player.facing < 0) ctx.scale(-1, 1);

    // Draw slung spork on the back (angled)
    if (player.weapons.includes('spork') || player.weapons.length === 0) {
      // Always show at least the spork on back when in sleigh
      ctx.strokeStyle = SPORK_COLOR;
      ctx.fillStyle = SPORK_COLOR;
      ctx.lineWidth = 5;
      ctx.save();
      ctx.rotate(-0.4); // angled on back
      ctx.beginPath();
      ctx.moveTo(-8, -25);
      ctx.lineTo(-8, 25);
      ctx.stroke();

      // Spork head
      ctx.beginPath();
      ctx.ellipse(-8, 32, 9, 7, 0, -Math.PI*0.85, Math.PI*0.85);
      ctx.fill();
      ctx.restore();
    }

    // Draw other slung weapons (bone club, mic, etc.) further back
    let slungX = -22;
    player.weapons.forEach(w => {
      if (w === 'spork') return; // already drawn above

      ctx.save();
      ctx.translate(slungX, -18);
      ctx.rotate(-0.6);

      if (w === 'bone_club') {
        ctx.fillStyle = '#e5dec9';
        ctx.fillRect(-5, -20, 10, 45);
      } else if (w === 'pink_guitar') {
        ctx.scale(0.32, 0.32);
        drawPinkGuitarBlade();
      } else if (w === 'stage_mic') {
        ctx.fillStyle = '#1c2526';
        ctx.fillRect(-4, -25, 8, 40);
        ctx.fillStyle = '#e6e6e6';
        ctx.beginPath();
        ctx.arc(0, -30, 8, 0, Math.PI*2);
        ctx.fill();
      }
      ctx.restore();

      slungX -= 14;
    });

    ctx.restore();
  }

  // Helmets sit on the raised head
  ctx.save();
  ctx.translate(sx + 16, sy + 23);
  if (player.facing < 0) ctx.scale(-1, 1);
  player.armorHead.forEach(h => {
    if (h === 'possum_helmet') drawPossumHelmet();
    else if (h === 'noid_helmet') drawNoidHelmet();
  });
  ctx.restore();

  // Laser glasses in devSlot1 — layered over face/noid visor, independent of helmet
  if (player.devSlot1.includes('laser_glasses')) {
    ctx.save();
    ctx.translate(sx + 16, sy + 23);
    if (player.facing < 0) ctx.scale(-1, 1);

    drawLaserGlasses(!inSecretDimension);
    ctx.restore();
  }

  // Lederhosen (unchanged)
  if (player.armorLegs.includes('lederhosen')) {
    ctx.save();
    ctx.translate(sx + 16, sy + 30);
    if (player.facing < 0) ctx.scale(-1, 1);

    drawLederhosen();

    ctx.restore();
  }

  // Fly shoes sit on the stubby walking legs
  if (!player.hasSantaSleigh && (player.armorFeet.includes('fly_shoes') || player.armorFeet.includes('spike_shoes'))) {
    ctx.save();
    ctx.translate(sx + 16, sy + 30);
    if (player.facing < 0) ctx.scale(-1, 1);
    const drawShoe = player.armorFeet.includes('spike_shoes') ? drawSpikeShoe : drawFlyShoe;

    const shoeLegs = [
      { hipX: -7, angle: -legSwing },
      { hipX: 7, angle: legSwing }
    ];
    shoeLegs.forEach(s => {
      ctx.save();
      ctx.translate(s.hipX, legHipY);
      ctx.rotate(s.angle);
      drawShoe(legLen);
      ctx.restore();
    });

    ctx.restore();
  }

  if (healing) ctx.shadowBlur = 0;

  // World pickups use the equipped drawing, full size, sitting on the pickup.
