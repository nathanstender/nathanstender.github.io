// ====================== PARALLAX BACKGROUND SYSTEM ======================
function drawParallaxBackground(theme, camY) {
  if (window._drawMuted) return;
  const heightFactor = Math.max(0, Math.min(1, (-camY) / 1200));

  const bg = theme.background || { baseColor: theme.bg || '#1a0f07' };
  const baseColor = bg.baseColor || theme.bg || '#1a0f07';

  // Full clear with the darkest color (ground-level darkness)
  ctx.fillStyle = baseColor;
  ctx.fillRect(0, 0, W, H);

  // Horizon at ~ platform 1.3
  const horizonWorldY = 390;
  const horizonParallax = 0.28;
  const horizonOffset = -camY * horizonParallax;
  const horizonScreenY = horizonWorldY + horizonOffset;

  // Fixed color palette from darkest (near horizon) to lightest (high sky)
  // These colors never change — only their visible spacing does.
  const fixedColors = [
    baseColor,
    adjustBrightness(baseColor, 0.15),
    adjustBrightness(baseColor, 0.30),
    adjustBrightness(baseColor, 0.45),
    adjustBrightness(baseColor, 0.60),
    adjustBrightness(baseColor, 0.74),
    adjustBrightness(baseColor, 0.86),
    adjustBrightness(baseColor, 0.95),
  ];

  const skyTop = 0;

  // Fixed relative thicknesses (bottom band = very thin, each one above gets thicker)
  const relativeThickness = [0.6, 1.1, 1.8, 2.7, 3.9, 5.3, 7.2]; // 7 bands, bottom thinnest
  const totalRelative = relativeThickness.reduce((a, b) => a + b, 0);

  // The total screen height allocated to the band stack.
  // This shrinks as the player goes higher → overall compression toward the horizon.
  // The stack always starts at the horizon and grows upward a controlled amount.
  const maxStack = 480;
  const stackHeight = maxStack * (1 - heightFactor * 0.75); // compresses significantly when high

  const stackTop = Math.max(skyTop, horizonScreenY - stackHeight);

  // Compute actual pixel heights while preserving relative proportions
  const bandHeights = relativeThickness.map(r => (r / totalRelative) * stackHeight);

  // Draw from the horizon upward (bottom band first = thinnest)
  let currentY = horizonScreenY;

  for (let i = 0; i < 7; i++) {
    const h = bandHeights[i];
    const y = currentY - h;

    // Color: darkest at bottom (i=0), lightest at top (i=6)
    const colorIndex = Math.min(i, fixedColors.length - 1);
    ctx.fillStyle = fixedColors[colorIndex];

    ctx.fillRect(0, y, W, h + 1);

    currentY = y;
  }

  // Fill everything above the top band with the lightest color
  // (so there's no black gap when the stack compresses)
  const topOfBands = currentY;
  ctx.fillStyle = fixedColors[fixedColors.length - 1]; // lightest
  ctx.fillRect(0, 0, W, topOfBands);

  // Strong visible horizon line
  if (horizonScreenY > 5 && horizonScreenY < H - 5) {
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(0, horizonScreenY - 6, W, 13);
  }

  // Stars at high altitude
  if (heightFactor > 0.72) {
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    const starCount = Math.floor(12 + heightFactor * 22);
    const starSeed = Math.floor(heightFactor * 17);
    for (let i = 0; i < starCount; i++) {
      const sx = ((i * 53 + starSeed * 31) % (W - 40)) + 20;
      const sy = 25 + ((i * 11) % Math.floor(85 * (heightFactor - 0.6)));
      ctx.fillRect(sx, sy, 1, 1);
      if (i % 4 === 0) ctx.fillRect(sx + 1, sy, 1, 1);
    }
  }

  // ====================== LEVEL 1 SEWER - MUSHROOM HOUSES + BACKGROUND CREEPS ======================
  if (currentLevel <= 3) {
    // === Horizon layer (distant houses, anchored to horizon band) - drawn first ===
    const horizonLayerParallaxX = 0.13;
    const horizonLayerParallaxY = 0.06;

    const horizonTileWidth = 115;
    const hSub = 20;

    const horizonPatterns = [
      [4, 12], [3, 9, 16], [6, 14], [2, 11, 18], [5, 13],
      [3, 8, 15], [7, 17], [4, 10, 19], [2, 12], [5, 9, 16],
      [3, 14], [6, 11, 18], [4, 15], [2, 8, 13], [7, 17],
      [3, 10, 19], [5, 14], [2, 9, 16], [6, 12], [4, 11, 17]
    ];

    const hLeft = (camX * horizonLayerParallaxX) - 150;
    const hRight = (camX * horizonLayerParallaxX) + W + 150;

    const hFirst = Math.floor(hLeft / horizonTileWidth);
    const hLast = Math.ceil(hRight / horizonTileWidth);

    ctx.fillStyle = '#221b12';

    for (let tile = hFirst; tile <= hLast; tile++) {
      const pIdx = Math.abs(Math.floor(hashRand(tile * 23.7 + 9) * horizonPatterns.length));
      const positions = horizonPatterns[pIdx % horizonPatterns.length];

      const tileLeft = tile * horizonTileWidth;

      for (let pos of positions) {
        const wx = tileLeft + (pos / hSub) * horizonTileWidth;

        const rSize = hashRand(wx * 0.063 + tile);
        const rOff = hashRand(wx * 0.027 - tile * 2.1);

        const size = 0.5 + rSize * 0.7;
        const width = 6 + rSize * 5;
        const extraX = (rOff - 0.5) * 10;

        const drawX = wx + extraX - camX * horizonLayerParallaxX;

        // Anchor base to the bottom of the horizon band
        const mushroomCompression = 1 - heightFactor * 0.68;
        const baseMy = horizonScreenY - 3;
        const my = horizonScreenY + (baseMy - horizonScreenY) * mushroomCompression;

        const mx = drawX;

        // Horizon houses - simplified but proper proportions (rect base + equal roof overhang)
        const wallW = 5.8 * width;
        const wallH = 26 * size;
        const overhang = 2.6 * width;
        const roofRise = 20 * size;

        const wallLeft  = mx - wallW * 0.5;
        const wallTop   = my - wallH;

        const roofLeft  = mx - (wallW * 0.5 + overhang);
        const roofRight = mx + (wallW * 0.5 + overhang);
        const roofPeakY = wallTop - roofRise;

        // dark silhouette first for definition at distance
        ctx.fillStyle = '#120c08';
        ctx.fillRect(wallLeft - 1, wallTop - 1, wallW + 2, wallH + 2);
        ctx.beginPath();
        ctx.moveTo(roofLeft - 1.5, wallTop);
        ctx.lineTo(roofRight + 1.5, wallTop);
        ctx.lineTo(mx, roofPeakY - 2);
        ctx.closePath();
        ctx.fill();

        // main house
        ctx.fillStyle = '#221b12';
        ctx.fillRect(wallLeft, wallTop, wallW, wallH);

        ctx.beginPath();
        ctx.moveTo(roofLeft, wallTop);
        ctx.lineTo(roofRight, wallTop);
        ctx.lineTo(mx, roofPeakY);
        ctx.closePath();
        ctx.fill();
      }
    }

    // === Low foreground house band (detailed houses + tiny enemies) ===
    // lowParallaxY = 0.69
    // Slightly less ground-locked. Still reveals more from below as you climb.
    // Same house color. No mid-layer. Horizon layer untouched.
    const lowHouseWorldY = groundY - 110;
    const lowParallaxX = 0.82;
    const lowParallaxY = 0.69;

    const lowTileWidth = 160;
    const lowSub = 20;

    const lowPatterns = [
      [3, 7, 14], [4, 9, 16], [2, 8, 13, 18], [5, 11, 17], [3, 6, 12, 19],
      [4, 10, 15], [2, 7, 14, 18], [5, 9, 13, 17], [3, 8, 16], [4, 11, 19],
      [2, 6, 12, 15], [5, 10, 14, 18], [3, 7, 13, 17], [4, 9, 16, 19], [2, 8, 11, 15]
    ];

    const lLeft = (camX * lowParallaxX) - 120;
    const lRight = (camX * lowParallaxX) + W + 120;

    const firstTile = Math.floor(lLeft / lowTileWidth);
    const lastTile = Math.ceil(lRight / lowTileWidth);

    // Screen position of the low band anchor (with its own faster parallax)
    const lowOffset = -camY * lowParallaxY;
    const lowScreenY = lowHouseWorldY + lowOffset;

    ctx.fillStyle = '#4a2f22';

    for (let tile = firstTile; tile <= lastTile; tile++) {
      const patternIdx = Math.abs(Math.floor(hashRand(tile * 17.3) * lowPatterns.length)) % lowPatterns.length;
      const positions = lowPatterns[patternIdx];

      const tileLeftWorld = tile * lowTileWidth;

      // Collect houses for this tile so we can depth-sort them by base Y
      const housesThisTile = [];
      for (let pos of positions) {
        const wx = tileLeftWorld + (pos / lowSub) * lowTileWidth;

        const rSize = hashRand(wx * 0.071 + tile);
        const rOff = hashRand(wx * 0.039 - tile * 1.7);

        const size = 0.65 + rSize * 0.9;
        const width = 9 + rSize * 7;
        const extraX = (rOff - 0.5) * 12;

        const drawX = wx + extraX - camX * lowParallaxX;

        // Slightly less ground-locked: gentle upward movement as player climbs.
        // Still reveals more from below than upper bands, but not as aggressively.
        const drawY = lowScreenY + (rOff - 0.5) * 20 * (1 - heightFactor * 0.28);

        const mx = drawX;
        const my = drawY;

        housesThisTile.push({ mx, my, size, width, rSize });
      }

      // Sort by base Y so lowest houses (largest my) draw last and appear in front
      housesThisTile.sort((a, b) => a.my - b.my);
      for (let h of housesThisTile) {
        const { mx, my, size, rSize } = h;

        // === Proper house geometry: rectangular walls + centered triangular roof with equal overhang ===
        const wallW = 26 * size;
        const wallH = 42 * size;
        const overhang = 9 * size;     // equal left + right roof overhang
        const roofRise = 32 * size;    // height of the roof triangle

        const wallLeft  = mx - wallW * 0.5;
        const wallTop   = my - wallH;
        const wallRight = wallLeft + wallW;

        const roofLeft  = mx - (wallW * 0.5 + overhang);
        const roofRight = mx + (wallW * 0.5 + overhang);
        const roofPeakY = wallTop - roofRise;

        // === Dark silhouette pass (for edge separation) ===
        ctx.fillStyle = '#1a120c';
        // expanded dark wall silhouette
        ctx.fillRect(wallLeft - 2, wallTop - 2, wallW + 4, wallH + 4);
        // expanded dark roof silhouette (equal overhang preserved)
        ctx.beginPath();
        ctx.moveTo(roofLeft - 2.5, wallTop + 1);
        ctx.lineTo(roofRight + 2.5, wallTop + 1);
        ctx.lineTo(mx, roofPeakY - 3);
        ctx.closePath();
        ctx.fill();

        // === Main walls (rectangle base) ===
        ctx.fillStyle = '#4a2f22';
        ctx.fillRect(wallLeft, wallTop, wallW, wallH);

        // === Main roof (triangle with equal overhang on both sides) ===
        ctx.beginPath();
        ctx.moveTo(roofLeft, wallTop);
        ctx.lineTo(roofRight, wallTop);
        ctx.lineTo(mx, roofPeakY);
        ctx.closePath();
        ctx.fill();

        // House details positioned for rectangular walls + roof
        // Door - centered on the wall, near the bottom
        const doorW = wallW * 0.28;
        const doorH = wallH * 0.42;
        const doorX = mx - doorW * 0.5;
        const doorY = my - doorH;
        ctx.fillStyle = '#2a1a12';
        ctx.fillRect(doorX, doorY, doorW, doorH);
        // doorknob
        ctx.fillStyle = '#1f120c';
        ctx.fillRect(doorX + doorW * 0.72, doorY + doorH * 0.55, 2.2 * size, 2.2 * size);

        // Two small windows above the door
        ctx.fillStyle = '#3a2a1f';
        const winW = wallW * 0.18;
        const winH = wallH * 0.16;
        const winY = wallTop + wallH * 0.28;
        ctx.fillRect(mx - wallW * 0.28 - winW * 0.5, winY, winW, winH);
        if (rSize > 0.28) {
          ctx.fillRect(mx + wallW * 0.28 - winW * 0.5, winY, winW, winH);
        }

        // Roof eave / trim line just under the roof base
        ctx.fillStyle = '#5a3f32';
        ctx.fillRect(roofLeft + 1, wallTop - 1, (roofRight - roofLeft) - 2, 3 * size);

        // Crisp dark outlines for definition
        ctx.strokeStyle = '#120c08';
        ctx.lineWidth = 1.7;
        ctx.strokeRect(wallLeft, wallTop, wallW, wallH);

        // roof outline stroke
        ctx.beginPath();
        ctx.moveTo(roofLeft, wallTop);
        ctx.lineTo(roofRight, wallTop);
        ctx.lineTo(mx, roofPeakY);
        ctx.closePath();
        ctx.stroke();
      }

      // === Background enemies on the same low band (4x larger) ===
      // 1-3 per tile max, darkish red glowing eyes
      const bgEnemyCount = 1 + Math.floor(hashRand(tile * 91.7 + 13) * 2.6);
      for (let e = 0; e < bgEnemyCount; e++) {
        const pick = Math.floor(hashRand(tile * 13.37 + e * 9.1) * positions.length);
        const ePos = positions[pick];
        const ewx = tileLeftWorld + (ePos / lowSub) * lowTileWidth;

        const erSize = hashRand(ewx * 0.071 + tile + 40);
        const erOff = hashRand(ewx * 0.039 - tile * 1.7 + 20);

        const eSize = 0.65 + erSize * 0.9;
        const eWidth = 9 + erSize * 7;
        const eExtra = (erOff - 0.5) * 12;

        const eDrawX = ewx + eExtra - camX * lowParallaxX;

        // Same mild compression as the houses
        const eDrawY = lowScreenY + (erOff - 0.5) * 18 * (1 - heightFactor * 0.28);

        const emx = eDrawX;
        const emy = eDrawY;
        const estemW = 7 * eWidth;

        const eSide = (hashRand(ewx * 2.3 + e) - 0.5) * 1.25;
        const ex = emx + eSide * estemW * 0.52;
        const ey = emy + 155 * eSize;   // raised to accommodate 4x larger enemies

        ctx.fillStyle = '#25180f';
        const tw = 16.8 + (hashRand(ewx + e * 3) * 7.2);
        const th = 23.2 + (hashRand(ewx - e) * 8.8);
        ctx.fillRect(ex - tw * 0.5, ey - th, tw, th);

        ctx.shadowBlur = 3.5;
        ctx.shadowColor = '#aa3333';
        ctx.fillStyle = '#9c2a2a';
        const eyeY = ey - th * 0.80;   // moved eyes higher so they sit on the "head" area
        ctx.fillRect(ex - 8.4, eyeY, 6, 5.4);
        ctx.fillRect(ex + 2.6, eyeY, 6, 5.4);
        ctx.shadowBlur = 0;
      }
    }
  } else if (currentLevel >= 4 && currentLevel <= 7) {
    // ====================== LEVELS 4-7 ANCIENT RUINS ======================
    // 3 bands like 1-3:
    // 1. Distant horizon ruins (slow)
    // 2. Mid ruins band (extra layer)
    // 3. Lowest band: same 0.69 ground-revealing behavior as sewer houses

    // --- 1. Distant horizon ruins ---
    const dParX = 0.12;
    const dParY = 0.05;
    const dTile = 130;
    const dLeft = (camX * dParX) - 180;
    const dRight = (camX * dParX) + W + 180;
    const dFirst = Math.floor(dLeft / dTile);
    const dLast = Math.ceil(dRight / dTile);

    for (let tile = dFirst; tile <= dLast; tile++) {
      const positions = [3, 8, 14, 19];
      const tLeft = tile * dTile;
      for (let pos of positions) {
        if (hashRand(tile * 7.3 + pos) > 0.65) continue;
        const wx = tLeft + (pos / 20) * dTile;
        const rS = hashRand(wx * 0.05 + tile);
        const ex = (hashRand(wx * 0.03 - tile) - 0.5) * 8;
        const dx = wx + ex - camX * dParX;
        const my = horizonScreenY + (hashRand(tile * 9 + pos) - 0.5) * 8;
        const ww = 18 + rS * 14;
        const hh = 22 + rS * 18;
        ctx.fillStyle = '#1f1a16';
        ctx.fillRect(dx - ww * 0.5 - 2, my - hh, ww + 4, hh + 4);
        ctx.fillStyle = '#2a2520';
        ctx.fillRect(dx - ww * 0.5, my - hh, ww, hh);
      }
    }

    // --- 2. Mid ruins band (new extra layer) ---
    // Using 0.35 vertical as requested — strong downward reveal, even more aggressive than the 0.69 lowest band.
    const mParX = 0.45;
    const mParY = 0.35;
    const mTile = 140;
    const mLeft = (camX * mParX) - 130;
    const mRight = (camX * mParX) + W + 130;
    const mFirst = Math.floor(mLeft / mTile);
    const mLast = Math.ceil(mRight / mTile);

    const mOffset = -camY * mParY;
    const mScreenY = (groundY - 160) + mOffset;

    for (let tile = mFirst; tile <= mLast; tile++) {
      const positions = [4, 11, 17];
      const tLeft = tile * mTile;
      for (let pos of positions) {
        const wx = tLeft + (pos / 20) * mTile;
        const rS = hashRand(wx * 0.06 + tile);
        const ex = (hashRand(wx * 0.04 - tile) - 0.5) * 10;
        const dx = wx + ex - camX * mParX;

        // Aggressive downward reveal — drops more than the 0.69 lowest band as player ascends
        const dy = mScreenY + (hashRand(wx * 0.7) - 0.5) * 18 * (1 - heightFactor * 0.12);

        const ww = 14 + rS * 10;
        const hh = 28 + rS * 8;
        ctx.fillStyle = '#2f2a25';
        ctx.fillRect(dx - ww * 0.5, dy - hh, ww, hh);
        ctx.fillStyle = '#24201c';
        ctx.fillRect(dx - ww * 0.5 - 2, dy - hh + 3, 4, hh - 6);
      }
    }

    // --- 3. Lowest band (0.69 ground-locked behavior, same as sewer houses) ---
    const lowParX = 0.78;
    const lowParY = 0.69;   // same as the good 0.69 value from levels 1-3

    const lowTile = 155;
    const lowSub = 20;

    const lowPatterns = [
      [4, 13], [2, 9, 17], [7, 15], [3, 11, 18],
      [5, 14], [2, 8, 16], [6, 12, 19], [3, 10, 17],
      [4, 13, 18], [2, 9], [7, 15, 19], [5, 11, 16]
    ];

    const lLeft = (camX * lowParX) - 140;
    const lRight = (camX * lowParX) + W + 140;
    const lFirst = Math.floor(lLeft / lowTile);
    const lLast = Math.ceil(lRight / lowTile);

    const lowOffset = -camY * lowParY;
    const lowScreenY = (groundY - 95) + lowOffset;

    const lowPieces = [];

    for (let tile = lFirst; tile <= lLast; tile++) {
      const pIdx = Math.abs(Math.floor(hashRand(tile * 19.4) * lowPatterns.length)) % lowPatterns.length;
      const positions = lowPatterns[pIdx];
      const tLeft = tile * lowTile;

      for (let pos of positions) {
        const wx = tLeft + (pos / lowSub) * lowTile;
        const rS = hashRand(wx * 0.066 + tile * 1.3);
        const rOff = hashRand(wx * 0.041 - tile * 2.2);
        const sz = 0.7 + rS * 0.85;
        const ex = (rOff - 0.5) * 14;
        const dx = wx + ex - camX * lowParX;

        // Same 0.69-style ground-revealing formula as the sewer houses
        const drawY = lowScreenY + (rOff - 0.5) * 20 * (1 - heightFactor * 0.28);

        lowPieces.push({ x: dx, y: drawY, size: sz, rSize: rS });
      }
    }

    lowPieces.sort((a, b) => a.y - b.y);

    for (let p of lowPieces) {
      const { x, y, size, rSize } = p;
      const w = 22 * size + rSize * 12;
      const h = 38 * size + rSize * 10;

      ctx.fillStyle = '#3a3632';
      ctx.fillRect(x - w * 0.5, y - h, w, h);
      ctx.fillStyle = '#2a2622';
      ctx.fillRect(x - w * 0.5 - 3, y - h + 4, 6, h - 8);
      ctx.fillStyle = '#4a463f';
      ctx.fillRect(x - w * 0.48, y - h, w * 0.96, 3);

      ctx.strokeStyle = '#1f1a16';
      ctx.lineWidth = 1.2;
      if (rSize > 0.35) {
        ctx.beginPath(); ctx.moveTo(x - w * 0.2, y - h * 0.3); ctx.lineTo(x + w * 0.15, y - h * 0.85); ctx.stroke();
      }
      if (rSize > 0.6) {
        ctx.beginPath(); ctx.moveTo(x + w * 0.1, y - h * 0.15); ctx.lineTo(x - w * 0.25, y - h * 0.6); ctx.stroke();
      }

      if (rSize > 0.42) {
        ctx.strokeStyle = '#5a554d';
        ctx.lineWidth = 1.1;
        const hx = x - w * 0.28;
        const hy = y - h * 0.55;
        const gSeed = Math.floor(rSize * 100 + x * 0.03);

        if (gSeed % 5 === 0) {
          for (let i = 0; i < 3; i++) {
            ctx.beginPath(); ctx.moveTo(hx + i * 5, hy); ctx.lineTo(hx + i * 5, hy + 11); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(hx + i * 5 - 1.5, hy + 4); ctx.lineTo(hx + i * 5 + 1.5, hy + 4); ctx.stroke();
          }
        } else if (gSeed % 4 === 0) {
          ctx.beginPath(); ctx.ellipse(hx + 6, hy + 5, 5, 3, 0, 0, Math.PI * 2); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(hx + 6, hy + 2); ctx.lineTo(hx + 6, hy + 8); ctx.stroke();
        } else if (gSeed % 3 === 0) {
          for (let i = 0; i < 2; i++) {
            ctx.beginPath(); ctx.moveTo(hx + 2, hy + i * 6); ctx.lineTo(hx + 9, hy + 3 + i * 6); ctx.lineTo(hx + 2, hy + 6 + i * 6); ctx.stroke();
          }
        } else {
          ctx.fillStyle = '#4a463f';
          ctx.fillRect(hx + 1, hy + 2, 3, 3);
          ctx.fillRect(hx + 7, hy + 5, 4, 2);
          ctx.fillRect(hx + 3, hy + 9, 2, 4);
        }
      }
    }
  } else if (currentLevel >= 8 && currentLevel <= 10) {
    // ====================== LEVELS 8-10 (placeholder with same band structure + 0.69) ======================
    // Same 3-band layout and 0.69 lowest-band behavior as 4-7.
    // Visuals can be filled in later.

    // Distant
    const dParX = 0.12, dParY = 0.05, dTile = 130;
    const dL = (camX * dParX) - 180, dR = (camX * dParX) + W + 180;
    for (let t = Math.floor(dL / dTile); t <= Math.ceil(dR / dTile); t++) {
      for (let p of [3, 8, 14, 19]) {
        if (hashRand(t * 7.3 + p) > 0.7) continue;
        const wx = t * dTile + (p / 20) * dTile;
        const dx = wx - camX * dParX;
        const my = horizonScreenY + (hashRand(t * 9 + p) - 0.5) * 6;
        ctx.fillStyle = '#2a2f38';
        ctx.fillRect(dx - 12, my - 18, 24, 20);
      }
    }

    // Mid band — using 0.35 vertical for strong downward reveal (more aggressive than 0.69 lowest)
    const mParY = 0.35;
    const mOff = -camY * mParY;
    const mSy = (groundY - 160) + mOff;
    for (let t = -2; t <= 8; t++) {
      const dx = (t * 160) - camX * 0.42;
      const dy = mSy + (hashRand(t * 13) - 0.5) * 16 * (1 - heightFactor * 0.12);
      ctx.fillStyle = '#353d47';
      ctx.fillRect(dx - 10, dy - 22, 20, 25);
    }

    // Lowest band - 0.69 behavior
    const lowParY = 0.69;
    const lOff = -camY * lowParY;
    const lSy = (groundY - 95) + lOff;
    for (let t = -1; t <= 7; t++) {
      const dx = (t * 155) - camX * 0.75;
      const rOff = hashRand(t * 11.3);
      const dy = lSy + (rOff - 0.5) * 20 * (1 - heightFactor * 0.28);
      ctx.fillStyle = '#2f343d';
      ctx.fillRect(dx - 14, dy - 30, 28, 34);
    }
  }
  if (difficulty === 'endless') drawEndlessSkyWash(camY);
}

// Simple helper to brighten a hex color
function adjustBrightness(hex, factor) {
  const r = parseInt(hex.slice(1,3), 16);
  const g = parseInt(hex.slice(3,5), 16);
  const b = parseInt(hex.slice(5,7), 16);

  const nr = Math.min(255, Math.floor(r + (255 - r) * factor));
  const ng = Math.min(255, Math.floor(g + (255 - g) * factor));
  const nb = Math.min(255, Math.floor(b + (255 - b) * factor));

  return `rgb(${nr},${ng},${nb})`;
}

// Much better deterministic random for organic placement
function hashRand(x) {
  let n = Math.sin(x) * 43758.5453123;
  return n - Math.floor(n);
}

// Continuous sampler over the fixed color array (for perfectly smooth motion)
function sampleGradientColor(colors, t) {
  const n = colors.length - 1;
  const idx = Math.max(0, Math.min(n - 0.0001, t * n));
  const lower = Math.floor(idx);
  const frac = idx - lower;
  const c1 = colors[lower];
  const c2 = colors[lower + 1];

  const r1 = parseInt(c1.slice(1,3),16), g1 = parseInt(c1.slice(3,5),16), b1 = parseInt(c1.slice(5,7),16);
  const r2 = parseInt(c2.slice(1,3),16), g2 = parseInt(c2.slice(3,5),16), b2 = parseInt(c2.slice(5,7),16);

  const r = Math.round(r1 + (r2 - r1) * frac);
  const g = Math.round(g1 + (g2 - g1) * frac);
  const b = Math.round(b1 + (b2 - b1) * frac);
  return `rgb(${r},${g},${b})`;
}

// ====================== MAIN LOOP ======================
// One sim step is 1/60 second. Extra refresh-rate frames do not add steps.
// A slow PC runs several steps before it draws, so movement stays on the clock.
const SIM_STEP = 1;
const MAX_SIM_STEPS = 8;
const CANVAS_DRAW_METHODS = ['fillRect', 'strokeRect', 'clearRect', 'fillText', 'strokeText', 'fill', 'stroke', 'drawImage'];

function setCanvasDrawMuted(muted) {
  if (muted === window._drawMuted) return;
  if (muted) {
    window._drawBak = {};
    for (const m of CANVAS_DRAW_METHODS) {
      window._drawBak[m] = ctx[m].bind(ctx);
      ctx[m] = function () {};
    }
    window._drawMuted = true;
  } else if (window._drawBak) {
    for (const m of CANVAS_DRAW_METHODS) ctx[m] = window._drawBak[m];
    window._drawBak = null;
    window._drawMuted = false;
  }
}

function loop() {
  const now = (typeof performance !== 'undefined' ? performance.now() : Date.now());
  let elapsed;
  if (window._lastFrameTime == null) {
    elapsed = SIM_STEP;
  } else {
    elapsed = (now - window._lastFrameTime) / 16.6667;
  }
  window._lastFrameTime = now;
  if (!isFinite(elapsed) || elapsed <= 0) elapsed = SIM_STEP;
  // A hidden tab reports a long gap. A slow frame does not. Do not replay a pause.
  if (elapsed > 45) elapsed = SIM_STEP;

  window._accum = (window._accum || 0) + elapsed;
  let steps = Math.floor(window._accum);
  if (steps > MAX_SIM_STEPS) {
    steps = MAX_SIM_STEPS;
    window._accum = 0;
  } else {
    window._accum -= steps;
  }

  if (steps < 1) {
    requestAnimationFrame(loop);
    return;
  }

  for (let step = 0; step < steps; step++) {
    window._dt = SIM_STEP;
    const skipDraw = step !== steps - 1;
    setCanvasDrawMuted(skipDraw);
    try {
      gameFrame();
    } finally {
      if (skipDraw) setCanvasDrawMuted(false);
    }
  }
  requestAnimationFrame(loop);
}

// ???1 tunnel. One corridor, no dead ends. The player moves only while an arrow is held.
const LIFE_T = 420;
const LIFE_GAP = 360;
const LIFE_SPEED = 7.2;
const LIFE_SHIP_OX = -18;
const LIFE_SHIP_OY = 18;
const LIFE_SHIP_W = 70;
const LIFE_SHIP_H = 42;

function buildLifeForceLanes() {
  const T = LIFE_T;
  const lanes = [];
  let x = 0;
  let y = 0;
  const right = (len) => { lanes.push({ x: x, y: y, w: len, h: T, dir: 'right' }); x += len - T; };
  const left = (len) => { x -= len - T; lanes.push({ x: x, y: y, w: len, h: T, dir: 'left' }); };
  const up = (len) => { y -= len - T; lanes.push({ x: x, y: y, w: T, h: len, dir: 'up' }); };
  const down = (len) => { lanes.push({ x: x, y: y, w: T, h: len, dir: 'down' }); y += len - T; };
  right(8400);
  up(3800);
  left(7600);
  up(3600);
  right(9800);
  down((T + LIFE_GAP) - y + T);
  left(8000);
  down(3200);
  right(5200);
  lanes.push({ x: x, y: y, w: 1900, h: 980, dir: 'room', boss: true });
  return lanes;
}

function lifePointInLanes(px, py, lanes) {
  for (let i = 0; i < lanes.length; i++) {
    const L = lanes[i];
    if (px >= L.x && px <= L.x + L.w && py >= L.y && py <= L.y + L.h) return true;
  }
  return false;
}

function lifePointInFlyLanes(px, py, lanes) {
  for (let i = 0; i < lanes.length; i++) {
    const L = lanes[i];
    if (L.dig) continue;
    if (px >= L.x && px <= L.x + L.w && py >= L.y && py <= L.y + L.h) return true;
  }
  return false;
}

function lifeShipInside(px, py, lanes) {
  const x = px + LIFE_SHIP_OX;
  const y = py + LIFE_SHIP_OY;
  return lifePointInFlyLanes(x, y, lanes)
    && lifePointInFlyLanes(x + LIFE_SHIP_W, y, lanes)
    && lifePointInFlyLanes(x, y + LIFE_SHIP_H, lanes)
    && lifePointInFlyLanes(x + LIFE_SHIP_W, y + LIFE_SHIP_H, lanes);
}

function lifePointInShip(px, py) {
  const x = player.x + LIFE_SHIP_OX;
  const y = player.y + LIFE_SHIP_OY;
  return px >= x && px <= x + LIFE_SHIP_W && py >= y && py <= y + LIFE_SHIP_H;
}

function lifeShotHitsPlayer(px, py) {
  if (player.hasSantaSleigh) return lifePointInShip(px, py);
  return px >= player.x && px <= player.x + player.w && py >= player.y && py <= player.y + player.h;
}

function lifeBodyHitsFoe(foe) {
  let x = player.x;
  let y = player.y;
  let w = player.w;
  let h = player.h;
  if (player.hasSantaSleigh) {
    x += LIFE_SHIP_OX;
    y += LIFE_SHIP_OY;
    w = LIFE_SHIP_W;
    h = LIFE_SHIP_H;
  }
  return x < foe.x + foe.w && x + w > foe.x && y < foe.y + foe.h && y + h > foe.y;
}

function lifePlayerInRect(r) {
  const cx = player.x + 16;
  const cy = player.y + 30;
  return cx >= r.x && cx <= r.x + r.w && cy >= r.y && cy <= r.y + r.h;
}

function lifeClearLine(x0, y0, x1, y1, lanes) {
  const dist = Math.hypot(x1 - x0, y1 - y0);
  const steps = Math.max(1, Math.ceil(dist / 32));
  for (let i = 0; i <= steps; i++) {
    const t = i / steps;
    if (!lifePointInLanes(x0 + (x1 - x0) * t, y0 + (y1 - y0) * t, lanes)) return false;
  }
  return true;
}

function lifeAwake(foe) {
  const dx = (foe.x + foe.w / 2) - (player.x + 16);
  const dy = (foe.y + foe.h / 2) - (player.y + 30);
  return dx * dx + dy * dy < 980 * 980;
}

function lifeNearestTarget(lf, fromX, fromY) {
  let best = null;
  let bestD = 1600 * 1600;
  for (let i = 0; i < lf.foes.length; i++) {
    const foe = lf.foes[i];
    const dx = (foe.x + foe.w / 2) - fromX;
    const dy = (foe.y + foe.h / 2) - fromY;
    const d2 = dx * dx + dy * dy;
    if (d2 < bestD && lifeClearLine(fromX, fromY, foe.x + foe.w / 2, foe.y + foe.h / 2, lf.lanes)) {
      bestD = d2;
      best = foe;
    }
  }
  const b = lf.boss;
  if (b.alive) {
    const dx = (b.x + b.w / 2) - fromX;
    const dy = (b.y + b.h / 2) - fromY;
    const d2 = dx * dx + dy * dy;
    if (d2 < bestD && lifeClearLine(fromX, fromY, b.x + b.w / 2, b.y + b.h / 2, lf.lanes)) best = b;
  }
  return best;
}

function lifeForceStopped() {
  return gameIsOver || isReviving;
}

function lifeHurt(raw) {
  const lf = lifeForce;
  if (!lf || gameIsOver || isReviving || lf.hurtCool > 0 || lf.winTimer > 0) return;
  const resistFactor = Math.min(100, player.resistance) / 100;
  const dmg = Math.max(1, Math.floor(raw * (1 - resistFactor)));
  player.hp -= dmg;
  player.hitFlash = 12;
  lf.hurtCool = 22;
  floatingText(player.x + 16, player.y - 10, '-' + dmg, '#f44');
  document.getElementById('hp').textContent = Math.floor(player.hp);
  if (player.hp <= 0) gameOver(false);
}

function buildLifeDecor(lanes) {
  const deco = [];
  for (let i = 0; i < lanes.length; i++) {
    const L = lanes[i];
    let n = Math.floor((L.w * L.h) / 140000);
    if (n > 22) n = 22;
    let s = (i + 3) * 9973;
    for (let k = 0; k < n; k++) {
      s = (s * 1103515245 + 12345) & 0x7fffffff;
      const rx = L.x + 20 + (s % Math.max(1, L.w - 48));
      s = (s * 1103515245 + 12345) & 0x7fffffff;
      const ry = L.y + 20 + (s % Math.max(1, L.h - 48));
      deco.push({ x: rx, y: ry, w: 8 + (s % 16), h: 5 + ((s >> 3) % 9), c: (k % 2) ? '#5e676e' : '#6e787f' });
    }
  }
  return deco;
}

function sprinkleLifeFoes(lanes, pickups) {
  const foes = [];
  const T = LIFE_T;
  let traveled = 0;
  let nextAt = 400;
  const step = 420;
  let k = 0;
  for (let i = 0; i < lanes.length; i++) {
    const L = lanes[i];
    if (L.boss) continue;
    const span = (L.dir === 'left' || L.dir === 'right') ? L.w : L.h;
    const usable = span - T;
    while (nextAt <= traveled + usable) {
      const along = nextAt - traveled;
      let cx;
      let cy;
      if (L.dir === 'right') { cx = L.x + along; cy = L.y + L.h / 2; }
      else if (L.dir === 'left') { cx = L.x + L.w - along; cy = L.y + L.h / 2; }
      else if (L.dir === 'up') { cx = L.x + L.w / 2; cy = L.y + L.h - along; }
      else { cx = L.x + L.w / 2; cy = L.y + along; }
      let near = false;
      for (let p = 0; p < pickups.length; p++) {
        if (Math.hypot(cx - pickups[p].x, cy - pickups[p].y) < 260) near = true;
      }
      if (!near) {
        const kind = k % 2;
        const w = 44;
        const h = 36;
        foes.push({
          x: cx - w / 2, y: cy - h / 2, w: w, h: h,
          hp: kind ? 58 : 36, kind: kind, lane: i,
          drift: (k % 2 === 0) ? 1.35 : -1.35,
          cool: (24 + ((k * 17) % 40)) * 2
        });
        k++;
      }
      nextAt += step;
    }
    traveled += usable;
  }
  return foes;
}

function lifeLanePoint(L, along) {
  if (L.dir === 'right') return { x: L.x + along, y: L.y + L.h / 2 };
  if (L.dir === 'left') return { x: L.x + L.w - along, y: L.y + L.h / 2 };
  if (L.dir === 'up') return { x: L.x + L.w / 2, y: L.y + L.h - along };
  return { x: L.x + L.w / 2, y: L.y + along };
}

function lifeDropGear(lf, id, x, y) {
  const dir = player.facing < 0 ? -1 : 1;
  let dx = x - dir * 120;
  let dy = y;
  if (!lifePointInLanes(dx, dy, lf.lanes)) dx = x + dir * 140;
  if (!lifePointInLanes(dx, dy, lf.lanes)) { dx = x; dy = y; }
  lf.gear.push({ id: id, x: dx, y: dy, w: 28, h: 22, cool: 30 });
}

function lifeTakeGear(lf, it) {
  const db = itemDB[it.id];
  if (!db) return false;
  if (db.category === 'weapon') {
    if (player.weapons.includes(it.id)) return false;
    if (it.id === 'pink_guitar' || it.id === 'bone_club') {
      const other = it.id === 'pink_guitar' ? 'bone_club' : 'pink_guitar';
      const otherIdx = player.weapons.indexOf(other);
      if (otherIdx !== -1) {
        player.weapons.splice(otherIdx, 1);
        lifeDropGear(lf, other, player.x + 16, player.y + 30);
      }
    }
    player.weapons.push(it.id);
    if (it.id === 'stage_mic') micWeapon.equipped = true;
  } else if (db.category === 'armor_head') {
    if (player.armorHead.includes(it.id)) return false;
    player.armorHead.push(it.id);
  } else if (it.id === 'lederhosen') {
    if (player.armorLegs.includes('lederhosen')) return false;
    if (player.armorLegs.length > 0) {
      const old = player.armorLegs.pop();
      lifeDropGear(lf, old, player.x + 16, player.y + 30);
    }
    player.armorLegs.push('lederhosen');
  } else if (it.id === 'fly_shoes' || it.id === 'spike_shoes') {
    if (player.armorFeet.includes(it.id)) return false;
    if (player.armorFeet.length > 0) {
      const oldFeet = player.armorFeet.pop();
      lifeDropGear(lf, oldFeet, player.x + 16, player.y + 30);
    }
    player.armorFeet.push(it.id);
  } else if (it.id === 'laser_glasses' || db.category === 'dev_slot') {
    if (player.devSlot1.includes(it.id)) return false;
    if (player.devSlot1.length > 0) {
      const oldDev = player.devSlot1.pop();
      lifeDropGear(lf, oldDev, player.x + 16, player.y + 30);
    }
    player.devSlot1.push(it.id);
  } else return false;
  updateResistance();
  updateHUD();
  floatingText(it.x, it.y - 28, LIFE_GEAR_NAMES[it.id] || 'GOT IT', '#f4e7a4');
  return true;
}

function lifeRestoreSleighGear() {
  if (player.sleighStash && !player.sleighStash.restored) {
    player.weapons = player.sleighStash.weapons.slice();
    player.armorLegs = player.sleighStash.armorLegs.slice();

}

function lifePushForwardShot(lf, kind, speed, dmg, life) {

function lifeSpreadWater(x, y, ang, spd, main, dmg) {

function lifeWaterArc(x, y, tx, ty, dmg) {
  const dx = tx - x;
  const dy = ty - y;
  const dist = Math.hypot(dx, dy) || 1;
  const T = Math.max(14, Math.min(40, dist / 9));
  const g = 0.24;
  return {
    x: x, y: y, vx: dx / T, vy: dy / T - 0.5 * g * T, grav: g,
    kind: 'water', dmg: dmg, life: Math.ceil(T) + 14, trail: [], r: dmg > 0 ? 8 : 5
  };
}

function lifeCircleHitsRect(cx, cy, r, rect) {
  const nx = Math.max(rect.x, Math.min(cx, rect.x + rect.w));
  const ny = Math.max(rect.y, Math.min(cy, rect.y + rect.h));
  const dx = cx - nx;
  const dy = cy - ny;
  return dx * dx + dy * dy <= r * r;
}

function lifeDamageFoe(lf, index, dmg) {

function lifeLaserSpan(lf) {

  let end = x;

    const px = x + dir * d;

function updateLifeMic(lf) {
  const hasMic = micWeapon.equipped || player.weapons.includes('stage_mic');
  if (!hasMic) return;
  micWeapon.equipped = true;
  const handX = player.x + 16;
  const handY = player.y + 28;
  const cord = 560;
  if (micWeapon.state === 'ready') {
    if (!(keys[' '])) return;
    const target = lifeNearestTarget(lf, handX, handY);
    let dx = player.facing >= 0 ? 1 : -1;
    let dy = 0;
    let d = 1;
    if (target) {
      const tx = (target.x + target.w / 2) - handX;
      const ty = (target.y + target.h / 2) - handY;
      const td = Math.hypot(tx, ty) || 1;
      if (td <= 820) { dx = tx; dy = ty; d = td; }
    }
    micWeapon.state = 'thrown';
    micWeapon.x = handX + (dx / d) * 18;
    micWeapon.y = handY + (dy / d) * 18;
    micWeapon.vx = (dx / d) * 13;
    micWeapon.vy = (dy / d) * 13;
    micWeapon.hitCooldown = 0;
    return;
  }
  if (micWeapon.state === 'thrown') {
    const target = lifeNearestTarget(lf, micWeapon.x, micWeapon.y);
    if (target) {
      const dx = (target.x + target.w / 2) - micWeapon.x;
      const dy = (target.y + target.h / 2) - micWeapon.y;
      const d = Math.hypot(dx, dy) || 1;
      micWeapon.vx = micWeapon.vx * 0.8 + (dx / d) * 13 * 0.2;
      micWeapon.vy = micWeapon.vy * 0.8 + (dy / d) * 13 * 0.2;
    }
    micWeapon.x += micWeapon.vx;
    micWeapon.y += micWeapon.vy;
    if (Math.hypot(micWeapon.x - handX, micWeapon.y - handY) > cord) micWeapon.state = 'returning';
    if (micWeapon.hitCooldown <= 0) {
      let hit = false;
      for (let f = lf.foes.length - 1; f >= 0; f--) {
        const foe = lf.foes[f];
        if (micWeapon.x > foe.x && micWeapon.x < foe.x + foe.w && micWeapon.y > foe.y && micWeapon.y < foe.y + foe.h) {
          lifeDamageFoe(lf, f, itemDB.stage_mic.damage);
          blood(micWeapon.x, micWeapon.y);
          hit = true;
          break;
        }
      }
      const b = lf.boss;
      if (!hit && b.alive && micWeapon.x > b.x && micWeapon.x < b.x + b.w && micWeapon.y > b.y && micWeapon.y < b.y + b.h) {
        b.hp -= itemDB.stage_mic.damage;

}

function lifePointInPits(px, py) {
  const goo = lifeForce && lifeForce.goo;
  if (!goo) return false;
  for (let i = 0; i < goo.length; i++) {
    const g = goo[i];
    if (px >= g.x && px <= g.x + g.w && py >= g.y && py <= g.y + g.depth) return true;
  }
  return false;
}

function lifeBodyIn(x, y, lanes) {
  const m = 3;
  const topL = lifePointInLanes(x + m, y + 2, lanes);
  const topR = lifePointInLanes(x + player.w - m, y + 2, lanes);
  if (!topL || !topR) return false;
  const blx = x + m;
  const brx = x + player.w - m;
  const by = y + player.h - 2;
  const leftOk = lifePointInLanes(blx, by, lanes) || lifePointInPits(blx, by);
  const rightOk = lifePointInLanes(brx, by, lanes) || lifePointInPits(brx, by);
  if (leftOk && rightOk) return true;
  return false;
}

function lifeBesideWall(x, y, lanes) {
  const midY = y + player.h * 0.45;
  if (!lifePointInLanes(x + player.w / 2, midY, lanes)) return false;
  return !lifePointInLanes(x - 4, midY, lanes) || !lifePointInLanes(x + player.w + 4, midY, lanes);
}

function lifeUnstick(lanes) {
  if (lifeBodyIn(player.x, player.y, lanes)) return;
  for (let d = 1; d < 90; d++) {
    if (lifeBodyIn(player.x, player.y + d, lanes)) { player.y += d; return; }
    if (lifeBodyIn(player.x, player.y - d, lanes)) { player.y -= d; return; }
    if (lifeBodyIn(player.x + d, player.y, lanes)) { player.x += d; return; }
    if (lifeBodyIn(player.x - d, player.y, lanes)) { player.x -= d; return; }
  }
}

function buildLifeLadders(lanes) {
  const ladders = [];
  for (let i = 0; i < lanes.length; i++) {
    const L = lanes[i];
    if (L.dig || L.dirt) continue;
    if (L.dir !== 'up' && L.dir !== 'down') continue;
    const top = L.y + 12;
    const midX = L.x + L.w / 2;
    let side = 'left';
    for (let h = 0; h < lanes.length; h++) {
      const H = lanes[h];
      if (H.dir === 'up' || H.dir === 'down') continue;
      const overlapsY = H.y < top + 24 && H.y + H.h > top;
      const overlapsX = H.x < L.x + L.w - 8 && H.x + H.w > L.x + 8;
      if (!overlapsY || !overlapsX) continue;
      const leftReach = midX - H.x;
      const rightReach = (H.x + H.w) - midX;
      side = rightReach > leftReach ? 'right' : 'left';
    }
    const railX = side === 'left' ? L.x + 12 : L.x + L.w - 30;
    ladders.push({ x: railX, y: L.y + 10, w: 18, h: L.h - 20, side: side });
  }
  return ladders;
}

function buildLifeDig(lanes) {
  const parts = [];
  let total = 0;
  for (let i = 0; i < lanes.length; i++) {
    const L = lanes[i];
    if (L.boss || L.dig) continue;
    const span = (L.dir === 'left' || L.dir === 'right') ? L.w : L.h;
    const add = i === 0 ? span : Math.max(40, span - LIFE_T);
    parts.push({ i: i, at: total, add: add });
    total += add;
  }
  const mid = total * 0.5;
  let part = parts[parts.length - 1];
  for (let i = 0; i < parts.length; i++) {
    if (parts[i].at + parts[i].add >= mid) { part = parts[i]; break; }
  }
  let laneI = part.i;
  let into = mid - part.at;
  let L = lanes[laneI];
  if (L.dir !== 'left' && L.dir !== 'right') {
    let horiz = -1;
    for (let j = laneI + 1; j < lanes.length; j++) {
      if (lanes[j].dir === 'left' || lanes[j].dir === 'right') { horiz = j; break; }
    }
    if (horiz < 0) {
      for (let j = laneI - 1; j >= 0; j--) {
        if (lanes[j].dir === 'left' || lanes[j].dir === 'right') { horiz = j; break; }
      }
    }
    laneI = horiz;
    L = lanes[laneI];
    into = L.w * 0.5;
  }
  const pitW = LIFE_SHIP_W * 2;
  const center = L.dir === 'right'
    ? L.x + (laneI === 0 ? into : LIFE_T + into)
    : L.x + L.w - (laneI === 0 ? into : LIFE_T + into);
  let x = center - pitW / 2;
  if (x < L.x + 90) x = L.x + 90;
  if (x + pitW > L.x + L.w - 90) x = L.x + L.w - 90 - pitW;
  return {
    x: x, w: pitW, floor: L.y + L.h, laneY: L.y, laneH: L.h, lane: laneI,
    maxDepth: player.h * 5, shaft: null, cave: null, ladder: null,
    done: false, digging: false, dir: 0, platform: null, pedestals: null, along: mid, total: total
  };
}

function buildLifeGoo(lanes, dig) {
  const goo = [];
  const pitW = LIFE_SHIP_W * 2;
  const depth = 16;
  for (let i = 0; i < lanes.length; i++) {
    const L = lanes[i];
    if (L.boss || L.dig || L.dirt) continue;
    if (L.dir !== 'left' && L.dir !== 'right') continue;
    const count = Math.max(1, Math.round((L.w - 80) * 0.1 / pitW));
    const span = L.w - 160;
    const gap = (span - count * pitW) / (count + 1);
    let x = L.x + 80 + gap;
    for (let n = 0; n < count; n++) {
      let px = x;
      if (dig && px < dig.x + dig.w + 40 && px + pitW > dig.x - 40) px = dig.x + dig.w + 50;
      if (px + pitW < L.x + L.w - 40) {
        goo.push({ x: px, y: L.y + L.h, w: pitW, h: depth, depth: depth });
      }
      x += pitW + gap;
    }
  }
  return goo;
}

function lifeInGoo(px, py, goo) {
  for (let i = 0; i < goo.length; i++) {
    const g = goo[i];
    if (px >= g.x && px <= g.x + g.w && py >= g.y - 8 && py <= g.y + g.depth) return true;
  }
  return false;
}

function lifeBlocksRect(lanes, x, y, w, h) {
  for (let i = 0; i < lanes.length; i++) {
    const L = lanes[i];
    if (L.dig) continue;
    if (x < L.x + L.w && x + w > L.x && y < L.y + L.h && y + h > L.y) return true;
  }
  return false;
}

function lifeRoomThatWay(lanes, x, dir, y, h, maxDist) {
  let dist = 0;
  while (dist < maxDist) {
    const px = dir < 0 ? x - dist - 16 : x + dist;
    if (lifeBlocksRect(lanes, px, y, 16, h)) break;
    dist += 16;
  }
  return dist;
}

function lifeOnDig(lf) {

function lifeNearDig(lf) {

function lifeOpenCave(lf) {
  const d = lf.dig;
  if (d.done) return;

  const y = d.floor + d.maxDepth - caveH;

  const rightRoom = lifeRoomThatWay(lf.lanes, d.x + d.w, 1, y, caveH, reach);
  const dir = leftRoom >= rightRoom ? -1 : 1;
  const room = dir < 0 ? leftRoom : rightRoom;
  const caveW = Math.max(220, Math.min(length, room - 8));
  const caveX = dir < 0 ? d.x - caveW : d.x + d.w;
  d.cave = { x: caveX, y: y, w: caveW, h: caveH, dig: true, dirt: true, dir: dir < 0 ? 'left' : 'right' };

    d.ladder.side = dir < 0 ? 'right' : 'left';
    d.ladder.h = d.maxDepth - 12;
  }
  const foot = d.cave.y + d.cave.h;
  const mid = d.cave.x + d.cave.w / 2;

function lifeUpdateDig(lf) {

function lifeLadderUnder(lf, pad) {

      return lad;
  }
  return null;
}

function lifeOnFoot(lf) {
  const spikes = player.armorFeet.includes('spike_shoes');
  const holdC = !!(keys['c'] || keys['C']);
  const ladder = lifeLadderUnder(lf, 0);
  let ix = 0;
  if (keys['ArrowLeft']) { ix = -1; player.facing = -1; }
  else if (keys['ArrowRight']) { ix = 1; player.facing = 1; }
  let iy = 0;
  if (keys['ArrowUp']) iy = -1;
  else if (keys['ArrowDown']) iy = 1;

  if (ladder) {
    player.onGround = false;
    player.vx = ix * player.speed;
    player.vy = iy * player.speed;
  } else if (holdC && spikes && lifeBesideWall(player.x, player.y, lf.lanes)) {
    player.onGround = false;
    player.vx = ix * 3.2;
    player.vy = iy * 3.2;
  } else {
    const walk = player.speed * (player.armorFeet.includes('fly_shoes') ? 1.2 : 1);
    player.vx = ix * walk;
    player.vy += 0.68;
    if (player.vy > 16) player.vy = 16;
    if (iy < 0 && player.onGround) player.vy = -player.jump;
  }

  const prevX = player.x;
  player.x += player.vx;
  if (!lifeBodyIn(player.x, player.y, lf.lanes)) {
    let freed = false;
    for (let up = 1; up <= 20; up++) {
      if (lifeBodyIn(player.x, player.y - up, lf.lanes)) {
        player.y -= up;
        player.vy = 0;
        freed = true;
        break;
      }
    }
    if (!freed) player.x = prevX;
  }
  const prevY = player.y;
  player.y += player.vy;
  if (!lifeBodyIn(player.x, player.y, lf.lanes)) {
    if (player.vy > 0) {
      player.y = prevY;
      let guard = 0;
      while (guard < 24 && lifeBodyIn(player.x, player.y + 1, lf.lanes)) { player.y += 1; guard++; }
      player.vy = 0;
      player.onGround = true;
    } else {
      player.y = prevY;
      player.vy = 0;
      player.onGround = false;
    }
  } else {
    player.onGround = player.vy >= 0 && !lifeBodyIn(player.x, player.y + 1, lf.lanes);
    if (player.onGround) player.vy = 0;
  }
}

function sprinkleLifeRats(lanes, avoid) {
  const rats = [];
  for (let i = 0; i < lanes.length; i++) {
    const L = lanes[i];
    if (L.dir === 'up' || L.dir === 'down') continue;
    let x = L.x + 700;
    let n = 0;
    while (x < L.x + L.w - 260) {
      const y = L.y + L.h - 34;
      let near = false;
      for (let p = 0; p < avoid.length; p++) {
        if (Math.hypot(x - avoid[p].x, (y + 16) - avoid[p].y) < 180) near = true;
      }
      if (!near) {
        rats.push({
          x: x, y: y, w: 22, h: 16, hp: 16, kind: 0, lane: i, rat: true,
          vx: (n % 2) ? 2.15 : -2.15, vy: 0, cool: 40 + n * 19, drift: 0
        });
        n++;
      }
      x += 2500;
    }
  }
  return rats;
}

function lifeMoveRat(rat, lanes) {
  if (rat.cool > 0) rat.cool--;
  const cx = rat.x + rat.w / 2;
  const feet = rat.y + rat.h - 1;
  const supported = lifePointInLanes(cx, feet - 2, lanes) && !lifePointInLanes(cx, feet + 6, lanes);
  if (supported && rat.vy >= 0 && rat.cool <= 0) {
    rat.cool = 96;
    if (Math.random() < 0.55) rat.vy = -7.5;
  }
  if (!(supported && rat.vy >= 0)) {
    rat.vy += 0.68;
    if (rat.vy > 9) rat.vy = 9;
  }
  rat.y += rat.vy;
  let guard = 0;
  while (guard < 16 && lifePointInLanes(rat.x + rat.w / 2, rat.y + 3, lanes) && !lifePointInLanes(rat.x + rat.w / 2, rat.y + rat.h - 1, lanes)) {
    rat.y -= 1;
    rat.vy = 0;
    guard++;
  }
  if (!lifePointInLanes(rat.x + rat.w / 2, rat.y + 4, lanes)) {
    rat.y -= 6;
    rat.vy = 0;
    rat.vx *= -1;
  }
  const dir = rat.vx >= 0 ? 1 : -1;
  const ax = dir > 0 ? rat.x + rat.w + 4 : rat.x - 4;
  const ay = rat.y + rat.h - 2;
  const onFloor = lifePointInLanes(rat.x + rat.w / 2, rat.y + rat.h - 1, lanes)
    && !lifePointInLanes(rat.x + rat.w / 2, rat.y + rat.h + 6, lanes);
  const wall = !lifePointInLanes(ax, ay, lanes);
  const drop = onFloor && lifePointInLanes(ax, ay + 22, lanes);
  let pit = false;
  if (onFloor && lifeForce && lifeForce.goo) {
    for (let g = 0; g < lifeForce.goo.length; g++) {
      const puddle = lifeForce.goo[g];
      if (ax >= puddle.x && ax <= puddle.x + puddle.w) pit = true;
    }
  }
  if (wall || drop || pit) rat.vx = -dir * 2.15;
  else rat.x += rat.vx;
}

function drawLifeLadder(lad) {

  if (x < -40 || x > W + 40 || y > H + 20 || y + lad.h < -20) return;
  ctx.strokeStyle = '#d5dbe0';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.lineTo(x, y + lad.h);
  ctx.moveTo(x + 16, y);
  ctx.lineTo(x + 16, y + lad.h);
  ctx.stroke();
  ctx.lineWidth = 2;
  for (let ry = 10; ry < lad.h; ry += 18) {
    ctx.beginPath();
    ctx.moveTo(x, y + ry);
    ctx.lineTo(x + 16, y + ry);
    ctx.stroke();
  }
}

function drawLifeGoo(g) {
  const x = g.x - camX;
  const y = g.y - camY;
  if (x < -80 || x > W + 80 || y < -30 || y > H + 40) return;
  ctx.fillStyle = '#142016';
  ctx.fillRect(x, y, g.w, g.depth);
  ctx.fillStyle = 'rgba(36, 130, 42, 0.94)';
  ctx.fillRect(x + 3, y, g.w - 6, g.depth);
  ctx.fillStyle = 'rgba(170, 230, 96, 0.8)';
  ctx.fillRect(x + 8, y, g.w - 16, 3);
}

function drawLifeBreak(d) {
  const x = d.x - camX;
  const top = d.laneY - camY;
  const floor = top + d.laneH;
  if (x < -40 || x > W + 40 || floor < -40 || top > H + 40) return;
  const dirtH = 32;
  ctx.fillStyle = '#4a3828';
  ctx.fillRect(x, floor - dirtH, d.w, dirtH);
  ctx.fillStyle = '#7a5a3c';
  ctx.fillRect(x + 6, floor - dirtH + 6, d.w - 12, dirtH - 6);
  const cx = x + d.w / 2;
  const crackTop = top + 22;
  const crackBot = floor - 6;
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(cx, crackBot);
  const segs = 8;
  for (let i = 1; i <= segs; i++) {
    const yy = crackBot + (crackTop - crackBot) * (i / segs);
    ctx.lineTo(cx + (i % 2 === 0 ? 9 : -8), yy);
  }
  ctx.strokeStyle = '#c4b49a';
  ctx.lineWidth = 7;
  ctx.stroke();
  ctx.strokeStyle = '#16110e';
  ctx.lineWidth = 3;
  ctx.stroke();
}

function drawLifePedestals(d) {
  if (!d.platform) return;
  const p = d.platform;
  ctx.fillStyle = '#6e6258';
  ctx.fillRect(p.x - camX, p.y - camY, p.w, p.h);
  for (let i = 0; i < d.pedestals.length; i++) {
    const ped = d.pedestals[i];
    ctx.fillStyle = '#8d8378';
    ctx.fillRect(ped.x - camX, ped.y - camY, ped.w, ped.h);
    ctx.fillStyle = '#d7dde2';
    ctx.fillRect(ped.x - camX - 4, ped.y - camY, ped.w + 8, 5);
  }
}

function drawLifeRat(rat) {
  const x = rat.x - camX;
  const y = rat.y - camY;
  if (x < -40 || x > W + 40 || y < -30 || y > H + 30) return;
  ctx.fillStyle = '#6a5344';
  ctx.beginPath();
  ctx.ellipse(x + 12, y + 9, 10, 6, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#4e3b32';
  ctx.beginPath();
  ctx.ellipse(x + 4, y + 6, 4, 3.5, 0, 0, Math.PI * 2);
  ctx.ellipse(x + 8, y + 4, 2.2, 2.2, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#3a2a24';
  ctx.lineWidth = 1.4;
  ctx.beginPath();
  ctx.moveTo(x + 20, y + 9);
  ctx.quadraticCurveTo(x + 28, y + 4, x + 26, y + 14);
  ctx.stroke();
  ctx.fillStyle = '#f4f4f4';
  ctx.fillRect(x + 3, y + 5, 2, 2);
}

function drawLifePrompts(lf) {
  const lines = [];
  if (player.hasSantaSleigh) lines.push('E  exit sleigh');
  else if (lf.parked && Math.hypot((player.x + 16) - (lf.parked.x + 16), (player.y + 30) - (lf.parked.y + 30)) < 100)
    lines.push('E  enter sleigh');
  if (player.armorFeet.includes('spike_shoes')) lines.push('C + arrows  climb');
  if (lifeLadderUnder(lf, 48)) lines.push('up / down  ladder');
  if (lifeNearDig(lf)) lines.push('D  dig');
  if (!lines.length) return;
  ctx.fillStyle = '#f4e7a4';
  ctx.font = 'bold 18px Arial';
  ctx.textAlign = 'left';
  for (let i = 0; i < lines.length; i++) ctx.fillText(lines[i], 12, 78 + i * 22);
}

function initLifeForce() {
  lifeRestoreSleighGear();
  const lanes = buildLifeForceLanes();
  const bottles = [
    lifeLanePoint(lanes[0], 1100),
    lifeLanePoint(lanes[1], lanes[1].h / 2),
    lifeLanePoint(lanes[4], lanes[4].w / 2),
    lifeLanePoint(lanes[8], lanes[8].w - 1100)
  ].map(function (p) { return { x: p.x, y: p.y, got: false }; });
  const gearPlan = [
    ['lederhosen', 1, 900],
    ['fly_shoes', 3, 1500],
    ['stage_mic', 4, 1700],
    ['spike_shoes', 4, 4200],
    ['pink_guitar', 6, 3000]
  ];
  const gear = [];
  for (let i = 0; i < gearPlan.length; i++) {
    const spot = lifeLanePoint(lanes[gearPlan[i][1]], gearPlan[i][2]);
    gear.push({ id: gearPlan[i][0], x: spot.x, y: spot.y, w: 28, h: 22 });
  }
  if (player.weapons.includes('pink_guitar') && player.weapons.includes('bone_club')) {
    player.weapons.splice(player.weapons.indexOf('bone_club'), 1);
    const drop = lifeLanePoint(lanes[0], 2900);
    gear.push({ id: 'bone_club', x: drop.x, y: drop.y, w: 28, h: 22 });
  }
  const avoid = bottles.concat(gear);
  const room = lanes[lanes.length - 1];
  const dig = buildLifeDig(lanes);
  lifeForce = {
    lanes: lanes,
    room: room,
    bottles: bottles,
    carried: [],
    gear: gear,
    foes: sprinkleLifeFoes(lanes, avoid).concat(sprinkleLifeRats(lanes, avoid)),
    shots: [],
    guns: { spork: 0, turret: 0 },
    laser: null,
    decor: buildLifeDecor(lanes),
    ladders: buildLifeLadders(lanes),
    dig: dig,
    goo: buildLifeGoo(lanes, dig),
    parked: null,
    eLock: false,
    boss: {
      x: room.x + 640, y: room.y + 200, w: 168, h: 148,
      hp: 980, maxHp: 980, vy: 2.15, cool: 70, alive: true
    },
    hurtCool: 0,
    winTimer: 0,
    exitNow: false,
    returnX: player.x,
    returnY: player.y
  };
  player.x = 260;
  player.y = lanes[0].y + lanes[0].h / 2 - 39;
  player.vx = 0;
  player.vy = 0;
  player.facing = 1;
  player.onGround = false;
}

function exitLifeForce() {
  const backX = lifeForce.returnX;
  const backY = lifeForce.returnY + 520;
  inSecretDimension = false;
  secretDimensionLevel = 0;
  if (lifeForce.parked) player.hasSantaSleigh = true;
  lifeForce = null;
  const bar = document.getElementById('bossHP');
  if (bar) bar.style.display = 'none';
  player.x = backX;
  player.y = backY;
  player.vx = 0;
  player.vy = 0;
  player.isFiringLaser = false;
  if (micWeapon.state !== 'ready') micWeapon.state = 'ready';
  camX = player.x - W * 0.47;
  camY = Math.min(0, player.y - H * 0.57);
  showLevelMsg('TUNNEL CLEARED');
}

function lifeMoveFoe(foe, lane) {
  const inset = 22;
  if (lane.dir === 'left' || lane.dir === 'right') {
    foe.y += foe.drift;
    if (foe.y < lane.y + inset) { foe.y = lane.y + inset; foe.drift = Math.abs(foe.drift); }
    if (foe.y + foe.h > lane.y + lane.h - inset) {
      foe.y = lane.y + lane.h - inset - foe.h;
      foe.drift = -Math.abs(foe.drift);
    }
  } else {
    foe.x += foe.drift;
    if (foe.x < lane.x + inset) { foe.x = lane.x + inset; foe.drift = Math.abs(foe.drift); }
    if (foe.x + foe.w > lane.x + lane.w - inset) {
      foe.x = lane.x + lane.w - inset - foe.w;
      foe.drift = -Math.abs(foe.drift);
    }
  }
  if (foe.kind === 1 && lifeAwake(foe)) {
    const dx = (player.x + 16) - (foe.x + foe.w / 2);
    const dy = (player.y + 30) - (foe.y + foe.h / 2);
    if (dx !== 0) foe.x += Math.sign(dx) * 0.7;
    if (dy !== 0) foe.y += Math.sign(dy) * 0.7;
  }
  foe.x = Math.max(lane.x + 8, Math.min(lane.x + lane.w - foe.w - 8, foe.x));
  foe.y = Math.max(lane.y + 8, Math.min(lane.y + lane.h - foe.h - 8, foe.y));
}

function tickLifeFx() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx || 0;
    p.y += p.vy || 0;
    p.vy = (p.vy || 0) + 0.37;
    p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }
  for (let i = floatingTexts.length - 1; i >= 0; i--) {
    const t = floatingTexts[i];
    t.y += t.vy;
    t.life--;
    if (t.life <= 0) floatingTexts.splice(i, 1);
  }
}

function updateLifeForce() {
  const lf = lifeForce;
  if (lf.hurtCool > 0) lf.hurtCool--;
  if (gamePaused) { tickLifeFx(); return; }
  if (lf.winTimer > 0) {
    lf.winTimer--;
    tickLifeFx();
    if (lf.winTimer <= 0) lf.exitNow = true;
    return;
  }

  if ((keys['z'] || keys['Z']) && player.hp < player.maxHp) {
    regenTimer = (regenTimer || 0) + 1;
    if (regenTimer >= 50) {
      const heal = healTickAmount();
      player.hp = Math.min(player.maxHp, player.hp + heal);
      document.getElementById('hp').textContent = Math.floor(player.hp);
      floatingText(player.x + 16, player.y - 30, '+' + heal, '#0f0');
      regenTimer = 0;
    }
  } else regenTimer = 0;

  const wantE = !!(keys['e'] || keys['E']);
  if (wantE && !lf.eLock) {
    lf.eLock = true;
    if (player.hasSantaSleigh) {
      lf.parked = { x: player.x, y: player.y, facing: player.facing };
      player.hasSantaSleigh = false;
      player.vy = 2;
      player.vx = 0;
      lifeUnstick(lf.lanes);
    } else if (lf.parked && Math.hypot((player.x + 16) - (lf.parked.x + 16), (player.y + 30) - (lf.parked.y + 30)) < 100) {
      player.x = lf.parked.x;
      player.y = lf.parked.y;
      player.facing = lf.parked.facing || player.facing;
      player.hasSantaSleigh = true;
      player.vx = 0;
      player.vy = 0;
      lf.parked = null;
    }
  }
  if (!wantE) lf.eLock = false;

  if (player.hasSantaSleigh) {
    let ix = 0;
    let iy = 0;
    if (keys['ArrowLeft']) { ix = -1; player.facing = -1; }
    else if (keys['ArrowRight']) { ix = 1; player.facing = 1; }
    if (keys['ArrowUp']) iy = -1;
    else if (keys['ArrowDown']) iy = 1;
    if (ix !== 0 && iy !== 0) { ix *= 0.7071; iy *= 0.7071; }
    const moveSpeed = LIFE_SPEED * (player.armorFeet.includes('fly_shoes') ? 1.2 : 1);
    player.vx = ix * moveSpeed;
    player.vy = iy * moveSpeed;
    player.onGround = false;
    player.coyoteTime = 8;

    const prevX = player.x;
    const prevY = player.y;
    player.x += player.vx;
    let scraped = false;
    if (!lifeShipInside(player.x, player.y, lf.lanes)) {
      player.x = prevX;
      scraped = true;
    }
    player.y += player.vy;
    if (!lifeShipInside(player.x, player.y, lf.lanes)) {
      player.y = prevY;
      scraped = true;
    }
    if (scraped) {
      lifeHurt(8);
      if (lifeForceStopped()) { tickLifeFx(); return; }
    }
  } else {
    lifeOnFoot(lf);
  }

  if (player.hasSantaSleigh) {
    const bx = player.x + LIFE_SHIP_OX;
    const by = player.y + LIFE_SHIP_OY + LIFE_SHIP_H - 1;
    if (lifeInGoo(bx + 16, by, lf.goo) || lifeInGoo(bx + 35, by, lf.goo) || lifeInGoo(bx + 54, by, lf.goo)) {
      lifeHurt(player.armorFeet.includes('spike_shoes') ? 3 : 6);
      if (lifeForceStopped()) { tickLifeFx(); return; }
    }
  } else if (lifeInGoo(player.x + player.w / 2, player.y + player.h - 4, lf.goo)) {
    lifeHurt(player.armorFeet.includes('spike_shoes') ? 3 : 6);
    if (lifeForceStopped()) { tickLifeFx(); return; }
  }

  const pcx = player.x + 16;
  const pcy = player.y + 39;
  for (let i = lf.gear.length - 1; i >= 0; i--) {
    const it = lf.gear[i];
    if (it.cool > 0) { it.cool--; continue; }
    if (Math.hypot(pcx - it.x, pcy - it.y) < 58) {
      if (lifeTakeGear(lf, it)) lf.gear.splice(i, 1);
    }
  }
  for (let i = 0; i < lf.bottles.length; i++) {
    const bottle = lf.bottles[i];
    if (bottle.got) continue;
    if (player.hasSantaSleigh && Math.hypot(pcx - bottle.x, pcy - bottle.y) < 50 && lf.carried.length < 4) {
      bottle.got = true;
      lf.carried.push({ x: bottle.x, y: bottle.y, cool: 0 });
      floatingText(bottle.x, bottle.y - 24, 'WATER', '#7eb6ff');
    }
  }

  const bottleHome = player.hasSantaSleigh ? player : (lf.parked || player);
  const behind = -(bottleHome.facing || player.facing || 1);
  for (let i = 0; i < lf.carried.length; i++) {
    const bottle = lf.carried[i];
    const tx = bottleHome.x + 16 + behind * (56 + i * 36);
    const ty = bottleHome.y + 36 + (i - (lf.carried.length - 1) / 2) * 20;
    bottle.x += (tx - bottle.x) * 0.2;
    bottle.y += (ty - bottle.y) * 0.2;
    if (bottle.cool > 0) bottle.cool--;
    else if (keys[' '] && player.hasSantaSleigh) {
      let sx = bottle.x;
      let sy = bottle.y - 16;
      if (!lifePointInLanes(sx, sy, lf.lanes)) { sx = pcx; sy = pcy; }
      const dir = player.facing >= 0 ? 1 : -1;
      const spd = 17.25;
      const base = dir > 0 ? 0 : Math.PI;
      lf.shots.push(lifeSpreadWater(sx, sy, base - dir * 0.2, spd, { grav: 0.24, life: 46 }, itemDB.spork.damage));
      lf.shots.push(lifeSpreadWater(sx, sy, base + dir * 0.1, spd, { grav: 0.24, life: 46 }, itemDB.spork.damage));
      bottle.cool = 28;
    }
  }

  lifeUpdateDig(lf);
  lifeSwingWeapons(lf);
  if (player.hasSantaSleigh) {
    updateLifeGuns(lf);
    updateLifeMic(lf);
  }
  updateLifeLaser(lf);

  for (let f = 0; f < lf.foes.length; f++) {
    const foe = lf.foes[f];
    if (foe.rat) {
      lifeMoveRat(foe, lf.lanes);
      continue;
    }
    lifeMoveFoe(foe, lf.lanes[foe.lane]);
    if (foe.cool > 0) foe.cool--;
    if (foe.cool <= 0 && lifeAwake(foe)) {
      const fx = foe.x + foe.w / 2;
      const fy = foe.y + foe.h / 2;
      if (lifeClearLine(fx, fy, pcx, pcy, lf.lanes)) {
        const ang = Math.atan2(pcy - fy, pcx - fx);
        lf.shots.push({ x: fx, y: fy, vx: Math.cos(ang) * 3.6, vy: Math.sin(ang) * 3.6, kind: 'foe', life: 180 });
        foe.cool = foe.kind ? 156 : 128;
      }
    }
  }

  const room = lf.room;
  const boss = lf.boss;
  if (boss.alive) {
    boss.y += boss.vy;
    if (boss.y < room.y + 36) { boss.y = room.y + 36; boss.vy = Math.abs(boss.vy); }
    if (boss.y + boss.h > room.y + room.h - 36) {
      boss.y = room.y + room.h - 36 - boss.h;
      boss.vy = -Math.abs(boss.vy);
    }
    if (lifePlayerInRect(room)) {
      if (boss.cool > 0) boss.cool--;
      if (boss.cool <= 0) {
        const bx = boss.x + boss.w / 2;
        const by = boss.y + boss.h / 2;
        const base = Math.atan2(pcy - by, pcx - bx);
        for (let s = -2; s <= 2; s++) {
          const ang = base + s * 0.26;
          lf.shots.push({ x: bx, y: by, vx: Math.cos(ang) * 3.3, vy: Math.sin(ang) * 3.3, kind: 'boss', life: 220 });
        }
        boss.cool = 52;
      }
    }
  }

  for (let i = lf.shots.length - 1; i >= 0; i--) {
    const s = lf.shots[i];
    if (s.kind === 'water') {
      if (!s.trail) s.trail = [];
      s.trail.push({ x: s.x, y: s.y });
      if (s.trail.length > 7) s.trail.shift();
      s.vy += s.grav || 0;
    }
    s.x += s.vx;
    s.y += s.vy;
    s.life--;
    if (s.life <= 0 || !lifePointInLanes(s.x, s.y, lf.lanes)) {
      lf.shots.splice(i, 1);
      continue;
    }
    const friendly = s.kind === 'water' || s.kind === 'spork' || s.kind === 'club' || s.kind === 'guitar';
    if (friendly) {
      let hit = false;
      const r = s.r || 6;
      for (let f = lf.foes.length - 1; f >= 0; f--) {
        if (lifeCircleHitsRect(s.x, s.y, r, lf.foes[f])) {
          if (s.dmg > 0) lifeDamageFoe(lf, f, s.dmg);
          hit = true;
          break;
        }
      }
      if (!hit && boss.alive && lifeCircleHitsRect(s.x, s.y, r, boss)) {
        if (s.dmg > 0) boss.hp -= s.dmg;
        hit = true;
      }
      if (hit) lf.shots.splice(i, 1);
    } else if (lifeShotHitsPlayer(s.x, s.y)) {
      lifeHurt(s.kind === 'boss' ? 10 : 8);
      lf.shots.splice(i, 1);
      if (lifeForceStopped()) { tickLifeFx(); return; }
    }
  }

  if (boss.alive && boss.hp <= 0) {
    boss.alive = false;
    boss.hp = 0;
    blood(boss.x + boss.w / 2, boss.y + boss.h / 2);
    floatingText(boss.x + boss.w / 2, boss.y, 'CLEARED', '#f4c430');
    lf.shots = [];
    lf.winTimer = 70;
    const bar = document.getElementById('bossHP');
    if (bar) bar.style.display = 'none';
    tickLifeFx();
    return;
  }

  for (let f = 0; f < lf.foes.length; f++) {
    const foe = lf.foes[f];
    if (lifeBodyHitsFoe(foe)) {
      lifeHurt(foe.rat ? 6 : 10);
      break;
    }
  }
  if (!lifeForceStopped() && boss.alive && lifeBodyHitsFoe(lf.boss)) {
    lifeHurt(14);
  }
  tickLifeFx();
}

function drawLifeFoe(foe) {
  if (foe.rat) { drawLifeRat(foe); return; }
  const x = foe.x - camX;
  const y = foe.y - camY;
  if (x < -80 || x > W + 80 || y < -80 || y > H + 80) return;
  ctx.fillStyle = foe.kind ? '#4a1f2a' : '#3a2a1f';
  ctx.beginPath();
  ctx.roundRect(x, y, foe.w, foe.h, 8);
  ctx.fill();
  ctx.fillStyle = '#f4f4f4';
  ctx.beginPath();
  ctx.ellipse(x + 13, y + 13, 5, 6, 0, 0, Math.PI * 2);
  ctx.ellipse(x + 31, y + 13, 5, 6, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#3b2a20';
  ctx.beginPath();
  ctx.ellipse(x + 14, y + 14, 2.1, 2.4, 0, 0, Math.PI * 2);
  ctx.ellipse(x + 32, y + 14, 2.1, 2.4, 0, 0, Math.PI * 2);
  ctx.fill();
}

function drawLifeBoss(b) {
  const x = b.x - camX;
  const y = b.y - camY;
  ctx.fillStyle = '#2b1d14';
  ctx.fillRect(x + 28, y - 16, 14, 26);
  ctx.fillRect(x + b.w - 42, y - 16, 14, 26);
  ctx.fillStyle = '#4a1f2a';
  ctx.beginPath();
  ctx.roundRect(x, y, b.w, b.h, 22);
  ctx.fill();
  ctx.fillStyle = '#f4e7a4';
  ctx.beginPath();
  ctx.ellipse(x + 50, y + 52, 16, 18, 0, 0, Math.PI * 2);
  ctx.ellipse(x + 118, y + 52, 16, 18, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#3b2a20';
  ctx.beginPath();
  ctx.ellipse(x + 54, y + 54, 6, 7, 0, 0, Math.PI * 2);
  ctx.ellipse(x + 122, y + 54, 6, 7, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#2b1d14';
  ctx.fillRect(x + 40, y + b.h - 38, b.w - 80, 10);
}

function drawLifeFx() {
  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];
    ctx.globalAlpha = Math.max(0, p.life / 52);
    ctx.fillStyle = p.c;
    ctx.fillRect(p.x - camX - (p.s || 8) / 2, p.y - camY - (p.s || 8) / 2, p.s || 8, p.s || 8);
  }
  ctx.globalAlpha = 1;
  for (let i = 0; i < floatingTexts.length; i++) {
    const t = floatingTexts[i];
    ctx.globalAlpha = Math.max(0, t.life / 58);
    ctx.fillStyle = t.color;
    ctx.font = 'bold 22px Arial';
    ctx.textAlign = 'center';
    ctx.fillText(t.text, t.x - camX, t.y - camY);
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'left';
}

function lifeLaneVisible(L) {
  const x = L.x - camX;
  const y = L.y - camY;
  return x < W + 40 && x + L.w > -40 && y < H + 40 && y + L.h > -40;
}

function drawLifeForce() {
  const lf = lifeForce;
  ctx.fillStyle = '#12161a';
  ctx.fillRect(0, 0, W, H);
  ctx.lineWidth = 14;
  for (let i = 0; i < lf.lanes.length; i++) {
    const L = lf.lanes[i];
    if (!lifeLaneVisible(L)) continue;
    ctx.strokeStyle = L.dirt ? '#4a3828' : '#4a545c';
    ctx.strokeRect(L.x - camX, L.y - camY, L.w, L.h);
  }
  for (let i = 0; i < lf.lanes.length; i++) {
    const L = lf.lanes[i];
    if (!lifeLaneVisible(L)) continue;
    ctx.fillStyle = L.dirt ? '#7a5a3c' : '#8d959c';
    ctx.fillRect(L.x - camX, L.y - camY, L.w, L.h);
  }
  for (let i = 0; i < lf.lanes.length; i++) {
    const L = lf.lanes[i];
    if (!lifeLaneVisible(L)) continue;
    const x = L.x - camX;
    const y = L.y - camY;
    if (L.dirt) {
      ctx.fillStyle = '#3a2c20';
      ctx.fillRect(x, y + L.h - 18, L.w, 18);
      continue;
    }
    ctx.fillStyle = '#5c656c';
    if (L.dir === 'up' || L.dir === 'down') {
      ctx.fillRect(x, y, 18, L.h);
      ctx.fillRect(x + L.w - 18, y, 18, L.h);
    } else {
      ctx.fillRect(x, y, L.w, 18);
      ctx.fillStyle = '#3e474e';
      ctx.fillRect(x, y + L.h - 26, L.w, 26);
    }
    ctx.fillStyle = '#d7dde2';
    const step = 96;
    if (L.dir === 'up' || L.dir === 'down') {
      for (let yy = L.y + 28; yy < L.y + L.h - 16; yy += step) {
        ctx.beginPath();
        ctx.arc(x + 16, yy - camY, 2.2, 0, Math.PI * 2);
        ctx.arc(x + L.w - 16, yy - camY, 2.2, 0, Math.PI * 2);
        ctx.fill();
      }
    } else {
      for (let xx = L.x + 36; xx < L.x + L.w - 16; xx += step) {
        ctx.beginPath();
        ctx.arc(xx - camX, y + 14, 2.2, 0, Math.PI * 2);
        ctx.arc(xx - camX, y + L.h - 14, 2.2, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }
  for (let i = 0; i < lf.decor.length; i++) {
    const d = lf.decor[i];
    const x = d.x - camX;
    const y = d.y - camY;
    if (x < -30 || x > W + 30 || y < -30 || y > H + 30) continue;
    ctx.fillStyle = d.c;
    ctx.fillRect(x, y, d.w, d.h);
  }
  if (lf.dig) drawLifeBreak(lf.dig);
  for (let i = 0; i < lf.ladders.length; i++) drawLifeLadder(lf.ladders[i]);
  if (lf.dig && lf.dig.done) drawLifePedestals(lf.dig);
  for (let i = 0; i < lf.gear.length; i++) {
    const it = lf.gear[i];
    const bob = Math.sin(frameCount * 0.07 + i) * 5;
    const sx = it.x - camX;
    const sy = it.y - camY + bob;
    if (sx < -80 || sx > W + 80 || sy < -80 || sy > H + 80) continue;
    drawGroundPickupArt({ id: it.id, x: it.x, y: it.y + bob, w: it.w, h: it.h });
  }
  for (let i = 0; i < lf.bottles.length; i++) {
    const bottle = lf.bottles[i];
    if (bottle.got) continue;
    const bob = Math.sin(frameCount * 0.08 + i * 1.7) * 6;
    const x = bottle.x - camX;
    const y = bottle.y - camY + bob;
    if (x < -40 || x > W + 40 || y < -40 || y > H + 40) continue;
    drawWaterBottle(x, y, 1);
  }
  for (let i = 0; i < lf.foes.length; i++) drawLifeFoe(lf.foes[i]);
  if (lf.boss.alive) drawLifeBoss(lf.boss);
  for (let i = 0; i < lf.shots.length; i++) {
    const s = lf.shots[i];
    const x = s.x - camX;
    const y = s.y - camY;
    if (s.kind === 'water') {
      const trail = s.trail || [];
      for (let t = 0; t < trail.length; t++) {
        const p = trail[t];
        ctx.globalAlpha = 0.25 + (t / trail.length) * 0.45;
        ctx.fillStyle = '#8ec8ee';
        ctx.beginPath();
        ctx.arc(p.x - camX, p.y - camY, 2.5 + t * 0.35, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 0.9;
      ctx.fillStyle = '#d7eefb';
      ctx.beginPath();
      ctx.arc(x, y, 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(x - 1, y - 1, 2, 0, Math.PI * 2);
      ctx.fill();
    } else if (s.kind === 'spork') {
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(x, y, 4, 0, Math.PI * 2);
      ctx.fill();
    } else if (s.kind === 'club') {
      ctx.fillStyle = 'rgba(255,255,255,0.28)';
      ctx.beginPath();
      ctx.arc(x, y, 16, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.55)';
      ctx.beginPath();
      ctx.arc(x, y, 9, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(x, y, 4, 0, Math.PI * 2);
      ctx.fill();
    } else if (s.kind === 'guitar') {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(Math.atan2(s.vy, s.vx));
      ctx.fillStyle = '#fff4ea';
      ctx.fillRect(-8, -1.5, 16, 3);
      ctx.restore();
    } else if (s.kind === 'boss') {
      ctx.fillStyle = '#ff5a3c';
      ctx.fillRect(x - 5, y - 5, 10, 10);
    } else {
      ctx.fillStyle = '#d63a32';
      ctx.fillRect(x - 4, y - 4, 8, 8);
    }
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'left';
  if (lf.parked) drawParkedSleigh(lf.parked);
  drawPlayerAndInventory();
  for (let i = 0; i < lf.goo.length; i++) drawLifeGoo(lf.goo[i]);
  for (let i = 0; i < lf.carried.length; i++) {
    const bottle = lf.carried[i];
    drawWaterBottle(bottle.x - camX, bottle.y - camY, 0.85);
  }
  drawLifeLaser(lf.laser);
  drawLifeFx();

  const room = lf.room;
  const bar = document.getElementById('bossHP');
  const fill = document.getElementById('bossHPBar');
  if (lf.boss.alive && lifePlayerInRect(room)) {
    bar.style.display = 'block';
    fill.style.width = Math.max(0, (lf.boss.hp / lf.boss.maxHp) * 100) + '%';
  } else {
    bar.style.display = 'none';
  }
  document.getElementById('lvl').textContent = '???1';
  document.getElementById('kills').textContent = '∞';
  document.getElementById('goal').textContent = '∞';
  document.getElementById('hp').textContent = Math.floor(player.hp);
  document.getElementById('spunk').textContent = getCurrentSpunk();
  document.getElementById('resist').textContent = player.resistance;
  drawLifePrompts(lf);
}

function killsForLevel(level) {
  if (difficulty === 'normal') return 2 * (level + 1);
  if (difficulty === 'hard') return 5 * (level + 1);
  return 1;
}
function enemyCrowdMul() {
  if (difficulty === 'hard') return 4;
  if (difficulty === 'normal') return 2;
  return 1;
}
function enemySpawnPlan() {
  const crowd = inSecretDimension ? 1 : enemyCrowdMul();
  const bossFight = !inSecretDimension && !!(boss || boss2);
  return {
    crowd: crowd,
    bossFight: bossFight,
    maxLive: (9 + (bossFight ? 4 : 0)) * crowd,
    travelGap: Math.max(36, Math.floor((bossFight ? 170 : 380) / crowd)),
    timeGap: bossFight ? Math.max(40, Math.floor(80 / crowd)) : 0,
    leftStep: Math.max(48, Math.floor((bossFight ? 260 : 520) / crowd))
  };
}
function platformsAheadForSpawns() {
  const offscreenMinX = camX + W + 40;
  const lookAhead = 1600;
  const x0 = Math.max(player.x + 280, offscreenMinX);
  const x1 = player.x + lookAhead;
  const list = [];
  forPlatformsBetween(x0, x1, function (p) {
    if (p.l > x0 && p.l < x1 && p.t <= groundY && p.t > player.y - H * 6) list.push(p);
  });
  return list;
}
function pickSpreadSpawnPlatform(list) {
  if (!list.length) return null;
  const bands = new Map();
  for (const p of list) {
    const band = Math.round(p.t / 148);
    if (!bands.has(band)) bands.set(band, []);
    bands.get(band).push(p);
  }
  let bestCount = Infinity;
  const tied = [];
  for (const [band, plats] of bands) {
    const top = band * 148;
    let count = 0;
    for (const e of enemies) {
      if (e.x > player.x - 200 && e.x < player.x + 1800 && Math.abs((e.y + (e.h || 58)) - top) < 90) count++;
    }
    if (count < bestCount) {
      bestCount = count;
      tied.length = 0;
      tied.push(plats);
    } else if (count === bestCount) {
      tied.push(plats);
    }
  }
  const plats = tied[Math.floor(Math.random() * tied.length)];
  return plats[Math.floor(Math.random() * plats.length)];
}
function enemySpeedMul() {
  return difficulty === 'hard' ? 1.5 : 1;
}
function enemyDamageMul() {
  return difficulty === 'hard' ? 2 : 1;
}

const BIT5 = {

  I: ['11111','00100','00100','00100','00100','00100','11111'],

  ' ': ['00000','00000','00000','00000','00000','00000','00000']
};
const bitCanvas = document.createElement('canvas');
const bitCtx = bitCanvas.getContext('2d');

function bitTextWidth(text, scale) {
  return (text.length * 6 - 1) * scale;
}
function drawBitText(text, x, y, scale, color, glow) {
  const rows = 7;
  const w = text.length * 6 - 1;
  bitCanvas.width = Math.max(1, w);
  bitCanvas.height = rows;
  bitCtx.fillStyle = color;
  let cx = 0;
  for (let i = 0; i < text.length; i++) {
    const glyph = BIT5[text[i]] || BIT5[' '];
    for (let ry = 0; ry < rows; ry++) {
      for (let rx = 0; rx < 5; rx++) {
        if (glyph[ry][rx] === '1') bitCtx.fillRect(cx + rx, ry, 1, 1);
      }
    }
    cx += 6;
  }
  ctx.save();
  ctx.imageSmoothingEnabled = false;
  if (glow) {
    ctx.shadowColor = '#f00';
    ctx.shadowBlur = 25;
  }
  ctx.drawImage(bitCanvas, x, y, w * scale, rows * scale);
  ctx.restore();
}
function drawBitCentered(text, y, scale, color, glow) {
  drawBitText(text, (W - bitTextWidth(text, scale)) / 2, y, scale, color, glow);
}

function difficultyLabel() {
  if (difficulty === 'hard') return 'HARD';
  if (difficulty === 'normal') return 'NORMAL';
  if (difficulty === 'endless') return 'ENDLESS NIGHTMARE';
  return 'EASY';
}

function startGameFromMenu() {
  gameState = STATE_PLAYING;
  keys = {};
  document.getElementById('ui').style.display = 'block';
  if (difficulty === 'endless') {
    beginEndless();
    return;
  }
  document.getElementById('goal').textContent = killsForLevel(currentLevel);

}

function titleMenuEdges() {
  const diffName = difficultyLabel();
  const lines = [
    'PLAY GAME',
    'DIFFICULTY ' + diffName,
    'DEV MODE ' + (devMode ? 'ON' : 'OFF'),
    'CREDITS'
  ];
  let left = W;
  let right = 0;
  for (let i = 0; i < lines.length; i++) {
    const w = bitTextWidth(lines[i], 4);
    const x = (W - w) / 2;
    if (x < left) left = x;
    if (x + w > right) right = x + w;
  }
  return { left: left, right: right };
}

function updateTitleShow() {
  const edges = titleMenuEdges();
  if (titleShow.phase === 'walkIn') {
    titleShow.pickupX = edges.right + 48;
    titleShow.standX = edges.left * 0.5 - 16;
  }
  titleShow.footY = 340 + 2 * 64 + 32;
  titleShow.t++;
  if (titleShow.phase === 'walkIn') {
    titleShow.walking = true;
    titleShow.facing = 1;
    titleShow.holding = false;
    titleShow.pose = 'walk';
    titleShow.x += 2.6;
    if (titleShow.x >= titleShow.pickupX - 36) {
      titleShow.x = titleShow.pickupX - 36;
      titleShow.phase = 'squat';
      titleShow.t = 0;
    }
  } else if (titleShow.phase === 'squat') {
    titleShow.walking = false;
    titleShow.pose = 'squat';
    if (titleShow.t > 40) {
      titleShow.phase = 'hold';
      titleShow.t = 0;
      titleShow.holding = true;
      titleShow.smiling = true;
    }
  } else if (titleShow.phase === 'hold') {
    titleShow.walking = false;
    titleShow.pose = 'hold';
    if (titleShow.t > 180) {
      titleShow.phase = 'walkBack';
      titleShow.t = 0;
      titleShow.facing = -1;
      titleShow.pose = 'walk';
      titleShow.holding = true;
      titleShow.walking = true;
      titleShow.standX = edges.left * 0.5 - 16;
    }
  } else if (titleShow.phase === 'walkBack') {
    titleShow.walking = true;
    titleShow.facing = -1;
    titleShow.pose = 'walk';
    titleShow.holding = true;
    titleShow.x -= 2.6;
    if (titleShow.x <= titleShow.standX) {
      titleShow.x = titleShow.standX;
      titleShow.phase = 'stand';
      titleShow.t = 0;
      titleShow.facing = 1;
    }
  } else if (titleShow.phase === 'stand') {
    titleShow.walking = false;
    titleShow.pose = 'walk';
    titleShow.holding = true;
    titleShow.facing = 1;
    if (titleShow.t > 7200) {
      titleShow.phase = 'toss';
      titleShow.t = 0;
      titleShow.toss = 0;
      titleShow.pose = 'toss';
      titleShow.holding = false;
      titleShow.walking = false;
    }
  } else {
    titleShow.walking = false;
    titleShow.pose = 'toss';
    titleShow.holding = false;
    titleShow.toss++;
  }
}

}

function drawTitleHoldArm() {
  const lift = Math.min(1, titleShow.t / 18);
  const ang = lerp(1.2, -Math.PI / 2, lift);
  ctx.save();
  ctx.translate(8, -16);
  ctx.rotate(ang);
  drawStubbyArm(16, 6.5, false);
  ctx.translate(16, 0);
  drawStubbyArm(14, 6, true);
  ctx.translate(10, 0);
  drawSporkBlade();
  ctx.restore();
}

function drawTitleToss() {
  const cycle = 110;
  const p = titleShow.toss % cycle;
  let armAng = -Math.PI / 2;
  if (p < 16) armAng = lerp(-0.5, -Math.PI / 2 - 0.35, p / 16);
  else if (p < 28) armAng = lerp(-Math.PI / 2 - 0.35, -Math.PI / 2, (p - 16) / 12);
  else if (p > 94) armAng = lerp(-Math.PI / 2, -0.7, (p - 94) / 16);
  const inHand = p < 18 || p >= 98;
  ctx.save();
  ctx.translate(10, -18);
  ctx.rotate(armAng);
  drawStubbyArm(15, 6.5, false);
  ctx.translate(15, 0);
  drawStubbyArm(13, 6, true);
  if (inHand) {
    ctx.translate(8, 0);
    drawSporkBlade();
  }
  ctx.restore();
  if (!inHand) {
    const u = (p - 18) / 80;
    ctx.save();
    ctx.translate(16, -58 - Math.sin(u * Math.PI) * 120);
    ctx.rotate(u * Math.PI * 4);
    drawSporkBlade();
    ctx.restore();
  }
}

function drawTitleActor() {

  };
